<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega-Bat</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0d0a14; overflow: hidden; }
    canvas { display: block; }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0d0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #game-logo {
      max-width: min(480px, 80vw);
      max-height: 30vh;
      object-fit: contain;
      animation: logo-zoom-in 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    #game-logo.floating {
      animation: logo-float 7s ease-in-out infinite;
    }
    @keyframes logo-zoom-in {
      from { transform: scale(0.25); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    @keyframes logo-float {
      0%   { transform: translate(0px,   0px)  rotate(0deg);    }
      25%  { transform: translate(6px,  -8px)  rotate(0.8deg);  }
      50%  { transform: translate(-3px, -14px) rotate(-0.5deg); }
      75%  { transform: translate(-7px, -5px)  rotate(0.6deg);  }
      100% { transform: translate(0px,   0px)  rotate(0deg);    }
    }
    #splash-mode {
      margin: 0;
      font: 500 18px/1 sans-serif;
      color: rgba(200,170,255,0.55);
      letter-spacing: 0.06em;
    }
    #splash-best {
      margin: 0;
      font: 500 15px/1 sans-serif;
      color: rgba(180,130,255,0.5);
      letter-spacing: 0.06em;
      display: none;
    }
    .ctrl-btn {
      padding: 14px 32px;
      font: 600 16px/1 sans-serif;
      color: #d8c0ff;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: rgba(150,80,255,0.15);
      border: 2px solid rgba(150,80,255,0.35);
      border-radius: 8px;
      cursor: pointer;
    }
    .ctrl-btn:hover { background: rgba(150,80,255,0.28); }
    #ctrl-choice { display: flex; gap: 16px; }
    #ctrl-choice .btn-touch { border-color: rgba(80,200,150,0.45); }
    #ctrl-choice .btn-touch:hover { background: rgba(80,200,150,0.18); }
    #ctrl-choice .btn-tilt { border-color: rgba(80,160,255,0.45); }
    #ctrl-choice .btn-tilt:hover { background: rgba(80,160,255,0.18); }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.95; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="splash">
    <img id="game-logo" src="./assets/game-plate-images/megabat-game-logo.png" alt="MegaBat">
    <p id="splash-mode">How many bugs in 30 seconds?</p>
    <p id="splash-best"></p>
    <div id="ctrl-choice">
      <button class="ctrl-btn" id="btn-start">Start</button>
      <button class="ctrl-btn btn-touch" id="btn-touch">Touch</button>
      <button class="ctrl-btn btn-tilt" id="btn-tilt">Tilt</button>
    </div>
  </div>

  <script src="./game-plate.js"></script>
  <script>
    var canvas = document.getElementById('game');
    var ctx    = canvas.getContext('2d');
    var splash  = document.getElementById('splash');
    document.getElementById('game-logo').addEventListener('animationend', function () {
      this.classList.add('floating');
    }, { once: true });
    var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var btnStart = document.getElementById('btn-start');
    var btnTouch = document.getElementById('btn-touch');
    var btnTilt  = document.getElementById('btn-tilt');
    if (isMobile) {
      btnStart.style.display = 'none';
    } else {
      btnTouch.style.display = 'none';
      btnTilt.style.display  = 'none';
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; buildVignette(); }
    window.addEventListener('resize', resize);
    resize();

    function dismissSplash() {
      splash.classList.add('hidden');
      splash.addEventListener('transitionend', function () {
        splash.style.display = 'none';
      }, { once: true });
    }

    function start(mode) {
      ctrlMode = mode;
      gameMode = 'easy';
      if (document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
      try { screen.orientation.lock('landscape-primary').catch(function () {}); } catch (e) {}
      var controller = mode === 'tilt' ? 'tilt' : mode === 'keyboard' ? 'keyboard' : 'nes';
      GamePlate.init({ orientation: 'landscape', controller: controller, fullscreen: true, buttons: { a: 'Flap', b: 'Bite' }, calibration: {} });
      var aBtn = document.getElementById('gp-btn-a');
      var bBtn = document.getElementById('gp-btn-b');
      if (aBtn) aBtn.style.display = 'none';
      if (bBtn) bBtn.style.display = 'none';
      dismissSplash();
      swarmActive = false;
      nextSwarmAt = performance.now() + SWARM_INTERVAL_MIN + Math.random() * (SWARM_INTERVAL_MAX - SWARM_INTERVAL_MIN);
      warmupTimer = WARMUP_MAX_DURATION;
      warmupBugsCaught = 0;
      gameState = 'warmup';
    }

    btnStart.addEventListener('click', function () { start('keyboard'); });
    btnTouch.addEventListener('click', function () { start('touch'); });
    btnTilt.addEventListener('click',  function () { start('tilt'); });

    // ── game state ────────────────────────────────────────────────
    var gameState = 'splash';
    var gameMode  = 'easy';
    var ctrlMode  = 'touch';
    var score     = 0;
    var timeLeft  = 30000;
    var highScoreTouch    = parseInt(localStorage.getItem('megabat-highscore-touch')    || '0', 10);
    var highScoreTilt     = parseInt(localStorage.getItem('megabat-highscore-tilt')     || '0', 10);
    var highScoreKeyboard = parseInt(localStorage.getItem('megabat-highscore-keyboard') || '0', 10);

    var warmupTimer      = 0;
    var warmupBugsCaught = 0;
    var countdownPhase   = 0;
    var countdownTimer   = 0;
    var roundEndTimer    = 0;
    var roundScore       = 0;
    var roundIsNewBest   = false;

    var splashBest = document.getElementById('splash-best');

    (function updateSplashBest() {
      var parts = [];
      if (highScoreKeyboard > 0) parts.push('Best: ' + highScoreKeyboard);
      if (highScoreTouch    > 0) parts.push('Touch: ' + highScoreTouch);
      if (highScoreTilt     > 0) parts.push('Tilt: '  + highScoreTilt);
      splashBest.textContent   = parts.join('  |  ');
      splashBest.style.display = parts.length ? 'block' : 'none';
    })();

    function enterCountdown() {
      countdownPhase = 0;
      countdownTimer = COUNTDOWN_READY_MS;
      gameState = 'countdown';
    }

    function startNewRound() {
      score = 0;
      timeLeft = ROUND_DURATION;
      swarmActive = false;
      nextSwarmAt = performance.now() + SWARM_INTERVAL_MIN + Math.random() * (SWARM_INTERVAL_MAX - SWARM_INTERVAL_MIN);
      gameState = 'playing';
    }

    function endRound() {
      roundScore = score;
      var highScore = ctrlMode === 'touch' ? highScoreTouch : ctrlMode === 'tilt' ? highScoreTilt : highScoreKeyboard;
      roundIsNewBest = roundScore > highScore;
      if (roundIsNewBest) {
        if      (ctrlMode === 'touch')    { highScoreTouch    = roundScore; localStorage.setItem('megabat-highscore-touch',    String(roundScore)); }
        else if (ctrlMode === 'tilt')     { highScoreTilt     = roundScore; localStorage.setItem('megabat-highscore-tilt',     String(roundScore)); }
        else                              { highScoreKeyboard = roundScore; localStorage.setItem('megabat-highscore-keyboard', String(roundScore)); }
      }
      roundEndTimer = ROUND_END_DURATION;
      gameState = 'round-end';
    }

    // ── sprite sheet ──────────────────────────────────────────────
    // 1280×1280, 5 cols × 5 rows, 256×256 per frame, transparent PNG.
    // Adjust EYE_X/EYE_Y to tune which point stays at screen center.
    var FRAME_W = 256;
    var FRAME_H = 256;
    var ROW_H   = 256;
    var FRAMES  = 5;
    var FPS     = 8;
    var SCALE   = 0.75;
    var EYE_X   = 110;  // source x of eye within frame (tune me)
    var EYE_Y   = 100;  // source y of eye within frame (tune me)

    var animFrame   = 0;
    var animRow     = 0;
    var animElapsed = 0;
    var glideAnimFrame = 3;
    var glideAnimTimer = 1500;
    var flipX       = false;  // true when bat moves right (sprite faces left natively)

    var spriteCanvas = new Image();
    spriteCanvas.src = './assets/spritesheets/megabat-flapping_wings.png';

    var biteSprite = new Image();
    biteSprite.src = './assets/spritesheets/megabat-biting.png';

    var prevB = false;

    // ── round flow ───────────────────────────────────────────────
    var WARMUP_MAX_DURATION  = 6000;
    var WARMUP_BUG_THRESHOLD = 3;
    var WARMUP_ORB_TARGET    = 6;
    var WARMUP_SPAWN_CHANCE  = 0.02;
    var COUNTDOWN_READY_MS   = 700;
    var COUNTDOWN_SET_MS     = 500;
    var COUNTDOWN_GO_MS      = 350;
    var ROUND_END_DURATION   = 1500;
    var ROUND_DURATION       = 30000;

    // ── orbs ─────────────────────────────────────────────────────
    var ORB_RADIUS           = 5;
    var ORB_EAT_DIST         = 50;
    var ORB_TARGET           = 20;
    var ORB_SPAWN_RADIUS_MIN = 300;
    var ORB_SPAWN_RADIUS_MAX = 700;
    var ORB_LIFETIME_MIN     = 3000;
    var ORB_LIFETIME_MAX     = 8000;
    var PURPLE_CHANCE        = 0.15;
    var PURPLE_MAX_SPEED     = 0.15;
    var GREEN_CHANCE         = 0.04;
    var GREEN_MAX_SPEED      = 0.35;
    var AUTO_BITE_FPS        = 24;
    var SWARM_TARGET            = 45;
    var SWARM_SPAWN_CHANCE      = 0.15;
    var SWARM_INTERVAL_MIN      = 8000;
    var SWARM_INTERVAL_MAX      = 15000;
    var SWARM_DURATION_MIN      = 4000;
    var SWARM_DURATION_MAX      = 7000;
    var SWARM_SPAWN_RADIUS_MIN  = 80;
    var SWARM_SPAWN_RADIUS_MAX  = 200;

    var orbs        = [];
    var autoBiting  = false;
    var autoBiteOrb = null;
    var chompSound  = new Audio('./assets/sounds/megabat-chomp.mp3');
    function playChomp() { var s = chompSound.cloneNode(); s.play(); }
    var swarmActive  = false;
    var nextSwarmAt  = 0;
    var swarmEndsAt  = 0;
    var swarmCenterX = 0;
    var swarmCenterY = 0;

    function spawnOrb(ts) {
      var rand = Math.random();
      var type = rand < GREEN_CHANCE ? 'green'
               : rand < GREEN_CHANCE + PURPLE_CHANCE ? 'purple'
               : 'bug';
      var a    = Math.random() * Math.PI * 2;
      var cx   = swarmActive ? swarmCenterX : camX;
      var cy   = swarmActive ? swarmCenterY : camY;
      var rMin = swarmActive ? SWARM_SPAWN_RADIUS_MIN : ORB_SPAWN_RADIUS_MIN;
      var rMax = swarmActive ? SWARM_SPAWN_RADIUS_MAX : ORB_SPAWN_RADIUS_MAX;
      var r    = rMin + Math.random() * (rMax - rMin);
      orbs.push({
        x:         cx + Math.cos(a) * r,
        y:         cy + Math.sin(a) * r,
        type:      type,
        phase:     Math.random() * Math.PI * 2,
        spawnedAt: ts,
        lifetime:  ORB_LIFETIME_MIN + Math.random() * (ORB_LIFETIME_MAX - ORB_LIFETIME_MIN),
        vx:        type !== 'bug' ? (Math.random() - 0.5) * 0.2 : 0,
        vy:        type !== 'bug' ? (Math.random() - 0.5) * 0.2 : 0,
        consumed:  false
      });
    }

    // ── physics ──────────────────────────────────────────────────
    var camX = 0, camY = 0;
    var velX = 0, velY = 0;
    var prevInpUp        = false;
    var figure8Active     = false;
    var wasDivingMs       = 0;
    var figure8Phase      = 0;
    var figure8Timer      = 0;
    var figure8EntryVelX  = 0;
    var figure8EntryVelY  = 0;
    var figure8StartCamX  = 0;
    var figure8StartCamY  = 0;
    var figure8EntryFlipX = false;
    var figure8ForwardX   = 0;
    var figure8ForwardY   = 0;
    var figure8EntrySpeed = 0;
    var batScreenOffsetX  = 0;
    var batScreenOffsetY  = 0;

    var PASSIVE_ACCEL = 0.00008;
    var ACCEL         = 0.0004;
    var GRAVITY       = 0.0001;
    var FLAP_FORCE    = 0.00025;
    var GLIDE_FACTOR  = 0.3;
    var MAX_SPEED     = 0.4;
    var DAMPING       = 0.999;
    var DIVE_ACCEL    = 0.003;
    var MAX_DIVE_SPEED = 0.9;
    var MAX_TILT      = Math.PI * 0.45;
    var PULLUP_RATE   = 0.003;
    var RICOCHET_THRESHOLD = 0.15;
    var MAX_RICOCHET_SPEED = 0.75;
    var THRUST_MULT        = 2.0;
    var FIGURE8_DURATION   = 700;
    var FIGURE8_SIZE       = 200;
    var SINK_ACCEL         = 0.0006;
    var MAX_SINK_SPEED     = 0.25;

    // ── cavern background tiles ──────────────────────────────────
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function stalactite(oc, x, baseW, h, color) {
      oc.fillStyle = color;
      oc.beginPath();
      oc.moveTo(x - baseW / 2, 0);
      oc.quadraticCurveTo(x - baseW / 5, h * 0.6, x, h);
      oc.quadraticCurveTo(x + baseW / 5, h * 0.6, x + baseW / 2, 0);
      oc.closePath();
      oc.fill();
    }

    function stalagmite(oc, x, tileH, baseW, h, color) {
      oc.fillStyle = color;
      oc.beginPath();
      oc.moveTo(x - baseW / 2, tileH);
      oc.quadraticCurveTo(x - baseW / 5, tileH - h * 0.6, x, tileH - h);
      oc.quadraticCurveTo(x + baseW / 5, tileH - h * 0.6, x + baseW / 2, tileH);
      oc.closePath();
      oc.fill();
    }

    function buildTile(w, h, seed, nSpikes, nRocks, stalColor, stagColor) {
      var el  = document.createElement('canvas');
      el.width = w; el.height = h;
      var oc  = el.getContext('2d');
      var rng = mulberry32(seed);

      oc.fillStyle = '#0d0a14';
      oc.fillRect(0, 0, w, h);

      for (var i = 0; i < nSpikes; i++) {
        stalactite(oc, rng() * w, 16 + rng() * 55, 60 + rng() * 210, stalColor);
      }
      for (var i = 0; i < nSpikes; i++) {
        stalagmite(oc, rng() * w, h, 12 + rng() * 45, 45 + rng() * 170, stagColor);
      }
      for (var i = 0; i < nRocks; i++) {
        var rx = rng() * w;
        var ry = h * 0.15 + rng() * h * 0.7;
        oc.fillStyle = 'rgba(22,14,36,0.8)';
        oc.beginPath();
        oc.ellipse(rx, ry, 22 + rng() * 65, 12 + rng() * 38, rng() * Math.PI, 0, Math.PI * 2);
        oc.fill();
      }
      return el;
    }

    // far = large, sparse, scrolls at 35%
    // near = smaller, denser, scrolls at 100%
    var farTile  = buildTile(920, 700, 42,  6, 4, '#22163a', '#17102c');
    var nearTile = buildTile(720, 540, 99, 11, 7, '#2e1f4a', '#221440');

    function drawTiled(tile, scrollX, scrollY) {
      var tw = tile.width, th = tile.height;
      var ox = -(((scrollX % tw) + tw) % tw);
      var oy = -(((scrollY % th) + th) % th);
      var cols = Math.ceil(canvas.width  / tw) + 2;
      var rows = Math.ceil(canvas.height / th) + 2;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          ctx.drawImage(tile, ox + c * tw, oy + r * th);
        }
      }
    }

    // ── vignette (rebuilt on resize) ─────────────────────────────
    var vigCanvas = null;
    function buildVignette() {
      vigCanvas = document.createElement('canvas');
      vigCanvas.width  = canvas.width;
      vigCanvas.height = canvas.height;
      var vc = vigCanvas.getContext('2d');
      var cx = canvas.width / 2, cy = canvas.height / 2;
      var inner = Math.min(cx, cy) * 0.35;
      var outer = Math.hypot(cx, cy);
      var g = vc.createRadialGradient(cx, cy, inner, cx, cy, outer);
      g.addColorStop(0,   'rgba(0,0,0,0)');
      g.addColorStop(0.6, 'rgba(0,0,0,0.25)');
      g.addColorStop(1,   'rgba(0,0,0,0.82)');
      vc.fillStyle = g;
      vc.fillRect(0, 0, canvas.width, canvas.height);
    }
    buildVignette();

    // ── game loop ─────────────────────────────────────────────────
    var prev = 0;
    function loop(ts) {
      requestAnimationFrame(loop);
      if (GamePlate.paused) return;
      if (gameState === 'splash') return;

      var dt = ts - prev; if (dt > 50) dt = 50; prev = ts;
      var inp = GamePlate.input || {};
      inp.a = true;

      // ── state machine ─────────────────────────────────────────────
      if (gameState === 'warmup') {
        warmupTimer -= dt;
        if (warmupTimer <= 0 || warmupBugsCaught >= WARMUP_BUG_THRESHOLD) {
          enterCountdown();
        }
      }
      if (gameState === 'countdown') {
        countdownTimer -= dt;
        if (countdownTimer <= 0) {
          if (countdownPhase === 0) { countdownPhase = 1; countdownTimer = COUNTDOWN_SET_MS; }
          else if (countdownPhase === 1) { countdownPhase = 2; countdownTimer = COUNTDOWN_GO_MS; }
          else { startNewRound(); }
        }
      }
      if (gameState === 'playing') {
        timeLeft -= dt;
        if (timeLeft <= 0) { timeLeft = 0; endRound(); return; }
      }
      if (gameState === 'round-end') {
        roundEndTimer -= dt;
        if (roundEndTimer <= 0) { enterCountdown(); }
      }

      // Facing direction (locked during attack)
      if (!figure8Active) {
        if (inp.left)  flipX = true;
        if (inp.right) flipX = false;
      }

      var isGliding       = gameMode === 'easy' && !!inp.b;
      var isFlapping      = !!inp.a && !isGliding;
      var isAnimatingFlap = !isGliding && (!!inp.a || velY < -0.05);
      var isDiving        = isFlapping && !!inp.down;
      if (isDiving) wasDivingMs = 250;
      else wasDivingMs = Math.max(0, wasDivingMs - dt);

      // Figure-8 attack trigger: UP press while actively diving (FLAP+DOWN) fast enough
      if ((isDiving || wasDivingMs > 0) && velY > RICOCHET_THRESHOLD && inp.up && !prevInpUp && !figure8Active) {
        figure8Active     = true;
        figure8Phase      = 0;
        figure8Timer      = FIGURE8_DURATION;
        figure8EntryVelX  = velX;
        figure8EntryVelY  = velY;
        figure8StartCamX  = camX;
        figure8StartCamY  = camY;
        figure8EntryFlipX = flipX;
        var entrySpd      = Math.hypot(velX, velY) || 0.001;
        figure8EntrySpeed = entrySpd;
        figure8ForwardX   = velX / entrySpd;
        figure8ForwardY   = velY / entrySpd;
        autoBiting = false; autoBiteOrb = null;
        animFrame = 0; animElapsed = 0;
      }

      if (figure8Active) {
        figure8Timer -= dt;
        var attackProgress = 1 - Math.max(0, figure8Timer / FIGURE8_DURATION);
        var t = attackProgress * Math.PI * 2;

        var a = FIGURE8_SIZE * (figure8EntryVelY / MAX_DIVE_SPEED);

        // Parametric figure-8 in local space (aligned to dive vector):
        //   x(t) = a * sin(t)           — lateral (across dive vector)
        //   y(t) = a * sin(t) * cos(t)  — longitudinal (along dive vector)
        var localX = a * Math.sin(t);
        var localY = a * Math.sin(t) * Math.cos(t);

        // CW perpendicular to forward in screen space (Y-down): right = (fwdY, -fwdX)
        var rightX = figure8ForwardY;
        var rightY = -figure8ForwardX;

        // Camera stays frozen; bat sprite moves via screen offset
        batScreenOffsetX = figure8ForwardX * localY + rightX * localX;
        batScreenOffsetY = figure8ForwardY * localY + rightY * localX;

        // Tangent: d/dt[sin(t)] = cos(t), d/dt[sin(t)cos(t)] = cos(2t)
        var tdX = a * Math.cos(t);
        var tdY = a * Math.cos(2 * t);
        var wtX = figure8ForwardX * tdY + rightX * tdX;
        var wtY = figure8ForwardY * tdY + rightY * tdX;
        figure8Phase = Math.atan2(wtY, wtX);

        velX = 0; velY = 0;
        flipX = false;

        if (figure8Timer <= 0) {
          figure8Active    = false;
          batScreenOffsetX = 0;
          batScreenOffsetY = 0;
          figure8Phase     = 0;
          // Exit tangent at t=2π is local (a,a), normalized (1/√2, 1/√2)
          velX = (figure8ForwardX + rightX) / Math.SQRT2 * figure8EntrySpeed;
          velY = (figure8ForwardY + rightY) / Math.SQRT2 * figure8EntrySpeed;
          flipX = velX < 0;
        }
      } else {
        // Passive forward drift in faced direction
        velX += (flipX ? -1 : 1) * PASSIVE_ACCEL * dt;

        // D-pad acceleration; FLAP held = thrust (faster in pressed direction)
        var accelMult = isFlapping ? THRUST_MULT : 1.0;
        if (inp.left)  velX -= ACCEL * accelMult * dt;
        if (inp.right) velX += ACCEL * accelMult * dt;
        if (inp.up)    velY -= ACCEL * accelMult * dt;
        if (isDiving)  velY += DIVE_ACCEL * dt;
        if (inp.down && !isFlapping) velY = Math.min(velY + SINK_ACCEL * dt, MAX_SINK_SPEED);

        // Gravity always applies; upward movement comes from Up arrow (with optional thrust)
        velY += GRAVITY * dt;

        // Pull-up: pressing up out of a dive bleeds descending speed into forward horizontal speed
        if (inp.up && !isDiving && velY > 0) {
          var transfer = Math.min(velY, PULLUP_RATE * dt);
          velY -= transfer;
          velX += (flipX ? -1 : 1) * transfer;
        }
      }

      prevInpUp = !!inp.up;

      // Clamp, damp, integrate
      velX = Math.max(-MAX_RICOCHET_SPEED, Math.min(MAX_RICOCHET_SPEED, velX));
      velY = Math.max(-MAX_RICOCHET_SPEED, Math.min(MAX_DIVE_SPEED, velY));
      if (!figure8Active) {
        var damp = Math.pow(DAMPING, dt);
        velX *= damp; velY *= damp;
      }
      camX += velX * dt;
      camY += velY * dt;

      var tiltAngle;
      if (figure8Active) {
        tiltAngle = figure8Phase;
      } else if (isDiving) {
        tiltAngle = Math.max(0, velY / MAX_DIVE_SPEED) * MAX_TILT;
      } else {
        tiltAngle = 0;
      }

      // Intermittent wing twitch while coasting
      if (!isAnimatingFlap && !isGliding) {
        glideAnimTimer -= dt;
        if (glideAnimTimer <= 0) {
          if (glideAnimFrame === 3) {
            glideAnimFrame = 4;
            glideAnimTimer = 80 + Math.random() * 120;
          } else {
            glideAnimFrame = 3;
            glideAnimTimer = 1000 + Math.random() * 2000;
          }
        }
      }

      // Purple bug movement + orb lifetime expiry; count active regular bugs
      var activeBugCount = 0;
      for (var oi = 0; oi < orbs.length; oi++) {
        var orb = orbs[oi];
        if (orb.consumed) continue;
        if (ts - orb.spawnedAt > orb.lifetime) { orb.consumed = true; continue; }
        if (orb.type === 'purple') {
          orb.vx += (Math.random() - 0.5) * 0.0006 * dt;
          orb.vy += (Math.random() - 0.5) * 0.0006 * dt;
          orb.vx = Math.max(-PURPLE_MAX_SPEED, Math.min(PURPLE_MAX_SPEED, orb.vx));
          orb.vy = Math.max(-PURPLE_MAX_SPEED, Math.min(PURPLE_MAX_SPEED, orb.vy));
          orb.x += orb.vx * dt;
          orb.y += orb.vy * dt;
        } else if (orb.type === 'green') {
          orb.vx += (Math.random() - 0.5) * 0.003 * dt;
          orb.vy += (Math.random() - 0.5) * 0.003 * dt;
          orb.vx = Math.max(-GREEN_MAX_SPEED, Math.min(GREEN_MAX_SPEED, orb.vx));
          orb.vy = Math.max(-GREEN_MAX_SPEED, Math.min(GREEN_MAX_SPEED, orb.vy));
          orb.x += orb.vx * dt;
          orb.y += orb.vy * dt;
        } else {
          activeBugCount++;
        }
      }

      // Swarm timing
      if (!swarmActive && ts >= nextSwarmAt) {
        swarmActive  = true;
        swarmCenterX = camX;
        swarmCenterY = camY;
        swarmEndsAt  = ts + SWARM_DURATION_MIN + Math.random() * (SWARM_DURATION_MAX - SWARM_DURATION_MIN);
      } else if (swarmActive && ts >= swarmEndsAt) {
        swarmActive = false;
        nextSwarmAt = ts + SWARM_INTERVAL_MIN + Math.random() * (SWARM_INTERVAL_MAX - SWARM_INTERVAL_MIN);
      }

      // Spawn new orbs — density varies by state
      var spawnTarget, spawnChance;
      if (gameState === 'round-end') {
        spawnTarget = 0; spawnChance = 0;
      } else if (gameState === 'warmup') {
        spawnTarget = WARMUP_ORB_TARGET; spawnChance = WARMUP_SPAWN_CHANCE;
      } else if (gameState === 'countdown') {
        var rampFactor = countdownPhase / 2;
        spawnTarget = Math.round(WARMUP_ORB_TARGET + (ORB_TARGET - WARMUP_ORB_TARGET) * rampFactor);
        spawnChance = 0.02 + 0.02 * rampFactor;
      } else {
        spawnTarget = swarmActive ? SWARM_TARGET : ORB_TARGET;
        spawnChance = swarmActive ? SWARM_SPAWN_CHANCE : 0.04;
      }
      if (activeBugCount < spawnTarget && Math.random() < spawnChance) {
        spawnOrb(ts);
      }

      // Orb collision — use bat's actual world position (offset during figure-8)
      var batEffX = camX + batScreenOffsetX;
      var batEffY = camY + batScreenOffsetY;
      if (gameMode === 'hard' && !figure8Active) {
        // Hard: B tap chomps if bug is in range + facing
        if (inp.b && !prevB && !autoBiting) {
          autoBiting = true; autoBiteOrb = null;
          animFrame = 0; animElapsed = 0;
          for (var oi = 0; oi < orbs.length; oi++) {
            var orb = orbs[oi];
            if (orb.consumed) continue;
            var odx = orb.x - batEffX, ody = orb.y - batEffY;
            var odist = Math.sqrt(odx * odx + ody * ody);
            var facing = flipX ? odx < 0 : odx > 0;
            if (odist < ORB_EAT_DIST * 2.5 && facing) { autoBiteOrb = orb; break; }
          }
        }
      } else {
        // Easy or figure8Active: auto-catch on proximity; figure8/glide = instant consume, no facing check
        for (var oi = 0; oi < orbs.length; oi++) {
          var orb = orbs[oi];
          if (orb.consumed) continue;
          var odx = orb.x - batEffX, ody = orb.y - batEffY;
          var odist = Math.sqrt(odx * odx + ody * ody);
          var facing = flipX ? odx < 0 : odx > 0;
          if (odist < ORB_EAT_DIST && (figure8Active || facing)) {
            if (isGliding || figure8Active) {
              orb.consumed = true;
              var pts = orb.type === 'purple' ? 5 : orb.type === 'green' ? 10 : 1;
              if (gameState === 'warmup') { warmupBugsCaught++; }
              if (gameState === 'playing') { score += pts; }
              playChomp();
              if (navigator.vibrate) navigator.vibrate([40, 20, 60]);
            } else if (!autoBiting) {
              autoBiting  = true; autoBiteOrb = orb;
              animFrame   = 0; animElapsed = 0;
            }
          }
        }
      }

      // Advance sprite animation when flapping or auto-biting
      if (isAnimatingFlap || autoBiting || figure8Active) {
        animElapsed += dt;
        var frameMs = (autoBiting || figure8Active) ? 1000 / AUTO_BITE_FPS : 1000 / FPS;
        if (animElapsed >= frameMs) {
          var nextFrame = (animFrame + 1) % FRAMES;
          if (autoBiting && nextFrame === 0) {
            if (autoBiteOrb) {
              var bPts = autoBiteOrb.type === 'purple' ? 5 : autoBiteOrb.type === 'green' ? 10 : 1;
              if (gameState === 'warmup') { warmupBugsCaught++; }
              if (gameState === 'playing') { score += bPts; }
              autoBiteOrb.consumed = true;
              playChomp();
              if (navigator.vibrate) navigator.vibrate([40, 20, 60]);
            }
            autoBiting  = false;
            autoBiteOrb = null;
          }
          animFrame    = nextFrame;
          animElapsed -= frameMs;
        }
      }

      // Draw
      ctx.fillStyle = '#0d0a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawTiled(farTile,  camX * 0.35, camY * 0.35);
      drawTiled(nearTile, camX,        camY);

      if (vigCanvas) ctx.drawImage(vigCanvas, 0, 0);

      // HUD
      ctx.save();
      ctx.textBaseline = 'top';

      // Timer — playing only
      if (gameState === 'playing') {
        ctx.font = 'bold 48px monospace';
        ctx.fillStyle = timeLeft < 10000 ? 'rgba(255,80,80,0.9)' : 'rgba(255,255,255,0.8)';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(timeLeft / 1000), canvas.width / 2, 16);
      }

      // Score (top-right) — playing only
      if (gameState === 'playing') {
        ctx.font = 'bold 28px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.textAlign = 'right';
        ctx.fillText(score + (score === 1 ? ' bug' : ' bugs'), canvas.width - 20, 22);
        var hudBest = gameMode === 'easy' ? highScoreEasy : highScoreHard;
        if (hudBest > 0) {
          ctx.font = '16px monospace';
          ctx.fillStyle = 'rgba(180,130,255,0.55)';
          ctx.fillText('best ' + hudBest, canvas.width - 20, 58);
        }
      }

      // Swarm indicator — playing only
      if (swarmActive && gameState === 'playing') {
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(255,' + Math.floor(80 + 80 * Math.sin(ts * 0.008)) + ',20,0.9)';
        ctx.fillText('SWARM!', 20, 22);
      }

      // Countdown overlay
      if (gameState === 'countdown') {
        var cdLabel = ['READY', 'SET', 'GO'][countdownPhase];
        var cdY = canvas.height * 0.38;
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.font = 'bold 64px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText(cdLabel, canvas.width / 2, cdY);
      }

      // Round-end overlay
      if (gameState === 'round-end') {
        var reProgress = 1 - roundEndTimer / ROUND_END_DURATION;
        var reAlpha = reProgress < 0.1 ? reProgress * 10 : (reProgress > 0.8 ? (1 - reProgress) * 5 : 1);
        var reY = canvas.height / 2 - 160;
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.font = 'bold 64px monospace';
        ctx.fillStyle = 'rgba(255,255,255,' + reAlpha + ')';
        ctx.fillText(roundScore + (roundScore === 1 ? ' bug' : ' bugs'), canvas.width / 2, reY);
        var displayBest = gameMode === 'easy' ? highScoreEasy : highScoreHard;
        if (roundIsNewBest) {
          ctx.font = 'bold 32px monospace';
          ctx.fillStyle = 'rgba(176,96,255,' + reAlpha + ')';
          ctx.fillText('New Best!', canvas.width / 2, reY + 64);
        } else if (displayBest > 0) {
          ctx.font = '24px monospace';
          ctx.fillStyle = 'rgba(180,130,255,' + (reAlpha * 0.7) + ')';
          ctx.fillText('best ' + displayBest, canvas.width / 2, reY + 64);
        }
      }

      ctx.restore();

      // Reset animation on glide start so mouth-open starts from frame 0
      if (isGliding && !prevB) { animFrame = 0; animElapsed = 0; autoBiting = false; autoBiteOrb = null; }
      prevB = inp.b;

      var activeSprite = (isGliding || autoBiting || figure8Active) ? biteSprite : spriteCanvas;

      // Draw orbs behind bat
      for (var oi = 0; oi < orbs.length; oi++) {
        var orb = orbs[oi];
        if (orb.consumed) continue;
        var sx = canvas.width  / 2 + (orb.x - camX);
        var sy = canvas.height / 2 + (orb.y - camY);
        var baseR   = (orb.type === 'purple' || orb.type === 'green') ? ORB_RADIUS * 1.4 : ORB_RADIUS;
        var twinkle = 0.85 + 0.15 * Math.sin(ts * 0.004 + orb.phase);
        var dr      = baseR * twinkle;
        if (sx < -dr * 3 || sx > canvas.width  + dr * 3) continue;
        if (sy < -dr * 3 || sy > canvas.height + dr * 3) continue;
        var glow = 0.75 + 0.2 * twinkle;
        var grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, dr * 2.5);
        if (orb.type === 'purple') {
          grd.addColorStop(0,   'rgba(240,180,255,' + glow + ')');
          grd.addColorStop(0.3, 'rgba(180,60,255,0.85)');
          grd.addColorStop(0.7, 'rgba(100,0,200,0.4)');
          grd.addColorStop(1,   'rgba(100,0,200,0)');
        } else if (orb.type === 'green') {
          grd.addColorStop(0,   'rgba(180,255,160,' + glow + ')');
          grd.addColorStop(0.3, 'rgba(40,220,60,0.85)');
          grd.addColorStop(0.7, 'rgba(0,150,20,0.4)');
          grd.addColorStop(1,   'rgba(0,150,20,0)');
        } else {
          grd.addColorStop(0,   'rgba(255,240,80,' + glow + ')');
          grd.addColorStop(0.3, 'rgba(255,140,20,0.85)');
          grd.addColorStop(0.7, 'rgba(200,40,0,0.4)');
          grd.addColorStop(1,   'rgba(200,40,0,0)');
        }
        ctx.beginPath();
        ctx.arc(sx, sy, dr * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      }

      // Bat: centered on eye, flipped when moving left
      if (activeSprite.complete && activeSprite.naturalWidth) {
        var srcX = (isGliding || isAnimatingFlap || autoBiting || figure8Active ? animFrame : glideAnimFrame) * FRAME_W;
        var srcY = animRow   * ROW_H;
        var dw   = FRAME_W * SCALE;
        var dh   = FRAME_H * SCALE;

        ctx.save();
        ctx.translate(canvas.width / 2 + batScreenOffsetX, canvas.height / 2 + batScreenOffsetY);
        if (flipX) ctx.scale(-1, 1);
        ctx.rotate(tiltAngle);
        ctx.drawImage(activeSprite, srcX, srcY, FRAME_W, FRAME_H,
          -EYE_X * SCALE, -EYE_Y * SCALE, dw, dh);
        ctx.restore();
      }
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
