<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega-Bat</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0d0a14; overflow: hidden; }
    canvas { display: block; }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0d0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash h1 {
      margin: 0;
      font: 700 52px/1 sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d8c0ff;
    }
    #splash-hint {
      margin: 0;
      font: 17px/1 sans-serif;
      color: rgba(200,170,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      animation: pulse 2s ease-in-out infinite;
    }
    .ctrl-btn {
      padding: 14px 32px;
      font: 600 16px/1 sans-serif;
      color: #d8c0ff;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: rgba(150,80,255,0.15);
      border: 2px solid rgba(150,80,255,0.35);
      border-radius: 8px;
      cursor: pointer;
    }
    .ctrl-btn:hover { background: rgba(150,80,255,0.28); }
    #ctrl-choice { display: none; gap: 16px; }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.95; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="splash">
    <h1>Mega-Bat</h1>
    <p id="splash-hint">click to start</p>
    <div id="ctrl-choice">
      <button class="ctrl-btn" id="btn-nes">NES Pad</button>
      <button class="ctrl-btn" id="btn-tilt">Tilt</button>
    </div>
  </div>

  <script src="./game-plate.js"></script>
  <script>
    var canvas = document.getElementById('game');
    var ctx    = canvas.getContext('2d');
    var splash     = document.getElementById('splash');
    var hint       = document.getElementById('splash-hint');
    var ctrlChoice = document.getElementById('ctrl-choice');
    var btnNes     = document.getElementById('btn-nes');
    var btnTilt    = document.getElementById('btn-tilt');

    var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isMobile) { hint.style.display = 'none'; ctrlChoice.style.display = 'flex'; }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; buildVignette(); }
    window.addEventListener('resize', resize);
    resize();

    function dismissSplash() {
      splash.classList.add('hidden');
      splash.addEventListener('transitionend', function () { splash.remove(); }, { once: true });
    }

    hint.addEventListener('click', function () {
      GamePlate.init({ orientation: 'landscape', controller: 'keyboard', fullscreen: true });
      dismissSplash();
    });

    btnNes.addEventListener('click', function () {
      GamePlate.init({ orientation: 'landscape', controller: 'nes', fullscreen: true });
      dismissSplash();
    });

    btnTilt.addEventListener('click', function () {
      try { screen.orientation.lock('landscape-primary').catch(function () {}); } catch (e) {}
      GamePlate.init({ orientation: 'landscape', controller: 'tilt', fullscreen: true });
      dismissSplash();
    });

    // ── sprite sheet ──────────────────────────────────────────────
    // 1280×1280, 5 cols × 5 rows, 256×256 per frame, transparent PNG.
    // Adjust EYE_X/EYE_Y to tune which point stays at screen center.
    var FRAME_W = 256;
    var FRAME_H = 256;
    var ROW_H   = 256;
    var FRAMES  = 5;
    var FPS     = 8;
    var SCALE   = 0.75;
    var EYE_X   = 110;  // source x of eye within frame (tune me)
    var EYE_Y   = 100;  // source y of eye within frame (tune me)

    var animFrame   = 0;
    var animRow     = 0;
    var animElapsed = 0;
    var flipX       = false;  // true when bat moves right (sprite faces left natively)

    var spriteCanvas = new Image();
    spriteCanvas.src = './assets/spritesheets/megabat-flapping_wings.png';

    var biteSprite = new Image();
    biteSprite.src = './assets/spritesheets/megabat-biting.png';

    var prevB = false;

    // ── camera ───────────────────────────────────────────────────
    var camX = 0, camY = 0;
    var SPEED = 0.2;  // px per ms

    // ── cavern background tiles ──────────────────────────────────
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function stalactite(oc, x, baseW, h, color) {
      oc.fillStyle = color;
      oc.beginPath();
      oc.moveTo(x - baseW / 2, 0);
      oc.quadraticCurveTo(x - baseW / 5, h * 0.6, x, h);
      oc.quadraticCurveTo(x + baseW / 5, h * 0.6, x + baseW / 2, 0);
      oc.closePath();
      oc.fill();
    }

    function stalagmite(oc, x, tileH, baseW, h, color) {
      oc.fillStyle = color;
      oc.beginPath();
      oc.moveTo(x - baseW / 2, tileH);
      oc.quadraticCurveTo(x - baseW / 5, tileH - h * 0.6, x, tileH - h);
      oc.quadraticCurveTo(x + baseW / 5, tileH - h * 0.6, x + baseW / 2, tileH);
      oc.closePath();
      oc.fill();
    }

    function buildTile(w, h, seed, nSpikes, nRocks, stalColor, stagColor) {
      var el  = document.createElement('canvas');
      el.width = w; el.height = h;
      var oc  = el.getContext('2d');
      var rng = mulberry32(seed);

      oc.fillStyle = '#0d0a14';
      oc.fillRect(0, 0, w, h);

      for (var i = 0; i < nSpikes; i++) {
        stalactite(oc, rng() * w, 16 + rng() * 55, 60 + rng() * 210, stalColor);
      }
      for (var i = 0; i < nSpikes; i++) {
        stalagmite(oc, rng() * w, h, 12 + rng() * 45, 45 + rng() * 170, stagColor);
      }
      for (var i = 0; i < nRocks; i++) {
        var rx = rng() * w;
        var ry = h * 0.15 + rng() * h * 0.7;
        oc.fillStyle = 'rgba(22,14,36,0.8)';
        oc.beginPath();
        oc.ellipse(rx, ry, 22 + rng() * 65, 12 + rng() * 38, rng() * Math.PI, 0, Math.PI * 2);
        oc.fill();
      }
      return el;
    }

    // far = large, sparse, scrolls at 35%
    // near = smaller, denser, scrolls at 100%
    var farTile  = buildTile(920, 700, 42,  6, 4, '#22163a', '#17102c');
    var nearTile = buildTile(720, 540, 99, 11, 7, '#2e1f4a', '#221440');

    function drawTiled(tile, scrollX, scrollY) {
      var tw = tile.width, th = tile.height;
      var ox = -(((scrollX % tw) + tw) % tw);
      var oy = -(((scrollY % th) + th) % th);
      var cols = Math.ceil(canvas.width  / tw) + 2;
      var rows = Math.ceil(canvas.height / th) + 2;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          ctx.drawImage(tile, ox + c * tw, oy + r * th);
        }
      }
    }

    // ── vignette (rebuilt on resize) ─────────────────────────────
    var vigCanvas = null;
    function buildVignette() {
      vigCanvas = document.createElement('canvas');
      vigCanvas.width  = canvas.width;
      vigCanvas.height = canvas.height;
      var vc = vigCanvas.getContext('2d');
      var cx = canvas.width / 2, cy = canvas.height / 2;
      var inner = Math.min(cx, cy) * 0.35;
      var outer = Math.hypot(cx, cy);
      var g = vc.createRadialGradient(cx, cy, inner, cx, cy, outer);
      g.addColorStop(0,   'rgba(0,0,0,0)');
      g.addColorStop(0.6, 'rgba(0,0,0,0.25)');
      g.addColorStop(1,   'rgba(0,0,0,0.82)');
      vc.fillStyle = g;
      vc.fillRect(0, 0, canvas.width, canvas.height);
    }
    buildVignette();

    // ── game loop ─────────────────────────────────────────────────
    var prev = 0;
    function loop(ts) {
      requestAnimationFrame(loop);

      var dt = ts - prev; if (dt > 50) dt = 50; prev = ts;
      var inp = GamePlate.input || {};

      // Move camera; track which way bat faces (sprite is natively left-facing)
      if (inp.left)  { camX -= SPEED * dt; flipX = true;  }
      if (inp.right) { camX += SPEED * dt; flipX = false; }
      if (inp.up)    camY -= SPEED * dt;
      if (inp.down)  camY += SPEED * dt;

      // Advance sprite animation
      animElapsed += dt;
      if (animElapsed >= 1000 / FPS) {
        animFrame    = (animFrame + 1) % FRAMES;
        animElapsed -= 1000 / FPS;
      }

      // Draw
      ctx.fillStyle = '#0d0a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawTiled(farTile,  camX * 0.35, camY * 0.35);
      drawTiled(nearTile, camX,        camY);

      if (vigCanvas) ctx.drawImage(vigCanvas, 0, 0);

      // Reset animation on B press so bite starts from frame 0
      if (inp.b && !prevB) { animFrame = 0; animElapsed = 0; }
      prevB = inp.b;

      var activeSprite = inp.b ? biteSprite : spriteCanvas;

      // Bat: centered on eye, flipped when moving left
      if (activeSprite.complete && activeSprite.naturalWidth) {
        var srcX = animFrame * FRAME_W;
        var srcY = animRow   * ROW_H;
        var dw   = FRAME_W * SCALE;
        var dh   = FRAME_H * SCALE;

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        if (flipX) ctx.scale(-1, 1);
        ctx.drawImage(activeSprite, srcX, srcY, FRAME_W, FRAME_H,
          -EYE_X * SCALE, -EYE_Y * SCALE, dw, dh);
        ctx.restore();
      }
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
