<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega-Bat</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0d0a14; overflow: hidden; }
    canvas { display: block; }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0d0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash h1 {
      margin: 0;
      font: 700 52px/1 sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d8c0ff;
    }
    #splash-mode {
      margin: 0;
      font: 500 18px/1 sans-serif;
      color: rgba(200,170,255,0.55);
      letter-spacing: 0.06em;
    }
    #splash-best {
      margin: 0;
      font: 500 15px/1 sans-serif;
      color: rgba(180,130,255,0.5);
      letter-spacing: 0.06em;
      display: none;
    }
    .ctrl-btn {
      padding: 14px 32px;
      font: 600 16px/1 sans-serif;
      color: #d8c0ff;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: rgba(150,80,255,0.15);
      border: 2px solid rgba(150,80,255,0.35);
      border-radius: 8px;
      cursor: pointer;
    }
    .ctrl-btn:hover { background: rgba(150,80,255,0.28); }
    #ctrl-choice { display: flex; gap: 16px; }
    #ctrl-choice .btn-easy { border-color: rgba(80,200,150,0.45); }
    #ctrl-choice .btn-easy:hover { background: rgba(80,200,150,0.18); }
    #ctrl-choice .btn-hard { border-color: rgba(255,80,80,0.45); }
    #ctrl-choice .btn-hard:hover { background: rgba(255,80,80,0.18); }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.95; }
    }
    #gameover {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0d0a14;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #gameover h1 {
      margin: 0;
      font: 700 52px/1 sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d8c0ff;
    }
    #gameover .score-line {
      margin: 0;
      font: 500 26px/1 sans-serif;
      color: rgba(200,170,255,0.8);
    }
    #go-newbest {
      margin: 0;
      font: 700 22px/1 sans-serif;
      color: #b060ff;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      animation: pulse 1s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="splash">
    <h1>MegaBat</h1>
    <p id="splash-mode">How many bugs in 30 seconds?</p>
    <p id="splash-best"></p>
    <div id="ctrl-choice">
      <button class="ctrl-btn btn-easy" id="btn-easy">Easy</button>
      <button class="ctrl-btn btn-hard" id="btn-hard">Hard</button>
    </div>
  </div>
  <div id="gameover">
    <h1>Time's Up!</h1>
    <p id="go-score" class="score-line"></p>
    <p id="go-best" class="score-line"></p>
    <p id="go-newbest" style="display:none">New Best!</p>
    <button class="ctrl-btn" onclick="resetGame()">Play Again</button>
  </div>

  <script src="./game-plate.js"></script>
  <script>
    var canvas = document.getElementById('game');
    var ctx    = canvas.getContext('2d');
    var splash  = document.getElementById('splash');
    var btnEasy = document.getElementById('btn-easy');
    var btnHard = document.getElementById('btn-hard');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; buildVignette(); }
    window.addEventListener('resize', resize);
    resize();

    function dismissSplash() {
      splash.classList.add('hidden');
      splash.addEventListener('transitionend', function () {
        splash.style.display = 'none';
      }, { once: true });
    }

    function start(mode) {
      gameMode = mode;
      var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      var controller = isMobile ? 'nes' : 'keyboard';
      if (document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
      try { screen.orientation.lock('landscape-primary').catch(function () {}); } catch (e) {}
      GamePlate.init({ orientation: 'landscape', controller: controller, fullscreen: true, buttons: { a: 'Flap', b: 'Bite' } });
      if (mode === 'easy') {
        var bBtn = document.getElementById('gp-btn-b');
        if (bBtn) bBtn.style.display = 'none';
      }
      dismissSplash();
      gameState = 'playing';
    }

    btnEasy.addEventListener('click', function () { start('easy'); });
    btnHard.addEventListener('click', function () { start('hard'); });

    // ── game state ────────────────────────────────────────────────
    var gameState = 'splash';
    var gameMode  = 'easy';
    var score     = 0;
    var timeLeft  = 30000;
    var highScoreEasy = parseInt(localStorage.getItem('megabat-highscore-easy') || '0', 10);
    var highScoreHard = parseInt(localStorage.getItem('megabat-highscore-hard') || '0', 10);

    var gameoverDiv = document.getElementById('gameover');
    var goScore     = document.getElementById('go-score');
    var goBest      = document.getElementById('go-best');
    var goNewBest   = document.getElementById('go-newbest');
    var splashBest  = document.getElementById('splash-best');

    if (highScoreEasy > 0 || highScoreHard > 0) {
      var parts = [];
      if (highScoreEasy > 0) parts.push('Easy: ' + highScoreEasy);
      if (highScoreHard > 0) parts.push('Hard: ' + highScoreHard);
      splashBest.textContent = parts.join('  |  ');
      splashBest.style.display = 'block';
    }

    function resetGame() {
      score = 0;
      timeLeft = 30000;
      orbs = [];
      autoBiting = false; autoBiteOrb = null;
      camX = 0; camY = 0; velX = 0; velY = 0;
      animFrame = 0; animRow = 0; animElapsed = 0;
      glideAnimFrame = 3; glideAnimTimer = 1500;
      flipX = false; prevB = false; prev = 0;
      gameoverDiv.style.display = 'none';
      gameState = 'playing';
    }

    function triggerGameOver() {
      gameState = 'gameover';
      var highScore = gameMode === 'easy' ? highScoreEasy : highScoreHard;
      var isNewBest = score > highScore;
      if (isNewBest) {
        highScore = score;
        if (gameMode === 'easy') {
          highScoreEasy = score;
          localStorage.setItem('megabat-highscore-easy', String(score));
        } else {
          highScoreHard = score;
          localStorage.setItem('megabat-highscore-hard', String(score));
        }
      }
      goScore.textContent = 'You got ' + score + (score === 1 ? ' bug' : ' bugs') + '!';
      goBest.textContent  = 'Best: ' + highScore + (highScore === 1 ? ' bug' : ' bugs');
      goNewBest.style.display = isNewBest ? 'block' : 'none';
      gameoverDiv.style.display = 'flex';
    }

    // ── sprite sheet ──────────────────────────────────────────────
    // 1280×1280, 5 cols × 5 rows, 256×256 per frame, transparent PNG.
    // Adjust EYE_X/EYE_Y to tune which point stays at screen center.
    var FRAME_W = 256;
    var FRAME_H = 256;
    var ROW_H   = 256;
    var FRAMES  = 5;
    var FPS     = 8;
    var SCALE   = 0.75;
    var EYE_X   = 110;  // source x of eye within frame (tune me)
    var EYE_Y   = 100;  // source y of eye within frame (tune me)

    var animFrame   = 0;
    var animRow     = 0;
    var animElapsed = 0;
    var glideAnimFrame = 3;
    var glideAnimTimer = 1500;
    var flipX       = false;  // true when bat moves right (sprite faces left natively)

    var spriteCanvas = new Image();
    spriteCanvas.src = './assets/spritesheets/megabat-flapping_wings.png';

    var biteSprite = new Image();
    biteSprite.src = './assets/spritesheets/megabat-biting.png';

    var prevB = false;

    // ── orbs ─────────────────────────────────────────────────────
    var ORB_RADIUS           = 5;
    var ORB_EAT_DIST         = 50;
    var ORB_TARGET           = 10;
    var ORB_SPAWN_RADIUS_MIN = 300;
    var ORB_SPAWN_RADIUS_MAX = 700;
    var ORB_LIFETIME_MIN     = 3000;
    var ORB_LIFETIME_MAX     = 8000;
    var PURPLE_CHANCE        = 0.15;
    var PURPLE_MAX_SPEED     = 0.15;
    var GREEN_CHANCE         = 0.04;
    var GREEN_MAX_SPEED      = 0.35;
    var AUTO_BITE_FPS        = 24;

    var orbs        = [];
    var autoBiting  = false;
    var autoBiteOrb = null;
    var chompSound  = new Audio('./assets/sounds/megabat-chomp.mp3');

    function spawnOrb(ts) {
      var rand = Math.random();
      var type = rand < GREEN_CHANCE ? 'green'
               : rand < GREEN_CHANCE + PURPLE_CHANCE ? 'purple'
               : 'bug';
      var a = Math.random() * Math.PI * 2;
      var r = ORB_SPAWN_RADIUS_MIN + Math.random() * (ORB_SPAWN_RADIUS_MAX - ORB_SPAWN_RADIUS_MIN);
      orbs.push({
        x:         camX + Math.cos(a) * r,
        y:         camY + Math.sin(a) * r,
        type:      type,
        phase:     Math.random() * Math.PI * 2,
        spawnedAt: ts,
        lifetime:  ORB_LIFETIME_MIN + Math.random() * (ORB_LIFETIME_MAX - ORB_LIFETIME_MIN),
        vx:        type !== 'bug' ? (Math.random() - 0.5) * 0.2 : 0,
        vy:        type !== 'bug' ? (Math.random() - 0.5) * 0.2 : 0,
        consumed:  false
      });
    }

    // ── physics ──────────────────────────────────────────────────
    var camX = 0, camY = 0;
    var velX = 0, velY = 0;

    var PASSIVE_ACCEL = 0.00008;
    var ACCEL         = 0.0004;
    var GRAVITY       = 0.0001;
    var FLAP_FORCE    = 0.00025;
    var GLIDE_FACTOR  = 0.3;
    var MAX_SPEED     = 0.4;
    var DAMPING       = 0.999;

    // ── cavern background tiles ──────────────────────────────────
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function stalactite(oc, x, baseW, h, color) {
      oc.fillStyle = color;
      oc.beginPath();
      oc.moveTo(x - baseW / 2, 0);
      oc.quadraticCurveTo(x - baseW / 5, h * 0.6, x, h);
      oc.quadraticCurveTo(x + baseW / 5, h * 0.6, x + baseW / 2, 0);
      oc.closePath();
      oc.fill();
    }

    function stalagmite(oc, x, tileH, baseW, h, color) {
      oc.fillStyle = color;
      oc.beginPath();
      oc.moveTo(x - baseW / 2, tileH);
      oc.quadraticCurveTo(x - baseW / 5, tileH - h * 0.6, x, tileH - h);
      oc.quadraticCurveTo(x + baseW / 5, tileH - h * 0.6, x + baseW / 2, tileH);
      oc.closePath();
      oc.fill();
    }

    function buildTile(w, h, seed, nSpikes, nRocks, stalColor, stagColor) {
      var el  = document.createElement('canvas');
      el.width = w; el.height = h;
      var oc  = el.getContext('2d');
      var rng = mulberry32(seed);

      oc.fillStyle = '#0d0a14';
      oc.fillRect(0, 0, w, h);

      for (var i = 0; i < nSpikes; i++) {
        stalactite(oc, rng() * w, 16 + rng() * 55, 60 + rng() * 210, stalColor);
      }
      for (var i = 0; i < nSpikes; i++) {
        stalagmite(oc, rng() * w, h, 12 + rng() * 45, 45 + rng() * 170, stagColor);
      }
      for (var i = 0; i < nRocks; i++) {
        var rx = rng() * w;
        var ry = h * 0.15 + rng() * h * 0.7;
        oc.fillStyle = 'rgba(22,14,36,0.8)';
        oc.beginPath();
        oc.ellipse(rx, ry, 22 + rng() * 65, 12 + rng() * 38, rng() * Math.PI, 0, Math.PI * 2);
        oc.fill();
      }
      return el;
    }

    // far = large, sparse, scrolls at 35%
    // near = smaller, denser, scrolls at 100%
    var farTile  = buildTile(920, 700, 42,  6, 4, '#22163a', '#17102c');
    var nearTile = buildTile(720, 540, 99, 11, 7, '#2e1f4a', '#221440');

    function drawTiled(tile, scrollX, scrollY) {
      var tw = tile.width, th = tile.height;
      var ox = -(((scrollX % tw) + tw) % tw);
      var oy = -(((scrollY % th) + th) % th);
      var cols = Math.ceil(canvas.width  / tw) + 2;
      var rows = Math.ceil(canvas.height / th) + 2;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          ctx.drawImage(tile, ox + c * tw, oy + r * th);
        }
      }
    }

    // ── vignette (rebuilt on resize) ─────────────────────────────
    var vigCanvas = null;
    function buildVignette() {
      vigCanvas = document.createElement('canvas');
      vigCanvas.width  = canvas.width;
      vigCanvas.height = canvas.height;
      var vc = vigCanvas.getContext('2d');
      var cx = canvas.width / 2, cy = canvas.height / 2;
      var inner = Math.min(cx, cy) * 0.35;
      var outer = Math.hypot(cx, cy);
      var g = vc.createRadialGradient(cx, cy, inner, cx, cy, outer);
      g.addColorStop(0,   'rgba(0,0,0,0)');
      g.addColorStop(0.6, 'rgba(0,0,0,0.25)');
      g.addColorStop(1,   'rgba(0,0,0,0.82)');
      vc.fillStyle = g;
      vc.fillRect(0, 0, canvas.width, canvas.height);
    }
    buildVignette();

    // ── game loop ─────────────────────────────────────────────────
    var prev = 0;
    function loop(ts) {
      requestAnimationFrame(loop);
      if (GamePlate.paused) return;
      if (gameState !== 'playing') return;

      var dt = ts - prev; if (dt > 50) dt = 50; prev = ts;
      var inp = GamePlate.input || {};

      // Timer countdown
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        triggerGameOver();
        return;
      }

      // Facing direction
      if (inp.left)  flipX = true;
      if (inp.right) flipX = false;

      var isGliding      = gameMode === 'easy' && !!inp.b;
      var isFlapping     = !!inp.a && !isGliding;
      var isAnimatingFlap = !!inp.a && !isGliding;

      // Passive forward drift in faced direction
      velX += (flipX ? -1 : 1) * PASSIVE_ACCEL * dt;

      // D-pad acceleration (up blocked while gliding — no lift without flapping)
      if (inp.left)              velX -= ACCEL * dt;
      if (inp.right)             velX += ACCEL * dt;
      if (inp.up && isFlapping)  velY -= ACCEL * dt;
      if (inp.down)              velY += ACCEL * dt;

      // Gravity and lift
      var grav = GRAVITY;
      velY += isFlapping ? -FLAP_FORCE * dt : grav * dt;

      // Clamp, damp, integrate
      velX = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, velX));
      velY = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, velY));
      var damp = Math.pow(DAMPING, dt);
      velX *= damp; velY *= damp;
      camX += velX * dt;
      camY += velY * dt;

      // Intermittent wing twitch while coasting
      if (!isAnimatingFlap && !isGliding) {
        glideAnimTimer -= dt;
        if (glideAnimTimer <= 0) {
          if (glideAnimFrame === 3) {
            glideAnimFrame = 4;
            glideAnimTimer = 80 + Math.random() * 120;
          } else {
            glideAnimFrame = 3;
            glideAnimTimer = 1000 + Math.random() * 2000;
          }
        }
      }

      // Purple bug movement + orb lifetime expiry; count active regular bugs
      var activeBugCount = 0;
      for (var oi = 0; oi < orbs.length; oi++) {
        var orb = orbs[oi];
        if (orb.consumed) continue;
        if (ts - orb.spawnedAt > orb.lifetime) { orb.consumed = true; continue; }
        if (orb.type === 'purple') {
          orb.vx += (Math.random() - 0.5) * 0.0006 * dt;
          orb.vy += (Math.random() - 0.5) * 0.0006 * dt;
          orb.vx = Math.max(-PURPLE_MAX_SPEED, Math.min(PURPLE_MAX_SPEED, orb.vx));
          orb.vy = Math.max(-PURPLE_MAX_SPEED, Math.min(PURPLE_MAX_SPEED, orb.vy));
          orb.x += orb.vx * dt;
          orb.y += orb.vy * dt;
        } else if (orb.type === 'green') {
          orb.vx += (Math.random() - 0.5) * 0.003 * dt;
          orb.vy += (Math.random() - 0.5) * 0.003 * dt;
          orb.vx = Math.max(-GREEN_MAX_SPEED, Math.min(GREEN_MAX_SPEED, orb.vx));
          orb.vy = Math.max(-GREEN_MAX_SPEED, Math.min(GREEN_MAX_SPEED, orb.vy));
          orb.x += orb.vx * dt;
          orb.y += orb.vy * dt;
        } else {
          activeBugCount++;
        }
      }

      // Spawn new orbs to maintain target density
      if (activeBugCount < ORB_TARGET && Math.random() < 0.04) {
        spawnOrb(ts);
      }

      // Orb collision
      if (gameMode === 'hard') {
        // Hard: B tap always chomps; consume bug only if one is in range + facing
        if (inp.b && !prevB && !autoBiting) {
          autoBiting = true; autoBiteOrb = null;
          animFrame = 0; animElapsed = 0;
          for (var oi = 0; oi < orbs.length; oi++) {
            var orb = orbs[oi];
            if (orb.consumed) continue;
            var odx = orb.x - camX, ody = orb.y - camY;
            var odist = Math.sqrt(odx * odx + ody * ody);
            var facing = flipX ? odx < 0 : odx > 0;
            if (odist < ORB_EAT_DIST * 2.5 && facing) { autoBiteOrb = orb; break; }
          }
        }
      } else {
        // Easy: auto-bite on proximity + facing; glide = instant consume
        for (var oi = 0; oi < orbs.length; oi++) {
          var orb = orbs[oi];
          if (orb.consumed) continue;
          var odx = orb.x - camX, ody = orb.y - camY;
          var odist = Math.sqrt(odx * odx + ody * ody);
          var facing = flipX ? odx < 0 : odx > 0;
          if (odist < ORB_EAT_DIST && facing) {
            if (isGliding) {
              orb.consumed = true;
              score += orb.type === 'purple' ? 5 : orb.type === 'green' ? 10 : 1;
              chompSound.currentTime = 0; chompSound.play();
            } else if (!autoBiting) {
              autoBiting  = true; autoBiteOrb = orb;
              animFrame   = 0; animElapsed = 0;
            }
          }
        }
      }

      // Advance sprite animation when flapping or auto-biting
      if (isAnimatingFlap || autoBiting) {
        animElapsed += dt;
        var frameMs = autoBiting ? 1000 / AUTO_BITE_FPS : 1000 / FPS;
        if (animElapsed >= frameMs) {
          var nextFrame = (animFrame + 1) % FRAMES;
          if (autoBiting && nextFrame === 0) {
            if (autoBiteOrb) {
              score += autoBiteOrb.type === 'purple' ? 5 : autoBiteOrb.type === 'green' ? 10 : 1;
              autoBiteOrb.consumed = true;
              chompSound.currentTime = 0; chompSound.play();
            }
            autoBiting  = false;
            autoBiteOrb = null;
          }
          animFrame    = nextFrame;
          animElapsed -= frameMs;
        }
      }

      // Draw
      ctx.fillStyle = '#0d0a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawTiled(farTile,  camX * 0.35, camY * 0.35);
      drawTiled(nearTile, camX,        camY);

      if (vigCanvas) ctx.drawImage(vigCanvas, 0, 0);

      // HUD
      ctx.save();
      ctx.textBaseline = 'top';
      ctx.font = 'bold 48px monospace';
      ctx.fillStyle = timeLeft < 10000 ? 'rgba(255,80,80,0.9)' : 'rgba(255,255,255,0.8)';
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(timeLeft / 1000), canvas.width / 2, 16);
      ctx.font = 'bold 28px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.textAlign = 'right';
      ctx.fillText(score + (score === 1 ? ' bug' : ' bugs'), canvas.width - 20, 22);
      var hudBest = gameMode === 'easy' ? highScoreEasy : highScoreHard;
      if (hudBest > 0) {
        ctx.font = '16px monospace';
        ctx.fillStyle = 'rgba(180,130,255,0.55)';
        ctx.fillText('best ' + hudBest, canvas.width - 20, 58);
      }
      ctx.restore();

      // Reset animation on glide start so mouth-open starts from frame 0
      if (isGliding && !prevB) { animFrame = 0; animElapsed = 0; autoBiting = false; autoBiteOrb = null; }
      prevB = inp.b;

      var activeSprite = (isGliding || autoBiting) ? biteSprite : spriteCanvas;

      // Draw orbs behind bat
      for (var oi = 0; oi < orbs.length; oi++) {
        var orb = orbs[oi];
        if (orb.consumed) continue;
        var sx = canvas.width  / 2 + (orb.x - camX);
        var sy = canvas.height / 2 + (orb.y - camY);
        var baseR   = (orb.type === 'purple' || orb.type === 'green') ? ORB_RADIUS * 1.4 : ORB_RADIUS;
        var twinkle = 0.85 + 0.15 * Math.sin(ts * 0.004 + orb.phase);
        var dr      = baseR * twinkle;
        if (sx < -dr * 3 || sx > canvas.width  + dr * 3) continue;
        if (sy < -dr * 3 || sy > canvas.height + dr * 3) continue;
        var glow = 0.75 + 0.2 * twinkle;
        var grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, dr * 2.5);
        if (orb.type === 'purple') {
          grd.addColorStop(0,   'rgba(240,180,255,' + glow + ')');
          grd.addColorStop(0.3, 'rgba(180,60,255,0.85)');
          grd.addColorStop(0.7, 'rgba(100,0,200,0.4)');
          grd.addColorStop(1,   'rgba(100,0,200,0)');
        } else if (orb.type === 'green') {
          grd.addColorStop(0,   'rgba(180,255,160,' + glow + ')');
          grd.addColorStop(0.3, 'rgba(40,220,60,0.85)');
          grd.addColorStop(0.7, 'rgba(0,150,20,0.4)');
          grd.addColorStop(1,   'rgba(0,150,20,0)');
        } else {
          grd.addColorStop(0,   'rgba(255,240,80,' + glow + ')');
          grd.addColorStop(0.3, 'rgba(255,140,20,0.85)');
          grd.addColorStop(0.7, 'rgba(200,40,0,0.4)');
          grd.addColorStop(1,   'rgba(200,40,0,0)');
        }
        ctx.beginPath();
        ctx.arc(sx, sy, dr * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      }

      // Bat: centered on eye, flipped when moving left
      if (activeSprite.complete && activeSprite.naturalWidth) {
        var srcX = (isGliding || isAnimatingFlap || autoBiting ? animFrame : glideAnimFrame) * FRAME_W;
        var srcY = animRow   * ROW_H;
        var dw   = FRAME_W * SCALE;
        var dh   = FRAME_H * SCALE;

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        if (flipX) ctx.scale(-1, 1);
        ctx.drawImage(activeSprite, srcX, srcY, FRAME_W, FRAME_H,
          -EYE_X * SCALE, -EYE_Y * SCALE, dw, dh);
        ctx.restore();
      }
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
