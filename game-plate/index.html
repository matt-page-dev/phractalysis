<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>game-plate demo</title>
  <style>
    html, body { margin: 0; padding: 0; background: #111; }
    canvas { display: block; }
    #debug {
      position: fixed; top: 12px; left: 12px;
      font: 13px/1.6 monospace; color: rgba(255,255,255,0.5);
      pointer-events: none;
    }
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 32px;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash h1 {
      margin: 0;
      font: 700 48px/1 sans-serif;
      color: #fff;
      letter-spacing: 0.04em;
    }
    #splash-choice {
      display: flex; gap: 16px;
    }
    .splash-btn {
      padding: 16px 32px;
      font: 600 18px/1 sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .splash-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.45); }
    #splash-hint {
      margin: 0;
      font: 18px/1 sans-serif;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; }
    }
    #touch-dbg {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="touch-dbg"></canvas>
  <div id="debug"></div>
  <div id="splash">
    <h1>game-plate</h1>
    <div id="splash-choice">
      <button class="splash-btn" id="btn-controller">Controller</button>
      <button class="splash-btn" id="btn-tilt">Tilt</button>
    </div>
    <p id="splash-hint">click to start</p>
  </div>

  <script src="game-plate.js"></script>
  <script>
    var splash     = document.getElementById('splash');
    var choice     = document.getElementById('splash-choice');
    var hint       = document.getElementById('splash-hint');
    var canvas     = document.getElementById('game');
    var ctx        = canvas.getContext('2d');
    var debug      = document.getElementById('debug');

    var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isMobile) { hint.style.display = 'none'; }
    else          { choice.style.display = 'none'; }

    var x, y;
    var SPEED  = 5;
    var RADIUS = 32;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      if (x === undefined) {
        x = canvas.width  / 2;
        y = canvas.height / 2 - 60;
      }
    }
    window.addEventListener('resize', resize);
    resize();

    function dismissSplash() {
      splash.classList.add('hidden');
      splash.addEventListener('transitionend', function () { splash.remove(); }, { once: true });
    }

    function start(controller) {
      // Request fullscreen and orientation lock while the tap gesture is active
      if (document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
      try { screen.orientation.lock('landscape-primary').catch(function () {}); } catch (e) {}

      GamePlate.init({ orientation: 'landscape', controller: controller, fullscreen: true });
      dismissSplash();
    }

    document.getElementById('btn-controller').addEventListener('click', function () { start('nes'); });
    document.getElementById('btn-tilt').addEventListener('click',       function () { start('tilt'); });
    hint.addEventListener('click',                                       function () { start('keyboard'); });

    function loop() {
      var inp = GamePlate.input;

      if (inp.left)  x -= SPEED;
      if (inp.right) x += SPEED;
      if (inp.up)    y -= SPEED;
      if (inp.down)  y += SPEED;

      var radius = RADIUS;
      var color  = '#29aaff';

      if (inp.a && inp.b) { color = '#aa44ff'; radius = RADIUS * 1.2; }
      else if (inp.a)    { color = '#ff4444'; radius = RADIUS * 1.5; }
      else if (inp.b)    { color = '#44ff88'; radius = RADIUS * 0.6; }

      x = Math.max(radius, Math.min(canvas.width  - radius, x));
      y = Math.max(radius, Math.min(canvas.height - radius, y));

      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur  = 24;
      ctx.fill();
      ctx.shadowBlur = 0;

      debug.textContent =
        'up:'   + +inp.up    + '  down:'  + +inp.down  + '\n' +
        'left:' + +inp.left  + '  right:' + +inp.right + '\n' +
        'a:'    + +inp.a     + '  b:'     + +inp.b;

      requestAnimationFrame(loop);
    }
    loop();
  </script>

  <script>
    // Touch contact-area debug visualizer
    (function () {
      var dbg  = document.getElementById('touch-dbg');
      var dctx = dbg.getContext('2d');
      var active = new Map(); // identifier → Touch snapshot

      function resize() { dbg.width = window.innerWidth; dbg.height = window.innerHeight; draw(); }
      window.addEventListener('resize', resize);
      resize();

      function draw() {
        dctx.clearRect(0, 0, dbg.width, dbg.height);

        // Collect touches in the right half (button zone)
        var rightTouches = [];
        active.forEach(function (t) { if (t.clientX > window.innerWidth / 2) rightTouches.push(t); });
        if (!rightTouches.length) return;

        var t   = rightTouches[0];
        var landscape = window.innerWidth > window.innerHeight;
        var rX  = landscape ? (t.radiusY || 0) : (t.radiusX || 0);
        var rY  = landscape ? (t.radiusX || 0) : (t.radiusY || 0);

        var SCALE  = 60;
        var drawRX = Math.max(rX * SCALE, 15);
        var drawRY = Math.max(rY * SCALE, 15);

        var cx = t.clientX;
        var cy = t.clientY;

        // Draw button outlines so you can see thumb overlap
        var btnA = document.getElementById('gp-btn-a');
        var btnB = document.getElementById('gp-btn-b');
        [btnA, btnB].forEach(function (el) {
          if (!el) return;
          var br = el.getBoundingClientRect();
          var bRad = br.width / 2;
          dctx.beginPath();
          dctx.arc(br.left + bRad, br.top + bRad, bRad, 0, Math.PI * 2);
          dctx.strokeStyle = 'rgba(255,255,255,0.35)';
          dctx.lineWidth   = 1.5;
          dctx.stroke();
        });

        // Smudge: elliptical radial gradient at actual touch position
        dctx.save();
        dctx.translate(cx, cy);
        dctx.scale(drawRX, drawRY);
        var grad = dctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        grad.addColorStop(0,    'rgba(255,220,80,0.55)');
        grad.addColorStop(0.55, 'rgba(255,200,50,0.28)');
        grad.addColorStop(1,    'rgba(255,180,30,0)');
        dctx.beginPath();
        dctx.arc(0, 0, 1, 0, Math.PI * 2);
        dctx.fillStyle = grad;
        dctx.fill();
        dctx.restore();

        // Outline
        dctx.beginPath();
        dctx.ellipse(cx, cy, drawRX, drawRY, 0, 0, Math.PI * 2);
        dctx.strokeStyle = 'rgba(255,220,50,0.7)';
        dctx.lineWidth   = 1.5;
        dctx.stroke();

        // Label
        dctx.font      = '13px monospace';
        dctx.fillStyle = 'rgba(255,255,255,0.75)';
        dctx.textAlign = 'center';
        dctx.fillText(
          'rX:' + rX.toFixed(1) + '  rY:' + rY.toFixed(1),
          cx, cy + drawRY + 18
        );
      }

      function onMove(e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          active.set(t.identifier, { clientX: t.clientX, clientY: t.clientY, radiusX: t.radiusX, radiusY: t.radiusY });
        }
        draw();
      }
      function onEnd(e) {
        for (var i = 0; i < e.changedTouches.length; i++) active.delete(e.changedTouches[i].identifier);
        draw();
      }

      document.addEventListener('touchstart',  onMove, { passive: true });
      document.addEventListener('touchmove',   onMove, { passive: true });
      document.addEventListener('touchend',    onEnd,  { passive: true });
      document.addEventListener('touchcancel', onEnd,  { passive: true });
    })();
  </script>
</body>
</html>
