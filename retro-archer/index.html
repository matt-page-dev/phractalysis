<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Archer's Keep</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#101A08;
  display:flex; flex-direction:column;
  width:100vw; height:100dvh;
  overflow:hidden; user-select:none;
}

/* Canvas lives in a flex cell that shrinks to leave room for controls */
#game-area {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  border:2px solid #4A7A20;
  box-shadow:0 0 30px rgba(60,100,20,0.7);
  image-rendering:pixelated; image-rendering:crisp-edges;
}

/* Hint — hidden on touch devices */
#hint { color:#5A7A30; font:11px 'Courier New'; text-align:center; padding:4px; flex:0 0 auto; }
@media (pointer: coarse) { #hint { display:none; } }

/* ── NES CONTROLLER STRIP ───────────────────────────────────────────────── */
#controls {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 6px 20px 10px;
}

/* D-pad */
#dpad { display:flex; flex-direction:column; gap:2px; }
.dpad-row { display:flex; gap:2px; }
.dpad-btn, .dpad-center, .dpad-empty { width:44px; height:44px; border-radius:6px; }
.dpad-btn {
  background:#2A2A2A; border:2px solid #555; color:#BBB;
  font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  touch-action:none; user-select:none;
}
.dpad-btn:active { background:#484848; border-color:#888; }
.dpad-center { background:#1E1E1E; border:2px solid #3A3A3A; pointer-events:none; }
.dpad-empty  { background:transparent; pointer-events:none; }

/* A/B buttons */
#action-btns {
  display:flex; align-items:flex-end; gap:12px; padding-bottom:14px;
}
.action-btn {
  width:56px; height:56px; border-radius:50%;
  border:3px solid rgba(255,255,255,0.25);
  font-size:16px; font-weight:bold; color:#FFF;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  touch-action:none; user-select:none;
  text-shadow:0 1px 2px rgba(0,0,0,0.8);
  box-shadow:0 4px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-b { background:radial-gradient(circle at 40% 35%, #C85000, #6B2800); }
.btn-a { background:radial-gradient(circle at 40% 35%, #CC0018, #6B0010); margin-bottom:26px; }
.action-btn:active { filter:brightness(1.35); transform:scale(0.95); }

/* ── SPLASH / FULLSCREEN PROMPT ─────────────────────────────────────────── */
#splash {
  position:fixed; inset:0; z-index:50;
  background:rgba(8,16,4,0.93);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  cursor:pointer; touch-action:none;
}
#splash h1 {
  color:#78D040; font:bold 32px 'Courier New';
  letter-spacing:5px; margin-bottom:18px;
}
#splash p {
  color:#A8E060; font:16px 'Courier New'; letter-spacing:2px;
  animation: blink 1.1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

<body>

<!-- Tap-to-start splash (handles fullscreen + orientation lock) -->
<div id="splash">
  <h1>ARCHER'S KEEP</h1>
  <p>TAP TO START</p>
</div>

<div id="game-area">
  <canvas id="c" width="800" height="500"></canvas>
</div>

<!-- NES controller strip — sits below the canvas, never overlaps it -->
<div id="controls">
  <div id="dpad">
    <div class="dpad-row">
      <div class="dpad-empty"></div>
      <button id="btn-up"    class="dpad-btn">▲</button>
      <div class="dpad-empty"></div>
    </div>
    <div class="dpad-row">
      <button id="btn-left"  class="dpad-btn">◄</button>
      <div class="dpad-center"></div>
      <button id="btn-right" class="dpad-btn">►</button>
    </div>
    <div class="dpad-row">
      <div class="dpad-empty"></div>
      <button id="btn-down"  class="dpad-btn">▼</button>
      <div class="dpad-empty"></div>
    </div>
  </div>

  <div id="action-btns">
    <button id="btn-b" class="action-btn btn-b">B</button>
    <button id="btn-a" class="action-btn btn-a">A</button>
  </div>
</div>

<div id="hint">← → MOVE &nbsp;•&nbsp; SPACE / ↑ JUMP &nbsp;•&nbsp; Z SHOOT &nbsp;•&nbsp; R RESTART</div>
</body>
</html>
