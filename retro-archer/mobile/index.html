<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Archer's Keep</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#101A08;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden; user-select:none;
}
canvas {
  display:block;
  width: min(100vw, calc(100vh * 1.6));
  height: min(100vh, calc(100vw / 1.6));
  border:2px solid #4A7A20;
  box-shadow:0 0 30px rgba(60,100,20,0.7);
  image-rendering:pixelated; image-rendering:crisp-edges;
}
#hint { color:#5A7A30; font:11px 'Courier New'; margin-top:6px; letter-spacing:1px; }
@media (pointer: coarse) { #hint { display:none; } }

/* ── NES CONTROLLER OVERLAY ─────────────────────────────────────────────── */
#controls {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 8px 24px 16px;
  pointer-events: none;
}

/* D-pad */
#dpad {
  pointer-events: all;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.dpad-row { display: flex; gap: 2px; }
.dpad-btn, .dpad-center, .dpad-empty {
  width: 52px; height: 52px;
  border-radius: 6px;
}
.dpad-btn {
  background: #2A2A2A;
  border: 2px solid #555;
  color: #BBB;
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  user-select: none;
}
.dpad-btn:active { background: #484848; border-color: #888; }
.dpad-center { background: #222; border: 2px solid #444; pointer-events: none; }
.dpad-empty  { background: transparent; pointer-events: none; }

/* A/B action buttons */
#action-btns {
  pointer-events: all;
  display: flex;
  align-items: flex-end;
  gap: 14px;
  padding-bottom: 16px;
}
.action-btn {
  width: 62px; height: 62px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.3);
  font-size: 17px; font-weight: bold;
  color: #FFF;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  user-select: none;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-b { background: radial-gradient(circle at 40% 35%, #C85000, #6B2800); } /* Shoot */
.btn-a { background: radial-gradient(circle at 40% 35%, #CC0018, #6B0010); margin-bottom: 32px; } /* Jump */
.action-btn:active { filter: brightness(1.35); transform: scale(0.95); }
