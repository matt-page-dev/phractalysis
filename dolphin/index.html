<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dolphin</title>
  <style>
    html, body { margin: 0; padding: 0; background: #03045e; overflow: hidden; }
    canvas { display: block; }
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #03045e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash-title {
      font: bold 56px/1 sans-serif;
      color: #90e0ef;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #load-wrap {
      width: min(280px, 65vw);
      height: 5px;
      background: rgba(144, 224, 239, 0.18);
      border-radius: 3px;
      overflow: hidden;
    }
    #load-bar {
      height: 100%;
      background: #90e0ef;
      width: 0%;
      transition: width 0.08s linear;
      border-radius: 3px;
    }
    #ctrl-choice { display: flex; gap: 14px; }
    .ctrl-btn {
      padding: 13px 30px;
      font: 600 15px/1 sans-serif;
      color: #caf0f8;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: rgba(0, 119, 182, 0.2);
      border: 2px solid rgba(0, 119, 182, 0.5);
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }
    .ctrl-btn:hover { background: rgba(0, 119, 182, 0.38); }
    .btn-touch { border-color: rgba(0, 180, 150, 0.5); }
    .btn-touch:hover { background: rgba(0, 180, 150, 0.22); }
    .btn-tilt  { border-color: rgba(80, 160, 255, 0.5); }
    .btn-tilt:hover  { background: rgba(80, 160, 255, 0.2); }
    #tune {
      position: fixed; bottom: 12px; left: 12px; z-index: 1000;
      background: rgba(0,0,0,0.55); border-radius: 8px;
      padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;
      font: 11px/1.4 monospace; color: #90e0ef; min-width: 200px;
    }
    .tune-row { display: flex; flex-direction: column; gap: 2px; }
    .tune-row input[type=range] { width: 100%; }
    #tune select { width: 100%; background: #111; color: #90e0ef; border: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="splash">
    <div id="splash-title">Dolphin</div>
    <div id="load-wrap"><div id="load-bar"></div></div>
    <div id="ctrl-choice">
      <button class="ctrl-btn btn-key"   id="btn-start">Start</button>
      <button class="ctrl-btn btn-touch" id="btn-touch">Touch</button>
      <button class="ctrl-btn btn-tilt"  id="btn-tilt">Tilt</button>
    </div>
  </div>

  <div id="tune">
    <div class="tune-row"><label>Lateral max speed <span id="lv">0.55</span></label>
      <input type="range" id="t-lat" min="0.2" max="2.0" step="0.05" value="0.55"></div>
    <div class="tune-row"><label>Vert accel <span id="vav">0.003</span></label>
      <input type="range" id="t-vaccel" min="0.001" max="0.015" step="0.001" value="0.003"></div>
    <div class="tune-row"><label>Vert max speed <span id="vsv">0.45</span></label>
      <input type="range" id="t-vspeed" min="0.1" max="2.0" step="0.05" value="0.45"></div>
    <div class="tune-row"><label>Ring X spread <span id="rxv">80</span></label>
      <input type="range" id="t-rx" min="10" max="250" step="5" value="80"></div>
    <div class="tune-row"><label>Ring Y offset <span id="ryv">30</span></label>
      <input type="range" id="t-ry" min="0" max="150" step="5" value="30"></div>
    <div class="tune-row"><label>Hit radius mult <span id="hrv">1.0</span></label>
      <input type="range" id="t-hr" min="0.5" max="4.0" step="0.1" value="1.0"></div>
    <div class="tune-row"><label>Drag <span id="dgv">0.85</span></label>
      <input type="range" id="t-drag" min="0.85" max="0.99" step="0.01" value="0.85"></div>
    <div class="tune-row"><label>Forward speed <span id="fsv">0.45</span></label>
      <input type="range" id="t-fspeed" min="0.05" max="2.0" step="0.05" value="0.45"></div>
    <div class="tune-row"><label>Simultaneous rings <span id="rcv">3</span></label>
      <input type="range" id="t-rc" min="1" max="8" step="1" value="3"></div>
    <div class="tune-row"><label>Guide lines (nearest) <span id="gcv">3</span></label>
      <input type="range" id="t-gc" min="0" max="8" step="1" value="3"></div>
    <div class="tune-row">
      <label>Ring pattern</label>
      <select id="t-pattern">
        <option value="random">Random</option>
        <option value="spiral">Corkscrew spiral</option>
        <option value="vsin">Vertical sine</option>
        <option value="hsin">Horizontal sine</option>
        <option value="zigzag">Zigzag</option>
        <option value="center">Centered (easy)</option>
        <option value="figure8">Figure-8</option>
      </select>
    </div>
    <div class="tune-row">
      <label>Ring size</label>
      <select id="t-ringsize">
        <option value="random">Random</option>
        <option value="large">Large (1 pt)</option>
        <option value="medium">Medium (2 pts)</option>
        <option value="small">Small (3 pts)</option>
      </select>
    </div>
    <div class="tune-row" style="flex-direction:row; align-items:center; gap:8px;">
      <input type="checkbox" id="t-breath">
      <label for="t-breath">Breath drain</label>
    </div>
    <div class="tune-row" style="flex-direction:row; align-items:center; gap:8px;">
      <input type="checkbox" id="t-showdolphin" checked>
      <label for="t-showdolphin">Show dolphin</label>
    </div>
    <div class="tune-row" style="flex-direction:row; align-items:center; gap:8px;">
      <input type="checkbox" id="t-ringtrans" checked>
      <label for="t-ringtrans">Ring transparency</label>
    </div>
    <div class="tune-row" style="flex-direction:row; align-items:center; gap:8px;">
      <input type="checkbox" id="t-ringchain">
      <label for="t-ringchain">Ring chain lines</label>
    </div>
  </div>

  <script src="./game-plate.js"></script>
  <script>
    var canvas   = document.getElementById('game');
    var ctx      = canvas.getContext('2d');
    var splash   = document.getElementById('splash');
    var loadBar  = document.getElementById('load-bar');
    var loadWrap = document.getElementById('load-wrap');
    var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var btnStart = document.getElementById('btn-start');
    var btnTouch = document.getElementById('btn-touch');
    var btnTilt  = document.getElementById('btn-tilt');

    var DEPTH_START = 180;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      DEPTH_START = Math.round(canvas.height * 0.65);
    }
    window.addEventListener('resize', resize);
    resize();

    // ── pre-load all 63 frames ─────────────────────────────────────
    var DIR_FOLDERS  = ['1-upleft','2-up','3-upright','4-left','5-center','6-right','7-downleft','8-down','9-downright'];
    var FRAME_FILES  = ['frame_0000','frame_0006','frame_0012','frame_0018','frame_0024','frame_0030','frame_0036'];
    var FRAME_COUNT  = FRAME_FILES.length;
    var DIR_COUNT    = DIR_FOLDERS.length;
    var TOTAL_IMAGES = DIR_COUNT * FRAME_COUNT;
    var loadedCount  = 0;
    var frames       = [];   // frames[dirIdx][frameIdx]

    for (var d = 0; d < DIR_COUNT; d++) {
      frames[d] = [];
      for (var f = 0; f < FRAME_COUNT; f++) {
        var img = new Image();
        img.onload = onImageLoad;
        img.src = './assets/sprite-sheets/dolphin/swim-cycle/' + DIR_FOLDERS[d] + '/' + FRAME_FILES[f] + '.png';
        frames[d][f] = img;
      }
    }

    function onImageLoad() {
      loadedCount++;
      loadBar.style.width = (loadedCount / TOTAL_IMAGES * 100) + '%';
      if (loadedCount === TOTAL_IMAGES) onAllLoaded();
    }

    function onAllLoaded() {
      loadWrap.style.display = 'none';
      if (isMobile) {
        btnTouch.style.display = 'inline-block';
        btnTilt.style.display  = 'inline-block';
      } else {
        btnStart.style.display = 'inline-block';
      }
    }

    // ── splash ─────────────────────────────────────────────────────
    function dismissSplash() {
      splash.classList.add('hidden');
      splash.addEventListener('transitionend', function() {
        splash.style.display = 'none';
      }, { once: true });
    }

    function start(mode) {
      if (document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
      }
      try { screen.orientation.lock('landscape-primary').catch(function() {}); } catch(e) {}
      controllerMode = mode === 'tilt' ? 'tilt' : mode === 'keyboard' ? 'keyboard' : 'nes';
      GamePlate.init({ orientation: 'landscape', controller: controllerMode, fullscreen: true });
      gameStarted = true;
      resetGame();
      dismissSplash();
    }

    btnStart.addEventListener('click', function() { start('keyboard'); });
    btnTouch.addEventListener('click', function() { start('touch'); });
    btnTilt.addEventListener('click',  function() { start('tilt'); });

    // ── 3d bubbles ─────────────────────────────────────────────────
    var BUBBLE_COUNT   = 35;
    var BUBBLE_DEPTH   = 1200;
    var BUBBLE_SPREAD  = 280;
    var CAM_SPEED      = 0.45;   // world units per ms (forward)
    var LATERAL_SPEED  = 0.55;   // world units per ms (strafe)
    var camOffX = 0, camOffY = 0;

    var worldBubbles = [];
    for (var i = 0; i < BUBBLE_COUNT; i++) {
      worldBubbles.push({
        x: (Math.random() - 0.5) * BUBBLE_SPREAD * 2,
        y: (Math.random() - 0.5) * BUBBLE_SPREAD * 2,
        z: Math.random() * BUBBLE_DEPTH,
        r: 1.5 + Math.random() * 3.5
      });
    }

    function drawBubbles(dt) {
      var fov = Math.min(canvas.width, canvas.height) * 0.75;
      var cx  = canvas.width / 2;
      var cy  = canvas.height / 2;
      for (var i = 0; i < worldBubbles.length; i++) {
        var b = worldBubbles[i];
        b.z -= CAM_SPEED * dt;
        if (b.z < 5) {
          b.z = BUBBLE_DEPTH;
          b.x = camOffX + (Math.random() - 0.5) * BUBBLE_SPREAD * 2;
          b.y = camOffY + (Math.random() - 0.5) * BUBBLE_SPREAD * 2;
          continue;
        }
        if (Math.hypot(b.x - camOffX, b.y - camOffY) > BUBBLE_SPREAD * 1.5) {
          b.z = BUBBLE_DEPTH;
          b.x = camOffX + (Math.random() - 0.5) * BUBBLE_SPREAD * 2;
          b.y = camOffY + (Math.random() - 0.5) * BUBBLE_SPREAD * 2;
          continue;
        }
        var scale = fov / b.z;
        var sx    = cx + (b.x - camOffX) * scale;
        var sy    = cy + (b.y - camOffY) * scale;
        if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) continue;
        var depthT  = 1 - b.z / BUBBLE_DEPTH;
        var radius  = b.r * (0.3 + depthT * 2.2);
        var alpha   = 0.06 + depthT * 0.3;
        ctx.beginPath();
        ctx.arc(sx, sy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(144,224,239,' + alpha.toFixed(2) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // ── controller mode ────────────────────────────────────────────
    var controllerMode = 'keyboard';

    // ── animation state ────────────────────────────────────────────
    var currentDir  = 4;   // index into DIR_FOLDERS; 4 = 5-center
    var frameIndex  = 0;
    var animElapsed = 0;
    var ANIM_FPS    = 8;
    var FRAME_MS    = 1000 / ANIM_FPS;

    function getDir(inp) {
      if (inp.up   && inp.left)  return 0;
      if (inp.up   && inp.right) return 2;
      if (inp.down && inp.left)  return 6;
      if (inp.down && inp.right) return 8;
      if (inp.up)    return 1;
      if (inp.left)  return 3;
      if (inp.right) return 5;
      if (inp.down)  return 7;
      return 4;
    }

    // ── depth & breath system ──────────────────────────────────────
    var dolphinDepth = DEPTH_START;
    var dolphinVY    = 0;          // px/ms; negative = rising, positive = sinking
    var dolphinVX    = 0;          // world units/ms; negative = left, positive = right
    var isJumping    = false;
    var wavePhase    = 0;
    var splashParticles = [];

    var BREATH_MAX         = 30000;
    var BREATH_REFILL_RATE = BREATH_MAX / 3000;   // fills in 3 s
    var breathMs           = BREATH_MAX;

    var VERT_ACCEL  = 0.003;   // px/ms² per ms of held input
    var VERT_SPEED  = 0.45;    // max vertical speed
    var VERT_DRAG   = 0.85;    // velocity multiplier per 16 ms frame
    var JUMP_THRESH = 0.28;    // min upward speed to trigger a jump
    var GRAVITY     = 0.0006;  // downward pull while airborne

    var gameStarted      = false;
    var gameOver         = false;
    var gameOverCooldown = 0;
    var gameOverFade     = 0;

    var TUNE_BREATH         = true;
    var rings               = [];
    var score               = 0;
    var ringSpawnTimer      = 0;
    var RING_SPAWN_INTERVAL = 3500;
    var RING_Z_START        = 900;
    var RING_X_SPREAD       = 80;
    var RING_Y_MIN          = 30;
    var RING_Y_RANGE        = 90;
    var HIT_RADIUS_MULT     = 1.0;
    var RING_COUNT          = 3;
    var SHOW_DOLPHIN        = true;
    var RING_TRANSPARENT    = true;
    var GUIDE_RING_COUNT    = 3;
    var RING_SIZE           = 'random';
    var RING_CHAIN          = false;
    var RING_PATTERN        = 'random';
    var ringPatternPhase    = 0;

    function resetGame() {
      dolphinDepth     = DEPTH_START;
      dolphinVY        = 0;
      dolphinVX        = 0;
      isJumping        = false;
      breathMs         = BREATH_MAX;
      gameOver         = false;
      gameOverCooldown = 0;
      gameOverFade     = 0;
      splashParticles  = [];
      camOffX = 0;
      camOffY = 0;
      rings            = [];
      score            = 0;
      ringSpawnTimer   = 0;
      ringPatternPhase = 0;
    }

    function triggerSplash(splashY) {
      var cx = canvas.width / 2;
      for (var j = 0; j < 24; j++) {
        var angle = -Math.PI + Math.random() * Math.PI;
        var speed = 0.15 + Math.random() * 0.45;
        splashParticles.push({
          x:    cx + (Math.random() - 0.5) * 60,
          y:    splashY,
          vx:   Math.cos(angle) * speed,
          vy:   Math.sin(angle) * speed - 0.25,
          life: 1.0,
          size: 2 + Math.random() * 4
        });
      }
    }

    function drawBreathMeter() {
      var PAD = 18, W = 160, H = 13;
      var mx = canvas.width - W - PAD, my = PAD;
      var frac = breathMs / BREATH_MAX;

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(mx - 6, my - 20, W + 12, H + 52);

      ctx.fillStyle = '#90e0ef';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('BREATH', mx + W, my - 5);

      ctx.fillStyle = 'rgba(255,215,0,0.9)';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(score + ' pts', mx + W, my + H + 22);

      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(mx, my, W, H);

      var barColor = frac > 0.5 ? '#00b4d8' : frac > 0.25 ? '#f4a261' : '#e63946';
      ctx.fillStyle = barColor;
      ctx.fillRect(mx, my, W * frac, H);
    }

    function depthBlend(hex, t) {
      var r  = parseInt(hex.slice(1,3), 16);
      var g  = parseInt(hex.slice(3,5), 16);
      var b  = parseInt(hex.slice(5,7), 16);
      var dt = Math.pow(Math.max(0, Math.min(1, t)), 2);
      return 'rgb(' + Math.round(r*dt + 3*(1-dt))  + ',' +
                      Math.round(g*dt + 4*(1-dt))  + ',' +
                      Math.round(b*dt + 94*(1-dt)) + ')';
    }

    function anyInput(inp) {
      return !!(inp.up || inp.down || inp.left || inp.right || inp.a || inp.b);
    }

    function spawnRing(zOffset) {
      var sizes = [
        { outer: 38, inner: 26, pts: 1 },
        { outer: 27, inner: 18, pts: 2 },
        { outer: 18, inner: 12, pts: 3 }
      ];
      var palette = ['#FFD700','#FF4500','#00CED1','#7CFC00','#FF69B4','#9370DB'];
      var s = RING_SIZE === 'large'  ? sizes[0] :
              RING_SIZE === 'medium' ? sizes[1] :
              RING_SIZE === 'small'  ? sizes[2] :
              sizes[Math.floor(Math.random() * sizes.length)];
      var ph = ringPatternPhase;
      var rx, ry;
      switch (RING_PATTERN) {
        case 'spiral':
          rx = camOffX + Math.cos(ph * 1.1) * 60;
          ry = camOffY + 60 + Math.sin(ph * 1.1) * 35;
          break;
        case 'vsin':
          rx = camOffX;
          ry = camOffY + 60 + Math.sin(ph * 1.2) * 50;
          break;
        case 'hsin':
          rx = camOffX + Math.sin(ph * 1.2) * 80;
          ry = camOffY + 60;
          break;
        case 'zigzag':
          rx = camOffX + (ph % 2 === 0 ? 70 : -70);
          ry = camOffY + (ph % 2 === 0 ? 40 : 80);
          break;
        case 'center':
          rx = camOffX;
          ry = camOffY + 50;
          break;
        case 'figure8':
          rx = camOffX + Math.sin(ph * 0.9) * 70;
          ry = camOffY + 60 + Math.sin(ph * 1.8) * 30;
          break;
        default: // random
          rx = camOffX + (Math.random() - 0.5) * RING_X_SPREAD * 2;
          ry = camOffY + RING_Y_MIN + Math.random() * RING_Y_RANGE;
      }
      ringPatternPhase++;
      rings.push({
        x:           rx,
        y:           ry,
        z:           RING_Z_START + (zOffset || 0) + Math.random() * 100,
        radius:      s.outer,
        innerRadius: s.inner,
        color:       palette[Math.floor(Math.random() * palette.length)],
        scored:      false,
        points:      s.pts
      });
    }

    // ── game loop ──────────────────────────────────────────────────
    var prev = 0;
    function loop(ts) {
      requestAnimationFrame(loop);
      if (GamePlate.paused) return;

      var dt  = ts - prev; if (dt > 50) dt = 50; prev = ts;
      var inp = GamePlate.input || {};
      if (controllerMode === 'tilt') inp = { up: inp.down, down: inp.up, left: inp.left, right: inp.right };

      // ── game over ────────────────────────────────────────────────
      if (gameOver) {
        gameOverCooldown = Math.max(0, gameOverCooldown - dt);
        gameOverFade = Math.min(1, gameOverFade + dt / 1500);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var goGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        goGrad.addColorStop(0,    '#0077b6');
        goGrad.addColorStop(0.35, '#023e8a');
        goGrad.addColorStop(0.7,  '#031545');
        goGrad.addColorStop(1,    '#03045e');
        ctx.fillStyle = goGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        var depthDark = Math.min(0.82, dolphinDepth / (canvas.height * 2.5));
        ctx.fillStyle = 'rgba(1,2,20,' + depthDark.toFixed(3) + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(1,2,20,' + gameOverFade.toFixed(3) + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (gameOverFade > 0.75) {
          ctx.fillStyle = '#90e0ef';
          ctx.textAlign = 'center';
          ctx.font = 'bold 56px sans-serif';
          ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 16);
          ctx.font = '26px monospace';
          ctx.fillStyle = '#FFD700';
          ctx.fillText(score + ' pts', canvas.width / 2, canvas.height / 2 + 30);
          if (gameOverCooldown <= 0) {
            ctx.font = '18px sans-serif';
            ctx.fillStyle = 'rgba(144,224,239,0.65)';
            ctx.fillText('Press any key to try again', canvas.width / 2, canvas.height / 2 + 68);
          }
        }
        if (gameOverCooldown <= 0 && anyInput(inp)) resetGame();
        return;
      }

      // ── horizontal movement (left/right unchanged) ────────────────
      currentDir = getDir(inp);
      if (inp.left)  dolphinVX -= VERT_ACCEL * dt;
      if (inp.right) dolphinVX += VERT_ACCEL * dt;
      dolphinVX = Math.max(-LATERAL_SPEED, Math.min(LATERAL_SPEED, dolphinVX));
      dolphinVX *= Math.pow(VERT_DRAG, dt / 16);
      camOffX += dolphinVX * dt;

      // ── vertical depth physics ─────────────────────────────────
      if (!isJumping) {
        if (inp.up)   dolphinVY -= VERT_ACCEL * dt;
        if (inp.down) dolphinVY += VERT_ACCEL * dt;
      }
      dolphinVY *= Math.pow(VERT_DRAG, dt / 16);
      dolphinVY  = Math.max(-VERT_SPEED, Math.min(VERT_SPEED, dolphinVY));
      if (isJumping) dolphinVY += GRAVITY * dt;
      dolphinDepth += dolphinVY * dt;

      // surface collision
      if (!isJumping && dolphinDepth <= 0) {
        if (dolphinVY < -JUMP_THRESH) {
          isJumping = true;      // fast enough — launch a jump
        } else {
          dolphinDepth = 0;
          dolphinVY    = Math.max(0, dolphinVY);
        }
      }
      // return to water after jump
      if (isJumping && dolphinDepth >= 0 && dolphinVY > 0) {
        isJumping    = false;
        dolphinDepth = 0;
        dolphinVY    = 0;
        triggerSplash(canvas.height * 0.5);
      }
      if (!isJumping) dolphinDepth = Math.max(0, dolphinDepth);
      camOffY = dolphinDepth;

      // ── breath ──────────────────────────────────────────────────
      if (gameStarted) {
        if (dolphinDepth <= 0) {
          breathMs = Math.min(BREATH_MAX, breathMs + BREATH_REFILL_RATE * dt);
        } else if (!TUNE_BREATH) {
          breathMs -= dt;
          if (breathMs <= 0) {
            breathMs         = 0;
            gameOver         = true;
            gameOverCooldown = 2000;
          }
        }
      }

      // ── rings ───────────────────────────────────────────────────
      if (gameStarted) {
        ringSpawnTimer += dt;
        if (ringSpawnTimer >= RING_SPAWN_INTERVAL) {
          ringSpawnTimer = 0;
          for (var si = 0; si < RING_COUNT; si++) spawnRing(si * 300);
        }
        for (var ri = rings.length - 1; ri >= 0; ri--) {
          var r = rings[ri];
          r.z -= CAM_SPEED * dt;
          if (!r.scored && r.z < 40) {
            if (Math.hypot(r.x - camOffX, r.y - camOffY) < r.innerRadius * HIT_RADIUS_MULT) {
              r.scored = true;
              score += r.points;
            }
          }
          if (r.z < 5) rings.splice(ri, 1);
        }
      }

      // ── animation ───────────────────────────────────────────────
      if (isJumping) currentDir = dolphinVY < 0 ? 1 : 7;

      animElapsed += dt;
      if (animElapsed >= FRAME_MS) {
        frameIndex   = (frameIndex + 1) % FRAME_COUNT;
        animElapsed -= FRAME_MS;
      }

      wavePhase += 0.002 * dt;

      // ── render ──────────────────────────────────────────────────
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      var sy = canvas.height * 0.5 - dolphinDepth;   // surface Y on screen

      // Sky (above surface)
      if (sy > 0) {
        var skyTop = Math.min(sy, canvas.height);
        var skyGrad = ctx.createLinearGradient(0, 0, 0, skyTop);
        skyGrad.addColorStop(0,   '#48cae4');
        skyGrad.addColorStop(0.6, '#90e0ef');
        skyGrad.addColorStop(1,   '#caf0f8');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, skyTop);
      }

      // Ocean (below surface)
      var oceanTop = Math.max(0, sy);
      if (oceanTop < canvas.height) {
        var oceanGrad = ctx.createLinearGradient(0, oceanTop, 0, canvas.height);
        oceanGrad.addColorStop(0,    '#0077b6');
        oceanGrad.addColorStop(0.35, '#023e8a');
        oceanGrad.addColorStop(0.7,  '#031545');
        oceanGrad.addColorStop(1,    '#03045e');
        ctx.fillStyle = oceanGrad;
        ctx.fillRect(0, oceanTop, canvas.width, canvas.height - oceanTop);
        var depthDarkAlpha = Math.min(0.82, dolphinDepth / (canvas.height * 2.5));
        ctx.fillStyle = 'rgba(1,2,20,' + depthDarkAlpha.toFixed(3) + ')';
        ctx.fillRect(0, oceanTop, canvas.width, canvas.height - oceanTop);
      }

      // Animated wave line
      if (sy > -10 && sy < canvas.height + 10) {
        var wx;
        ctx.beginPath();
        for (wx = 0; wx <= canvas.width; wx += 8) {
          var wy = sy + Math.sin(wx * 0.015 + wavePhase) * 5;
          if (wx === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
        }
        ctx.strokeStyle = 'rgba(144,224,239,0.85)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        for (wx = 0; wx <= canvas.width; wx += 8) {
          var wy2 = sy + Math.sin(wx * 0.02 - wavePhase * 1.3) * 3 + 6;
          if (wx === 0) ctx.moveTo(wx, wy2); else ctx.lineTo(wx, wy2);
        }
        ctx.strokeStyle = 'rgba(144,224,239,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      drawBubbles(dt);

      // Splash particles
      for (var pi = splashParticles.length - 1; pi >= 0; pi--) {
        var p = splashParticles[pi];
        p.x  += p.vx * dt;
        p.y  += p.vy * dt;
        p.vy += 0.001 * dt;
        p.life -= 0.0022 * dt;
        if (p.life <= 0) { splashParticles.splice(pi, 1); continue; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(144,224,239,' + p.life.toFixed(2) + ')';
        ctx.fill();
      }

      // Rings — sorted back-to-front so closer rings draw on top
      var rfov = Math.min(canvas.width, canvas.height) * 0.75;
      var rcx  = canvas.width / 2;
      var rcy  = canvas.height / 2;
      var sortedRings = rings.slice().sort(function(a, b) { return b.z - a.z; });

      // Pass 1: collect fully-on-screen ring projections (strict bounds — drives guide lines & chain)
      var visRings = [];
      for (var ri = 0; ri < sortedRings.length; ri++) {
        var r = sortedRings[ri];
        if (r.z < 5) continue;
        var rscale    = rfov / r.z;
        var rsx       = rcx + (r.x - camOffX) * rscale;
        var rsy       = rcy + (r.y - camOffY) * rscale;
        var projOuter = r.radius * rscale;
        var projInner = r.innerRadius * rscale;
        if (projOuter < 1) continue;
        if (rsx - projOuter < 0 || rsx + projOuter > canvas.width ||
            rsy - projOuter < 0 || rsy + projOuter > canvas.height) continue;
        var depthT = 1 - r.z / (RING_Z_START + 300);
        var alpha  = RING_TRANSPARENT ? (0.3 + depthT * 0.6) : 1.0;
        visRings.push({ rsx: rsx, rsy: rsy, projOuter: projOuter, projInner: projInner,
                        depthT: depthT, alpha: alpha, color: r.color });
      }

      // Pass 2: draw ring shapes (lenient bounds — rings render even when partially off screen)
      for (var ri = 0; ri < sortedRings.length; ri++) {
        var r = sortedRings[ri];
        if (r.z < 5) continue;
        var rscale    = rfov / r.z;
        var rsx       = rcx + (r.x - camOffX) * rscale;
        var rsy       = rcy + (r.y - camOffY) * rscale;
        var projOuter = r.radius * rscale;
        var projInner = r.innerRadius * rscale;
        if (projOuter < 1) continue;
        if (rsx < -projOuter * 2 || rsx > canvas.width + projOuter * 2 ||
            rsy < -projOuter * 2 || rsy > canvas.height + projOuter * 2) continue;
        var depthT = 1 - r.z / (RING_Z_START + 300);
        var alpha  = RING_TRANSPARENT ? (0.3 + depthT * 0.6) : 1.0;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(rsx, rsy, (projOuter + projInner) / 2, 0, Math.PI * 2);
        ctx.strokeStyle = depthBlend(r.color, depthT);
        ctx.lineWidth   = projOuter - projInner;
        ctx.stroke();
        ctx.restore();
      }

      // Guide lines — nearest GUIDE_RING_COUNT from fully-visible rings only
      var guideStart = Math.max(0, visRings.length - GUIDE_RING_COUNT);
      for (var vi = guideStart; vi < visRings.length; vi++) {
        var vr = visRings[vi];
        ctx.save();
        ctx.globalAlpha = vr.alpha * 0.35;
        ctx.strokeStyle = depthBlend(vr.color, vr.depthT);
        ctx.lineWidth = 1;
        var guideAngles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
        for (var ai = 0; ai < guideAngles.length; ai++) {
          ctx.beginPath();
          ctx.moveTo(vr.rsx + Math.cos(guideAngles[ai]) * vr.projOuter,
                     vr.rsy + Math.sin(guideAngles[ai]) * vr.projOuter);
          ctx.lineTo(rcx, rcy);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Chain lines — 4 lines connecting 45° spoke points of adjacent fully-visible rings
      if (RING_CHAIN && visRings.length > 1) {
        var chainAngles = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4];
        for (var ci = 0; ci < visRings.length - 1; ci++) {
          var cp0 = visRings[ci], cp1 = visRings[ci + 1];
          var r0 = (cp0.projOuter + cp0.projInner) / 2;
          var r1 = (cp1.projOuter + cp1.projInner) / 2;
          ctx.save();
          ctx.globalAlpha = (cp0.alpha + cp1.alpha) / 2 * 0.5;
          ctx.strokeStyle = depthBlend(cp0.color, cp0.depthT);
          ctx.lineWidth = 1;
          for (var ai = 0; ai < 4; ai++) {
            var ang = chainAngles[ai];
            ctx.beginPath();
            ctx.moveTo(cp0.rsx + Math.cos(ang) * r0, cp0.rsy + Math.sin(ang) * r0);
            ctx.lineTo(cp1.rsx + Math.cos(ang) * r1, cp1.rsy + Math.sin(ang) * r1);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // Dolphin
      if (SHOW_DOLPHIN) {
        var img = frames[currentDir][frameIndex];
        if (img && img.complete && img.naturalWidth) {
          var size = Math.min(canvas.width, canvas.height) * 1.0;
          var dx   = (canvas.width  - size) / 2;
          var dy   = (canvas.height - size) / 2;
          ctx.drawImage(img, dx, dy, size, size);
        }
      } else {
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2222';
        ctx.fill();
      }

      if (gameStarted) {
        drawBreathMeter();
      }
    }
    requestAnimationFrame(loop);

    (function() {
      function wire(id, valId, decimals, setter) {
        var el = document.getElementById(id);
        var vl = document.getElementById(valId);
        el.addEventListener('input', function() {
          var v = parseFloat(el.value);
          vl.textContent = v.toFixed(decimals);
          setter(v);
        });
      }
      wire('t-lat',    'lv',  2, function(v){ LATERAL_SPEED = v; });
      wire('t-vaccel', 'vav', 3, function(v){ VERT_ACCEL = v; });
      wire('t-vspeed', 'vsv', 2, function(v){ VERT_SPEED = v; });
      wire('t-rx',     'rxv', 0, function(v){ RING_X_SPREAD = v; });
      wire('t-ry',     'ryv', 0, function(v){ RING_Y_MIN = v; });
      wire('t-hr',     'hrv', 1, function(v){ HIT_RADIUS_MULT = v; });
      wire('t-drag',   'dgv', 2, function(v){ VERT_DRAG = v; });
      wire('t-rc',     'rcv', 0, function(v){ RING_COUNT = v; });
      wire('t-gc',     'gcv', 0, function(v){ GUIDE_RING_COUNT = v; });
      wire('t-fspeed', 'fsv', 2, function(v){ CAM_SPEED = v; });
      document.getElementById('t-breath').addEventListener('change', function() {
        TUNE_BREATH = !this.checked;
      });
      document.getElementById('t-showdolphin').addEventListener('change', function() {
        SHOW_DOLPHIN = this.checked;
      });
      document.getElementById('t-ringtrans').addEventListener('change', function() {
        RING_TRANSPARENT = this.checked;
      });
      document.getElementById('t-ringchain').addEventListener('change', function() {
        RING_CHAIN = this.checked;
      });
      document.getElementById('t-ringsize').addEventListener('change', function() {
        RING_SIZE = this.value;
      });
      document.getElementById('t-pattern').addEventListener('change', function() {
        RING_PATTERN = this.value;
        ringPatternPhase = 0;
      });
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' && e.target.type === 'range' &&
            ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
          e.preventDefault();
        }
      }, true);
    })();
  </script>

</body>
</html>
