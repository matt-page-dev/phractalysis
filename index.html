<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparksware</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card-bg: #121210;
      --card-border: #2a2318;
      --cyan: #ffb700;
      --purple: #ff7a00;
      --text: #f0ede0;
      --muted: #8a7a50;
      --game-badge: #ff7a00;
      --demo-badge: #d49000;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── starfield ── */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── layout ── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }

    /* ── header ── */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .site-logo {
      max-width: min(105px, 20vw);
      height: auto;
      filter: drop-shadow(0 0 12px rgba(255, 183, 0, 0.45));
    }

    .site-tagline {
      margin-top: 0.6rem;
      color: var(--muted);
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* ── grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
      gap: 1.25rem;
    }

    /* ── card ── */
    .card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover,
    .card:focus-visible,
    .card:active {
      transform: translateY(-4px);
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(255, 183, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.5);
      outline: none;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0b;
      overflow: hidden;
    }

    .card-img img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }

    .card-img-emoji {
      font-size: 3.5rem;
      line-height: 1;
    }

    .card-foot {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .badge-game {
      background: rgba(255, 122, 0, 0.18);
      color: var(--game-badge);
      border: 1px solid rgba(255, 122, 0, 0.35);
    }

    .badge-demo {
      background: rgba(212, 144, 0, 0.18);
      color: var(--demo-badge);
      border: 1px solid rgba(212, 144, 0, 0.35);
    }

    /* ── footer ── */
    footer {
      text-align: center;
      margin-top: 3.5rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    @media (max-width: 480px) {
      .page { padding: 2rem 1rem 3rem; }
      header { margin-bottom: 2rem; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="page">
    <header>
      <img class="site-logo" src="sparksware-logo.png" alt="Sparksware" />
      <div class="site-tagline">Interactive demos &amp; games</div>
    </header>

    <div class="grid">

      <a class="card" href="spidroid/">
        <div class="card-img">
          <img src="spidroid/assets/images/spidroid-logo.png" alt="Spidroid" />
        </div>
        <div class="card-foot">
          <span class="card-title">Spidroid</span>
          <span class="badge badge-game">Game</span>
        </div>
      </a>

      <a class="card" href="mega-bat/">
        <div class="card-img">
          <img src="mega-bat/assets/game-plate-images/megabat-game-logo.png" alt="MegaBat" />
        </div>
        <div class="card-foot">
          <span class="card-title">MegaBat</span>
          <span class="badge badge-game">Game</span>
        </div>
      </a>

      <a class="card" href="retro-archer/">
        <div class="card-img">
          <img src="retro-archer/assets/game-plate-images/retro-archer-game-logo.png" alt="Archer's Keep" />
        </div>
        <div class="card-foot">
          <span class="card-title">Archer's Keep</span>
          <span class="badge badge-game">Game</span>
        </div>
      </a>

      <a class="card" href="grid-overlord/">
        <div class="card-img">
          <span class="card-img-emoji">⚔️</span>
        </div>
        <div class="card-foot">
          <span class="card-title">Grid Overlord</span>
          <span class="badge badge-game">Game</span>
        </div>
      </a>

      <a class="card" href="notebookland/">
        <div class="card-img">
          <span class="card-img-emoji">📓</span>
        </div>
        <div class="card-foot">
          <span class="card-title">Notebookland</span>
          <span class="badge badge-game">Game</span>
        </div>
      </a>

      <a class="card" href="snake-bite/">
        <div class="card-img">
          <span class="card-img-emoji">🐍</span>
        </div>
        <div class="card-foot">
          <span class="card-title">Snake Bite</span>
          <span class="badge badge-game">Game</span>
        </div>
      </a>

      <a class="card" href="dolphin/">
        <div class="card-img">
          <span class="card-img-emoji">🐬</span>
        </div>
        <div class="card-foot">
          <span class="card-title">Dolphin</span>
          <span class="badge badge-demo">Demo</span>
        </div>
      </a>

      <a class="card" href="grid-fall/">
        <div class="card-img">
          <span class="card-img-emoji">🌀</span>
        </div>
        <div class="card-foot">
          <span class="card-title">Grid Fall</span>
          <span class="badge badge-demo">Demo</span>
        </div>
      </a>

      <a class="card" href="mandelbrot/">
        <div class="card-img">
          <span class="card-img-emoji">🔬</span>
        </div>
        <div class="card-foot">
          <span class="card-title">Mandelbrot Explorer</span>
          <span class="badge badge-demo">Demo</span>
        </div>
      </a>

    </div>

    <footer>phractalysis</footer>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const COUNT = 160;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function init() {
        stars = Array.from({ length: COUNT }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.2 + 0.2,
          speed: Math.random() * 0.12 + 0.03,
          opacity: Math.random() * 0.6 + 0.2,
        }));
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 220, 140, ${s.opacity})`;
          ctx.fill();
          s.y += s.speed;
          if (s.y > canvas.height) {
            s.y = 0;
            s.x = Math.random() * canvas.width;
          }
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', () => { resize(); init(); });
      resize();
      init();
      draw();
    })();
  </script>
</body>
</html>
