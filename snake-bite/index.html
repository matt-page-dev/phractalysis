<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Bite</title>
  <style>
    html, body { margin: 0; padding: 0; background: #080c10; overflow: hidden; }
    canvas { display: block; }
    #splash {
      position: fixed; inset: 0; z-index: 99999; background: #080c10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash h1 {
      margin: 0; font: 700 52px/1 sans-serif; letter-spacing: 0.08em;
      text-transform: uppercase; color: #44ff88;
    }
    #splash-choice { display: flex; gap: 14px; }
    .splash-btn {
      padding: 14px 24px; font: 600 16px/1 sans-serif; color: #dbe9ff;
      text-transform: uppercase; letter-spacing: 0.07em;
      background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px; cursor: pointer;
    }
    .splash-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.45); }
    #splash-hint {
      margin: 0; font: 17px/1 sans-serif; color: rgba(255,255,255,0.6);
      text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.95; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="splash">
    <h1>Snake Bite</h1>
    <div id="splash-choice">
      <button class="splash-btn" id="btn-controller">Controller</button>
    </div>
    <p id="splash-hint">click to start</p>
  </div>

  <script src="./game-plate.js"></script>
  <script>
    var splash = document.getElementById('splash');
    var choice = document.getElementById('splash-choice');
    var hint   = document.getElementById('splash-hint');
    var canvas = document.getElementById('game');
    var ctx    = canvas.getContext('2d');

    var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isMobile) { hint.style.display = 'none'; }
    else          { choice.style.display = 'none'; }

    var COLS = 50;
    var blockSize, ROWS, offsetX, offsetY;

    var STEP_MS  = 140;
    var lastStep = -Infinity;
    var started  = false;

    var playerDirX, playerDirY, enemyDirX, enemyDirY;
    var playerSegments, enemySegments;
    var INITIAL_SNAKE_LEN = 12;
    var playerLen, enemyLen;
    var enemyThinkStep, currentLevel;
    var gameOver = false;
    var gameOverTime = -Infinity;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      blockSize = Math.floor(canvas.width / COLS);
      ROWS    = Math.floor(canvas.height / blockSize);
      offsetX = Math.floor((canvas.width  - COLS * blockSize) / 2);
      offsetY = Math.floor((canvas.height - ROWS * blockSize) / 2);
    }

    function initGame() {
      playerDirX = 0; playerDirY = 0;
      enemyDirX = -1; enemyDirY = 0;
      lastStep = -Infinity;
      gameOver = false;
      gameOverTime = -Infinity;
      playerLen = INITIAL_SNAKE_LEN;
      enemyLen = INITIAL_SNAKE_LEN;
      enemyThinkStep = 0;
      currentLevel = 1;
      playerSegments = [];
      enemySegments = [];
      var playerStartX = Math.floor(COLS * 0.28);
      var startY = Math.floor(ROWS / 2);
      for (var i = 0; i < INITIAL_SNAKE_LEN; i++) {
        playerSegments.push({ x: Math.max(1, playerStartX - i), y: startY });
      }
      resetEnemySnake();
    }

    function resetEnemySnake() {
      enemyDirX = -1; enemyDirY = 0;
      enemyLen = INITIAL_SNAKE_LEN;
      enemyThinkStep = 0;
      enemySegments = [];
      var enemyStartX = Math.floor(COLS * 0.72);
      var startY = Math.floor(ROWS / 2);
      for (var i = 0; i < enemyLen; i++) {
        enemySegments.push({ x: Math.min(COLS - 2, enemyStartX + i), y: startY });
      }
    }

    function px(gx) { return offsetX + gx * blockSize; }
    function py(gy) { return offsetY + gy * blockSize; }

    function fillCell(gx, gy) {
      ctx.fillRect(px(gx) + 1, py(gy) + 1, blockSize - 2, blockSize - 2);
    }

    function tailOf(segments) {
      return segments[segments.length - 1];
    }

    function trimSnake(segments, len) {
      while (segments.length > len) {
        segments.pop();
      }
    }

    function containsSegment(segments, x, y, startIndex) {
      for (var i = startIndex; i < segments.length; i++) {
        if (x === segments[i].x && y === segments[i].y) return true;
      }
      return false;
    }

    function canMove(segments, dirX, dirY) {
      var nextX = segments[0].x + dirX;
      var nextY = segments[0].y + dirY;
      return !containsSegment(segments, nextX, nextY, 1);
    }

    function chooseEnemyDirection(level) {
      enemyThinkStep++;
      var thinkEvery = level === 1 ? 5 : level === 2 ? 3 : 1;
      if (enemyThinkStep % thinkEvery !== 0) return;

      var head = enemySegments[0];
      var target = tailOf(playerSegments);
      var dx = target.x - head.x;
      var dy = target.y - head.y;
      var options = [];
      if (Math.abs(dx) >= Math.abs(dy) && dx !== 0) {
        options.push({ x: dx > 0 ? 1 : -1, y: 0 });
        if (dy !== 0) options.push({ x: 0, y: dy > 0 ? 1 : -1 });
      } else if (dy !== 0) {
        options.push({ x: 0, y: dy > 0 ? 1 : -1 });
        if (dx !== 0) options.push({ x: dx > 0 ? 1 : -1, y: 0 });
      }
      if (level === 1 && Math.random() < 0.35) options.reverse();
      if (level === 2 && Math.random() < 0.15) options.reverse();
      options.push({ x: enemyDirX, y: enemyDirY });
      for (var i = 0; i < options.length; i++) {
        if (canMove(enemySegments, options[i].x, options[i].y)) {
          enemyDirX = options[i].x;
          enemyDirY = options[i].y;
          return;
        }
      }
    }

    function nextHead(segments, dir) {
      var headX = segments[0].x;
      var headY = segments[0].y;
      var rawNextX = headX + dir.x;
      var rawNextY = headY + dir.y;
      if (rawNextX <= 0 || rawNextX >= COLS - 1) dir.x = -dir.x;
      if (rawNextY <= 0 || rawNextY >= ROWS - 1) dir.y = -dir.y;
      return {
        x: Math.max(1, Math.min(COLS - 2, headX + dir.x)),
        y: Math.max(1, Math.min(ROWS - 2, headY + dir.y))
      };
    }

    function step(now) {
      if (now - lastStep < STEP_MS) return;
      lastStep = now;

      var inp = GamePlate.input || {};
      var dx = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      var dy = (inp.down  ? 1 : 0) - (inp.up   ? 1 : 0);
      if (dx !== 0 || dy !== 0) {
        playerDirX = dx; playerDirY = dy;
      }

      chooseEnemyDirection(currentLevel);

      var playerMoves = playerDirX !== 0 || playerDirY !== 0;
      var playerDir = { x: playerDirX, y: playerDirY };
      var enemyDir = { x: enemyDirX, y: enemyDirY };
      var playerNext = playerMoves ? nextHead(playerSegments, playerDir) : playerSegments[0];
      var enemyNext = nextHead(enemySegments, enemyDir);
      playerDirX = playerDir.x; playerDirY = playerDir.y;
      enemyDirX = enemyDir.x; enemyDirY = enemyDir.y;

      var playerSelfBite = playerMoves && containsSegment(playerSegments, playerNext.x, playerNext.y, 1);
      var enemySelfBite = containsSegment(enemySegments, enemyNext.x, enemyNext.y, 1);
      var playerBitesEnemy = playerMoves && containsSegment(enemySegments, playerNext.x, playerNext.y, 1);
      var enemyBitesPlayer = containsSegment(playerSegments, enemyNext.x, enemyNext.y, 1);

      if (playerMoves) playerSegments.unshift(playerNext);
      enemySegments.unshift(enemyNext);

      if (playerSelfBite) playerLen = Math.max(1, playerLen - 1);
      if (enemySelfBite) enemyLen = Math.max(1, enemyLen - 1);
      if (playerBitesEnemy) enemyLen = Math.max(1, enemyLen - 1);
      if (enemyBitesPlayer) playerLen = Math.max(1, playerLen - 1);

      trimSnake(playerSegments, playerLen);
      trimSnake(enemySegments, enemyLen);

      if (playerSegments.length === 0) {
        playerSegments.push({ x: playerNext.x, y: playerNext.y });
      }
      if (enemySegments.length === 0) {
        enemySegments.push({ x: enemyNext.x, y: enemyNext.y });
      }
      if (enemyLen <= 1) {
        currentLevel = Math.min(3, currentLevel + 1);
        resetEnemySnake();
      }
      if (playerLen <= 1) {
        gameOver = true;
        gameOverTime = now;
      }
    }

    function draw() {
      ctx.fillStyle = '#080c10';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Wall perimeter
      ctx.fillStyle = '#8b2a18';
      for (var gx = 0; gx < COLS; gx++) {
        fillCell(gx, 0);
        fillCell(gx, ROWS - 1);
      }
      for (var gy = 1; gy < ROWS - 1; gy++) {
        fillCell(0, gy);
        fillCell(COLS - 1, gy);
      }

      // Player body
      ctx.fillStyle = '#1f9950';
      for (var i = 1; i < playerSegments.length - 1; i++) {
        fillCell(playerSegments[i].x, playerSegments[i].y);
      }

      if (playerSegments.length > 1) {
        ctx.fillStyle = '#9933cc';
        fillCell(tailOf(playerSegments).x, tailOf(playerSegments).y);
      }

      ctx.fillStyle = '#44ff88';
      fillCell(playerSegments[0].x, playerSegments[0].y);

      // Enemy body
      ctx.fillStyle = '#c23b3b';
      for (var j = 1; j < enemySegments.length - 1; j++) {
        fillCell(enemySegments[j].x, enemySegments[j].y);
      }

      if (enemySegments.length > 1) {
        ctx.fillStyle = '#ffd166';
        fillCell(tailOf(enemySegments).x, tailOf(enemySegments).y);
      }

      ctx.fillStyle = '#ff6b6b';
      fillCell(enemySegments[0].x, enemySegments[0].y);

      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = Math.max(12, Math.floor(blockSize * 0.9)) + 'px sans-serif';
      ctx.fillText('LEVEL ' + currentLevel, offsetX + blockSize, offsetY + blockSize * 2);

      // Game over overlay
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold ' + Math.floor(blockSize * 2.8) + 'px sans-serif';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - blockSize);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = Math.floor(blockSize * 1.1) + 'px sans-serif';
        ctx.fillText('press any direction to restart', canvas.width / 2, canvas.height / 2 + blockSize * 1.5);
      }
    }

    function loop(now) {
      requestAnimationFrame(loop);
      if (GamePlate.paused) return;
      if (started) {
        if (gameOver) {
          if (now - gameOverTime > 1000) {
            var inp = GamePlate.input || {};
            if (inp.up || inp.down || inp.left || inp.right || inp.a || inp.b) {
              initGame();
            }
          }
        } else {
          step(now);
        }
      }
      draw();
    }

    function dismissSplash() {
      splash.classList.add('hidden');
      splash.addEventListener('transitionend', function() {
        splash.style.display = 'none';
      }, { once: true });
    }

    function start(controller) {
      if (document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
      }
      try { screen.orientation.lock('landscape-primary').catch(function() {}); } catch(e) {}
      GamePlate.init({ orientation: 'landscape', controller: controller, fullscreen: true });
      resize();
      initGame();
      started = true;
      dismissSplash();
    }

    document.getElementById('btn-controller').addEventListener('click', function() { start('nes'); });
    hint.addEventListener('click', function() { start('keyboard'); });

    window.addEventListener('resize', function() {
      resize();
      if (started) initGame();
    });

    resize();
    initGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
