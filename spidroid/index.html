<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spidroid – Rotation</title>
  <style>
    html, body { margin: 0; padding: 0; background: #030308; overflow: hidden; }
    canvas { display: block; }
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #030308;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #game-logo {
      max-width: min(480px, 80vw);
      max-height: 30vh;
      object-fit: contain;
      animation: logo-zoom-in 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    #game-logo.floating {
      animation: logo-float 7s ease-in-out infinite;
    }
    @keyframes logo-zoom-in {
      from { transform: scale(0.25); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    @keyframes logo-float {
      0%   { transform: translate(0px,   0px)  rotate(0deg);    }
      25%  { transform: translate(6px,  -8px)  rotate(0.8deg);  }
      50%  { transform: translate(-3px, -14px) rotate(-0.5deg); }
      75%  { transform: translate(-7px, -5px)  rotate(0.6deg);  }
      100% { transform: translate(0px,   0px)  rotate(0deg);    }
    }
    #splash-tagline {
      margin: 0;
      font: 14px/1 sans-serif;
      color: rgba(0,229,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    #splash-choice { display: flex; gap: 14px; }
    .splash-btn {
      padding: 14px 28px;
      font: 600 15px/1 sans-serif;
      color: #00e5ff;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: rgba(0,229,255,0.07);
      border: 1.5px solid rgba(0,229,255,0.35);
      border-radius: 6px;
      cursor: pointer;
    }
    .splash-btn:hover { background: rgba(0,229,255,0.16); border-color: rgba(0,229,255,0.7); }
    #splash-hint {
      margin: 0;
      font: 15px/1 sans-serif;
      color: rgba(0,229,255,0.55);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    #gp-dpad .gp-arm-v, #gp-arr-up, #gp-arr-down { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="splash">
    <img id="game-logo" src="./assets/images/spidroid-logo.png" alt="Spidroid">
    <div id="splash-choice">
      <button class="splash-btn" id="btn-start">Start</button>
    </div>
  </div>

  <script src="./game-plate.js"></script>
  <script>
    var splash  = document.getElementById('splash');
    var canvas  = document.getElementById('game');

    document.getElementById('game-logo').addEventListener('animationend', function () {
      this.classList.add('floating');
    }, { once: true });
    var ctx     = canvas.getContext('2d');

    var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      if (gameStarted && nodes && nodes.length > 0) {
        var maxDist = 0;
        for (var i = 0; i < nodes.length; i++) {
          var ddx = nodes[i].x - nodes[0].x, ddy = nodes[i].y - nodes[0].y;
          maxDist = Math.max(maxDist, Math.sqrt(ddx * ddx + ddy * ddy));
        }
        if (maxDist > 0) {
          webRadius = maxDist;
          baseScale = Math.min(canvas.width, canvas.height) * 0.45 / maxDist;
          if (gamePhase !== 'PLAYING' && gamePhase !== 'DAY_BREAK') {
            cameraScale = baseScale;
          }
        }
      }
    }
    window.addEventListener('resize', resize);
    resize();

    function dismissSplash() {
      splash.classList.add('hidden');
      splash.addEventListener('transitionend', function () {
        splash.style.display = 'none';
      }, { once: true });
    }

    var gameStarted = false;

    function start(controller, rotation) {
      rotationEnabled = !!rotation;
      if (document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
      try { screen.orientation.lock('landscape-primary').catch(function () {}); } catch (e) {}
      GamePlate.init({ orientation: 'landscape', controller: controller, fullscreen: true, buttons: { a: 'Move', b: 'Sling' } });
      dismissSplash();
      gameStarted = true;
    }

    document.getElementById('btn-start').addEventListener('click', function () { start(isMobile ? 'nes' : 'keyboard', false); });

    // -------------------------------------------------------------------------
    // Audio
    // -------------------------------------------------------------------------
    var sounds = {
      'bug-capture': new Audio('assets/sounds/bug-capture.mp3'),
      'twang':       new Audio('assets/sounds/twang.mp3'),
      'twang2':      new Audio('assets/sounds/twang2.mp3'),
      'twang3':      new Audio('assets/sounds/twang3.mp3'),
      'chomp':       Object.assign(new Audio('assets/sounds/chomp.mp3'), { volume: 0.5 }),
      'web-sling':   new Audio('assets/sounds/web-sling.mp3'),
      'no-silk':     new Audio('assets/sounds/no-silk.mp3'),
    };
    function playSound(name) {
      var s = sounds[name];
      if (!s) return;
      s.currentTime = 0;
      s.play().catch(function(){});
    }

    // -------------------------------------------------------------------------
    // Graph
    // -------------------------------------------------------------------------
    var nodes        = [];  // { x, y }
    var adjacency    = [];  // adjacency[i] = angle-sorted array of neighbor indices
    var edgeStrength = {};  // 'min_max' → 0–100
    var originalEdgeCount = 0;

    function edgeKey(a, b) { return Math.min(a, b) + '_' + Math.max(a, b); }

    function jitter(amt) { return (Math.random() - 0.5) * 2 * amt; }

    function pointToSegmentDist(px, py, ax, ay, bx, by) {
      var dx = bx - ax, dy = by - ay;
      var lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.sqrt((px - ax) * (px - ax) + (py - ay) * (py - ay));
      var t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
      var nx = ax + t * dx, ny = ay + t * dy;
      return Math.sqrt((px - nx) * (px - nx) + (py - ny) * (py - ny));
    }

    function closestPointOnSegment(px, py, ax, ay, bx, by) {
      var dx = bx - ax, dy = by - ay;
      var lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return { x: ax, y: ay };
      var t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
      return { x: ax + t * dx, y: ay + t * dy };
    }

    function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
      var d1x = bx-ax, d1y = by-ay, d2x = dx-cx, d2y = dy-cy;
      var denom = d1x*d2y - d1y*d2x;
      if (denom === 0) return false;
      var t = ((cx-ax)*d2y - (cy-ay)*d2x) / denom;
      var u = ((cx-ax)*d1y - (cy-ay)*d1x) / denom;
      return t > 0 && t < 1 && u > 0 && u < 1;
    }

    function jerkNode(id) {
      var nb = adjacency[id];
      if (!nb || nb.length === 0) return;
      var cx = 0, cy = 0;
      for (var k = 0; k < nb.length; k++) { cx += nodes[nb[k]].x; cy += nodes[nb[k]].y; }
      nodes[id].targetX = cx / nb.length;
      nodes[id].targetY = cy / nb.length;
    }

    function animateNodes() {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].targetX === undefined) continue;
        var ddx = nodes[i].targetX - nodes[i].x;
        var ddy = nodes[i].targetY - nodes[i].y;
        if (Math.abs(ddx) < 0.5 && Math.abs(ddy) < 0.5) {
          nodes[i].x = nodes[i].targetX;
          nodes[i].y = nodes[i].targetY;
          delete nodes[i].targetX;
          delete nodes[i].targetY;
        } else {
          nodes[i].x += ddx * 0.1;
          nodes[i].y += ddy * 0.1;
        }
      }
    }

    function pruneDisconnectedNodes() {
      // BFS from node 0 to find reachable nodes
      var reachable = [];
      for (var ri = 0; ri < nodes.length; ri++) reachable.push(false);
      var queue = [0];
      reachable[0] = true;
      while (queue.length > 0) {
        var cur = queue.shift();
        var cnb = adjacency[cur];
        for (var ck = 0; ck < cnb.length; ck++) {
          if (!reachable[cnb[ck]]) {
            reachable[cnb[ck]] = true;
            queue.push(cnb[ck]);
          }
        }
      }
      // Mark unreachable nodes dead and clean up
      for (var pi = 0; pi < nodes.length; pi++) {
        if (reachable[pi] || nodes[pi].dead) continue;
        nodes[pi].dead = true;
        for (var bi = 0; bi < bugs.length; bi++) {
          var bug = bugs[bi];
          if (bug.landed && bug.nodeId === pi) {
            bug.landed = false;
            bug.nodeId = null;
            bug.heading = Math.random() * Math.PI * 2;
          }
        }
        var dnb = adjacency[pi].slice();
        for (var dj = 0; dj < dnb.length; dj++) {
          delete edgeStrength[edgeKey(pi, dnb[dj])];
          var ia = adjacency[dnb[dj]].indexOf(pi);
          if (ia >= 0) adjacency[dnb[dj]].splice(ia, 1);
        }
        adjacency[pi] = [];
      }
      if (!reachable[spider.nodeId]) { startCollapse(); return; }
      if (spider.state === 'TRAVERSING' && !reachable[spider.toId]) {
        startCollapse();
      }
    }

    function addEdge(a, b) {
      if (adjacency[a].indexOf(b) < 0) adjacency[a].push(b);
      if (adjacency[b].indexOf(a) < 0) adjacency[b].push(a);
      edgeStrength[edgeKey(a, b)] = 100;
    }

    function hasEdge(a, b) {
      return adjacency[a] && adjacency[a].indexOf(b) >= 0;
    }

    function hasPendingSlingEdge(a, b) {
      for (var i = 0; i < slingStrands.length; i++) {
        var strand = slingStrands[i];
        if ((strand.fromId === a && strand.toId === b) || (strand.fromId === b && strand.toId === a)) return true;
      }
      return false;
    }

    function removeEdge(a, b) {
      var ia = adjacency[a].indexOf(b);
      if (ia >= 0) adjacency[a].splice(ia, 1);
      var ib = adjacency[b].indexOf(a);
      if (ib >= 0) adjacency[b].splice(ib, 1);
      delete edgeStrength[edgeKey(a, b)];
    }

    function getIntegrity() {
      return originalEdgeCount > 0 ? Object.keys(edgeStrength).length / originalEdgeCount : 1;
    }

    function sortAdjacency() {
      var savedTarget = -1;
      if (spider && spider.state === 'AT_NODE' && adjacency[spider.nodeId] && adjacency[spider.nodeId].length > 0) {
        savedTarget = adjacency[spider.nodeId][spider.selIdx];
      }

      for (var i = 0; i < nodes.length; i++) {
        var ni = nodes[i];
        adjacency[i].sort(function (a, b) {
          var aa = Math.atan2(nodes[a].y - ni.y, nodes[a].x - ni.x);
          var ab = Math.atan2(nodes[b].y - ni.y, nodes[b].x - ni.x);
          return aa - ab;
        });
      }

      if (savedTarget >= 0) {
        var newIdx = adjacency[spider.nodeId].indexOf(savedTarget);
        if (newIdx >= 0) spider.selIdx = newIdx;
      }
    }

    // -------------------------------------------------------------------------
    // Node merging + 2-segment collapse
    // -------------------------------------------------------------------------
    function isOccupied(id) {
      if (spider.state === 'AT_NODE'   && spider.nodeId === id) return true;
      if (spider.state === 'TRAVERSING' && (spider.fromId === id || spider.toId === id)) return true;
      for (var bi = 0; bi < bugs.length; bi++)
        if (bugs[bi].landed && bugs[bi].nodeId === id) return true;
      return false;
    }

    function mergeTwoNodes(survivor, absorbed) {
      // Average position into survivor
      nodes[survivor].x = (nodes[survivor].x + nodes[absorbed].x) / 2;
      nodes[survivor].y = (nodes[survivor].y + nodes[absorbed].y) / 2;

      var bNb = adjacency[absorbed].slice();
      for (var k = 0; k < bNb.length; k++) {
        var nb = bNb[k];
        if (nb === survivor) continue;
        var oldStr = edgeStrength[edgeKey(absorbed, nb)] || 0;
        var newKey = edgeKey(survivor, nb);
        // Remove absorbed from neighbour's list
        var ib = adjacency[nb].indexOf(absorbed);
        if (ib >= 0) adjacency[nb].splice(ib, 1);
        delete edgeStrength[edgeKey(absorbed, nb)];
        if (edgeStrength[newKey] !== undefined) {
          // Edge already exists — keep the stronger of the two
          edgeStrength[newKey] = Math.min(100, Math.max(edgeStrength[newKey], oldStr));
        } else {
          if (adjacency[survivor].indexOf(nb) < 0) adjacency[survivor].push(nb);
          if (adjacency[nb].indexOf(survivor) < 0) adjacency[nb].push(survivor);
          edgeStrength[newKey] = oldStr;
        }
      }
      removeEdge(survivor, absorbed); // clean up direct link if it existed

      // Remap bugs
      for (var bi2 = 0; bi2 < bugs.length; bi2++)
        if (bugs[bi2].nodeId === absorbed) bugs[bi2].nodeId = survivor;

      // Remap spider
      if (spider.nodeId === absorbed) spider.nodeId = survivor;
      if (spider.fromId === absorbed) spider.fromId = survivor;
      if (spider.toId   === absorbed) spider.toId   = survivor;

      nodes[absorbed].dead = true;
      adjacency[absorbed]  = [];
    }

    function mergeCloseNodes() {
      var anyMerged = false;
      var changed   = true;
      while (changed) {
        changed = false;
        outer: for (var i = 0; i < nodes.length; i++) {
          if (nodes[i].dead) continue;
          for (var j = i + 1; j < nodes.length; j++) {
            if (nodes[j].dead) continue;
            var ddx = nodes[i].x - nodes[j].x;
            var ddy = nodes[i].y - nodes[j].y;
            if (ddx * ddx + ddy * ddy >= MERGE_DIST * MERGE_DIST) continue;

            // Both occupied by spider at AT_NODE → skip
            var iHasSpider = (spider.state === 'AT_NODE' && spider.nodeId === i) ||
                             (spider.state === 'TRAVERSING' && (spider.fromId === i || spider.toId === i));
            var jHasSpider = (spider.state === 'AT_NODE' && spider.nodeId === j) ||
                             (spider.state === 'TRAVERSING' && (spider.fromId === j || spider.toId === j));
            if (iHasSpider && jHasSpider) continue;

            // Pick survivor: spider's node > bug's node > more connections > lower index
            var survivor, absorbed;
            if (iHasSpider) { survivor = i; absorbed = j; }
            else if (jHasSpider) { survivor = j; absorbed = i; }
            else {
              var iBug = isOccupied(i), jBug = isOccupied(j);
              if (iBug && !jBug) { survivor = i; absorbed = j; }
              else if (jBug && !iBug) { survivor = j; absorbed = i; }
              else if (adjacency[j].length > adjacency[i].length) { survivor = j; absorbed = i; }
              else { survivor = i; absorbed = j; }
            }

            mergeTwoNodes(survivor, absorbed);
            anyMerged = true;
            changed   = true;
            break outer;
          }
        }
      }
      if (anyMerged) sortAdjacency();
    }

    function collapseShortEdges() {
      var anyCollapsed = false;
      var changed      = true;
      while (changed) {
        changed = false;
        for (var i = 0; i < nodes.length; i++) {
          if (i === 0) continue;
          if (nodes[i].dead) continue;
          if (adjacency[i].length !== 2) continue;
          if (isOccupied(i)) continue;

          var na = adjacency[i][0], nb = adjacency[i][1];
          var strA = edgeStrength[edgeKey(i, na)] || 0;
          var strB = edgeStrength[edgeKey(i, nb)] || 0;
          var newStr = Math.min(100, (strA + strB) / 2 + 20);

          removeEdge(i, na);
          removeEdge(i, nb);

          var existKey = edgeKey(na, nb);
          if (edgeStrength[existKey] !== undefined) {
            edgeStrength[existKey] = Math.min(100, edgeStrength[existKey] + 20);
          } else {
            if (adjacency[na].indexOf(nb) < 0) adjacency[na].push(nb);
            if (adjacency[nb].indexOf(na) < 0) adjacency[nb].push(na);
            edgeStrength[existKey] = newStr;
          }

          nodes[i].dead = true;
          adjacency[i]  = [];
          anyCollapsed  = true;
          changed       = true;
          break;
        }
      }
      if (anyCollapsed) sortAdjacency();
    }

    // --- Orb weaver web (garden spider) ---
    function buildOrbWeb() {
      var SCALE = 3200;
      nodes.push({ x: jitter(30), y: jitter(30) });

      var numSpokes = 8  + Math.floor(Math.random() * 5);
      var numRings  = 4  + Math.floor(Math.random() * 4);

      var baseSpacing = (Math.PI * 2) / numSpokes;
      var spokeAngles = [];
      for (var s = 0; s < numSpokes; s++) {
        spokeAngles.push(s * baseSpacing + jitter(baseSpacing * 0.12));
      }

      var ringRadii = [];
      for (var r = 0; r < numRings; r++) {
        var t = (r + 1) / numRings;
        var base = SCALE * 0.12 * Math.pow(1 / 0.12, t);
        ringRadii.push(base * (1 + jitter(0.08)));
      }

      var nodeAt = [];
      for (var r = 0; r < numRings; r++) {
        nodeAt.push([]);
        for (var s = 0; s < numSpokes; s++) {
          var ang = spokeAngles[s];
          var rad = ringRadii[r];
          var wobble = jitter(10);
          nodeAt[r].push(nodes.length);
          nodes.push({
            x: Math.cos(ang) * rad + Math.cos(ang + Math.PI / 2) * wobble,
            y: Math.sin(ang) * rad + Math.sin(ang + Math.PI / 2) * wobble
          });
        }
      }

      for (var i = 0; i < nodes.length; i++) adjacency.push([]);

      for (var s = 0; s < numSpokes; s++) addEdge(0, nodeAt[0][s]);

      for (var r = 0; r < numRings - 1; r++) {
        for (var s = 0; s < numSpokes; s++) addEdge(nodeAt[r][s], nodeAt[r + 1][s]);
      }

      for (var r = 1; r < numRings; r++) {
        for (var s = 0; s < numSpokes; s++) {
          addEdge(nodeAt[r][s], nodeAt[r][(s + 1) % numSpokes]);
        }
      }
    }

    // --- Cobweb / tangle web (house spider, black widow) ---
    function buildCobweb() {
      var SCALE = 3200;
      nodes.push({ x: jitter(60), y: jitter(60) });

      var numSpokes = 10 + Math.floor(Math.random() * 9);
      var numRings  =  3 + Math.floor(Math.random() * 3);

      var baseSpacing = (Math.PI * 2) / numSpokes;
      var spokeAngles = [];
      for (var s = 0; s < numSpokes; s++) {
        spokeAngles.push(s * baseSpacing + jitter(baseSpacing * 0.25));
      }

      var ringRadii = [];
      for (var r = 0; r < numRings; r++) {
        var t = (r + 1) / numRings;
        ringRadii.push(SCALE * (0.15 + 0.85 * t) * (1 + jitter(0.20)));
      }
      ringRadii.sort(function (a, b) { return a - b; });

      var nodeAt = [];
      for (var r = 0; r < numRings; r++) {
        nodeAt.push([]);
        for (var s = 0; s < numSpokes; s++) {
          var ang = spokeAngles[s];
          var rad = ringRadii[r];
          nodeAt[r].push(nodes.length);
          nodes.push({ x: Math.cos(ang) * rad + jitter(25), y: Math.sin(ang) * rad + jitter(25) });
        }
      }

      for (var i = 0; i < nodes.length; i++) adjacency.push([]);

      for (var s = 0; s < numSpokes; s++) addEdge(0, nodeAt[0][s]);

      for (var r = 0; r < numRings - 1; r++) {
        for (var s = 0; s < numSpokes; s++) addEdge(nodeAt[r][s], nodeAt[r + 1][s]);
      }

      for (var r = 0; r < numRings; r++) {
        var skipChance = (r === numRings - 1) ? 0 : 0.30;
        for (var s = 0; s < numSpokes; s++) {
          if (Math.random() > skipChance) addEdge(nodeAt[r][s], nodeAt[r][(s + 1) % numSpokes]);
        }
      }

      var extras = 15 + Math.floor(Math.random() * 10);
      for (var attempt = 0; attempt < 300 && extras > 0; attempt++) {
        var ca = 1 + Math.floor(Math.random() * (nodes.length - 1));
        var cb = 1 + Math.floor(Math.random() * (nodes.length - 1));
        if (ca === cb) continue;
        var ddx = nodes[ca].x - nodes[cb].x;
        var ddy = nodes[ca].y - nodes[cb].y;
        if (ddx * ddx + ddy * ddy < 200 * 200 && adjacency[ca].indexOf(cb) < 0) {
          addEdge(ca, cb);
          extras--;
        }
      }
    }

    // --- Spiral / dense orb web (Leucauge and similar) ---
    function buildSpiralWeb() {
      var SCALE = 3200;
      nodes.push({ x: 0, y: 0 });

      var numSpokes = 7 + Math.floor(Math.random() * 4);
      var numRings  = 6 + Math.floor(Math.random() * 5);

      var baseSpacing = (Math.PI * 2) / numSpokes;
      var spokeAngles = [];
      for (var s = 0; s < numSpokes; s++) {
        spokeAngles.push(s * baseSpacing + jitter(baseSpacing * 0.08));
      }

      var ringRadii = [];
      for (var r = 0; r < numRings; r++) {
        var t = (r + 1) / numRings;
        var base = SCALE * (0.08 + 0.92 * Math.pow(t, 1.5));
        ringRadii.push(base * (1 + jitter(0.05)));
      }

      var nodeAt = [];
      for (var r = 0; r < numRings; r++) {
        nodeAt.push([]);
        for (var s = 0; s < numSpokes; s++) {
          var ang = spokeAngles[s];
          var rad = ringRadii[r];
          nodeAt[r].push(nodes.length);
          nodes.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad });
        }
      }

      for (var i = 0; i < nodes.length; i++) adjacency.push([]);

      for (var s = 0; s < numSpokes; s++) addEdge(0, nodeAt[0][s]);

      for (var r = 0; r < numRings - 1; r++) {
        for (var s = 0; s < numSpokes; s++) addEdge(nodeAt[r][s], nodeAt[r + 1][s]);
      }

      for (var r = 0; r < numRings; r++) {
        for (var s = 0; s < numSpokes; s++) {
          addEdge(nodeAt[r][s], nodeAt[r][(s + 1) % numSpokes]);
        }
      }
    }

    function applyLengthBasedStrength() {
      var keys = Object.keys(edgeStrength);
      var maxLen = 0;
      var lengths = {};
      for (var ki = 0; ki < keys.length; ki++) {
        var parts = keys[ki].split('_');
        var a = +parts[0], b = +parts[1];
        var ldx = nodes[a].x - nodes[b].x, ldy = nodes[a].y - nodes[b].y;
        var len = Math.sqrt(ldx * ldx + ldy * ldy);
        lengths[keys[ki]] = len;
        if (len > maxLen) maxLen = len;
      }
      if (maxLen === 0) return;
      for (var ki = 0; ki < keys.length; ki++) {
        edgeStrength[keys[ki]] = Math.max(40, Math.min(100, 100 - (lengths[keys[ki]] / maxLen) * 60));
      }
    }

    function generateWeb() {
      nodes        = [];
      adjacency    = [];
      edgeStrength = {};
      var styles = ['orb', 'spiral'];
      var style  = styles[Math.floor(Math.random() * styles.length)];
      if (style === 'orb')    buildOrbWeb();
      if (style === 'cobweb') buildCobweb();
      if (style === 'spiral') buildSpiralWeb();
      sortAdjacency();
      applyLengthBasedStrength();
      originalEdgeCount = Object.keys(edgeStrength).length;
    }

    generateWeb();

    // -------------------------------------------------------------------------
    // Game state
    // -------------------------------------------------------------------------
    var bugs          = [];    // { nodeId, decayRate }
    var gamePhase     = 'INTRO'; // 'INTRO' | 'PLAYING' | 'COLLAPSE' | 'NIGHTFALL'
    var phaseFrame    = 0;
    var collapseSpinAngle = 0;
    var collapseCanvas = document.createElement('canvas');
    var bgDawnT       = 0;
    var bgDayT        = 0;
    var introCamX     = 0;
    var introCamY     = 0;
    var overlayAlpha  = 1;
    var score         = 0;
    var gameFrame            = 0;
    var levelFrame           = 0;
    var level                = 1;
    var silkUnlimited        = false;
    var levelAnnounceFrames  = 0;
    var LEVEL_ANNOUNCE_DURATION = 180;
    var spawnCooldown = 90;    // frames until first bug spawns
    var bugSpawnCount = 0;

    var SPAWN_INTERVAL  = 300;  // base frames between spawns (~5s)
    var LEVEL_DURATION  = 60 * 60; // 60 seconds per level
    var DAY_BREAK_FRAMES = 15 * 60; // 15 second repair window
    var MAX_BUGS        = 6;
    var EAT_RADIUS     = 100;
    var BUG_SCORES     = [1, 5, 10]; // orange, purple, green
    var COLLAPSE_FRAMES = 150;
    var NIGHTFALL_FRAMES = 48;
    var INTRO_FRAMES = 190;

    function spawnBug() {
      if (bugs.length >= MAX_BUGS) return;
      var stage      = Math.floor(gameFrame / (60 * 20));
      var spawnAngle = Math.random() * Math.PI * 2;
      if (level >= 2 && Math.random() < 0.30) {
        bugs.push({
          type: 'canyon',
          nodeId: null,
          decayRate: 0.16 + stage * 0.02,
          size: 1.5,
          speed: 20,
          x: Math.cos(spawnAngle) * 5000,
          y: Math.sin(spawnAngle) * 5000,
          heading: Math.random() * Math.PI * 2,
          vx: 0, vy: 0,
          landed: false,
          hit: false,
          animFrame: 0, animTimer: 0
        });
        bugSpawnCount++;
        return;
      }
      var tierRoll   = Math.random();
      var forceEarlyPurple = bugSpawnCount === 0 || bugSpawnCount === 2;
      var tier       = forceEarlyPurple ? 1 : tierRoll < 0.45 ? 0 : tierRoll < 0.82 ? 1 : 2;
      var tierSize   = [0.7, 1.0, 1.5][tier];
      var tierDecay  = [0.06, 0.10, 0.16][tier];
      var tierSpeed  = [8, 10.5, 20][tier];
      bugSpawnCount++;
      bugs.push({
        nodeId:    null,
        tier:      tier,
        decayRate: tierDecay + stage * 0.02,
        size:      tierSize,
        speed:     tierSpeed,
        x:         Math.cos(spawnAngle) * 5000,
        y:         Math.sin(spawnAngle) * 5000,
        heading:   Math.random() * Math.PI * 2,
        vx:        0,
        vy:        0,
        landed:    false,
        spinDir:   (Math.random() < 0.5 ? 1 : -1)
      });
    }

    function updateBugPhysics() {
      for (var bi = 0; bi < bugs.length; bi++) {
        var bug = bugs[bi];
        if (bug.type === 'canyon') {
          bug.animTimer++;
          if (bug.animTimer >= CANYON_FRAME_RATE) {
            bug.animTimer = 0;
            bug.animFrame = (bug.animFrame + 1) % CANYON_FRAME_TOTAL;
          }
        }
        if (!bug.landed) {
          // Heading drift — green is much more erratic
          if (bug.heading === undefined) bug.heading = Math.random() * Math.PI * 2;
          bug.heading += (Math.random() - 0.5) * (bug.type === 'canyon' || bug.tier === 2 ? 0.7 : bug.tier === 1 ? 0.28 : 0.22);
          // Steer toward web center
          var cx = nodes[0].x - bug.x;
          var cy = nodes[0].y - bug.y;
          var dist = Math.sqrt(cx * cx + cy * cy);
          if (bug.tier === 1) {
            // Purple: pressure the outer ring by spiraling inward instead of orbiting it.
            if (dist < 5600 && dist > 0.001) {
              var nx = cx / dist;
              var ny = cy / dist;
              var tx = -ny * bug.spinDir;
              var ty = nx * bug.spinDir;
              var inwardWeight = dist > 2600 ? 0.52 : 0.72;
              var tangentWeight = dist > 2600 ? 0.94 : 0.68;
              var desiredAngle = Math.atan2(
                ny * inwardWeight + ty * tangentWeight,
                nx * inwardWeight + tx * tangentWeight
              );
              var hdiff = desiredAngle - bug.heading;
              while (hdiff >  Math.PI) hdiff -= Math.PI * 2;
              while (hdiff < -Math.PI) hdiff += Math.PI * 2;
              bug.heading += hdiff * 0.085;
            }
          } else {
            var pullGate = 300;
            if (dist > pullGate) {
              var pullAngle = Math.atan2(cy, cx);
              var hdiff = pullAngle - bug.heading;
              while (hdiff >  Math.PI) hdiff -= Math.PI * 2;
              while (hdiff < -Math.PI) hdiff += Math.PI * 2;
              bug.heading += hdiff * 0.01;
            }
          }
          bug.vx = Math.cos(bug.heading) * bug.speed;
          bug.vy = Math.sin(bug.heading) * bug.speed;
          bug.x += bug.vx;
          bug.y += bug.vy;
        } else {
          var target = nodes[bug.nodeId];
          var tx = target.x - bug.x;
          var ty = target.y - bug.y;
          bug.vx = bug.vx * 0.78 + tx * 0.04 + (Math.random() - 0.5) * 20 * bug.size;
          bug.vy = bug.vy * 0.78 + ty * 0.04 + (Math.random() - 0.5) * 20 * bug.size;
          bug.x += bug.vx;
          bug.y += bug.vy;
        }
      }
    }

    function checkBugSnag() {
      for (var bi = bugs.length - 1; bi >= 0; bi--) {
        var bug = bugs[bi];
        if (bug.landed) continue;
        var caught = false;

        if (bug.type === 'canyon') {
          // CanyonCritter: snaps instantly to first node touched, severing all connected strands
          var NODE_SNAG_RADIUS = 100;
          for (var ni = 0; ni < nodes.length && !caught; ni++) {
            if (nodes[ni].dead) continue;
            var ndx = bug.x - nodes[ni].x, ndy = bug.y - nodes[ni].y;
            if (ndx * ndx + ndy * ndy < NODE_SNAG_RADIUS * NODE_SNAG_RADIUS) {
              caught = true;
              if (!bug.hit) {
                var neighbors = adjacency[ni].slice();
                for (var sni = 0; sni < neighbors.length; sni++) {
                  removeEdge(ni, neighbors[sni]);
                  playSound(['twang', 'twang2', 'twang3'][Math.floor(Math.random() * 3)]);
                }
                nodes[ni].dead = true;
                playSound('bug-capture');
                bug.hit = true;
              } else {
                bug.nodeId = ni;
                bug.landed = true;
                bug.vx *= 0.1;
                bug.vy *= 0.1;
                playSound('bug-capture');
              }
            }
          }
          continue;
        } else if (bug.tier === 1) {
          // Purple: passes over strands, only snags near a node directly
          var NODE_SNAG_RADIUS = 100;
          for (var ni = 0; ni < nodes.length && !caught; ni++) {
            if (nodes[ni].dead) continue;
            var ndx = bug.x - nodes[ni].x, ndy = bug.y - nodes[ni].y;
            if (ndx * ndx + ndy * ndy < NODE_SNAG_RADIUS * NODE_SNAG_RADIUS) {
              bug.nodeId = ni;
              bug.landed = true;
              playSound('bug-capture');
              bug.vx *= 0.1;
              bug.vy *= 0.1;
              caught = true;
            }
          }
        } else if (bug.tier === 2) {
          // Green: hits a strand and creates a new node at the exact hit point
          for (var i = 0; i < nodes.length && !caught; i++) {
            if (nodes[i].dead) continue;
            var nbArr = adjacency[i];
            for (var j = 0; j < nbArr.length && !caught; j++) {
              var n2 = nbArr[j];
              if (n2 <= i) continue;
              var d = pointToSegmentDist(bug.x, bug.y, nodes[i].x, nodes[i].y, nodes[n2].x, nodes[n2].y);
              if (d < 40) {
                var pt = closestPointOnSegment(bug.x, bug.y, nodes[i].x, nodes[i].y, nodes[n2].x, nodes[n2].y);
                var newId = nodes.length;
                nodes.push({ x: pt.x, y: pt.y });
                adjacency.push([]);
                var oldStr = edgeStrength[edgeKey(i, n2)];
                removeEdge(i, n2);
                addEdge(i, newId);    edgeStrength[edgeKey(i, newId)]   = oldStr;
                addEdge(newId, n2);   edgeStrength[edgeKey(newId, n2)]  = oldStr;
                originalEdgeCount++;
                sortAdjacency();
                bug.nodeId = newId;
                bug.landed = true;
                playSound('bug-capture');
                bug.vx *= 0.1;
                bug.vy *= 0.1;
                caught = true;
              }
            }
          }
        } else {
          // Orange: snaps to nearest node endpoint on any strand hit
          for (var i = 0; i < nodes.length && !caught; i++) {
            if (nodes[i].dead) continue;
            var nbArr = adjacency[i];
            for (var j = 0; j < nbArr.length && !caught; j++) {
              var n2 = nbArr[j];
              if (n2 <= i) continue;
              var d = pointToSegmentDist(bug.x, bug.y, nodes[i].x, nodes[i].y, nodes[n2].x, nodes[n2].y);
              if (d < 40) {
                var d1 = (bug.x - nodes[i].x) * (bug.x - nodes[i].x) + (bug.y - nodes[i].y) * (bug.y - nodes[i].y);
                var d2 = (bug.x - nodes[n2].x) * (bug.x - nodes[n2].x) + (bug.y - nodes[n2].y) * (bug.y - nodes[n2].y);
                bug.nodeId = d1 < d2 ? i : n2;
                bug.landed = true;
                playSound('bug-capture');
                bug.vx *= 0.1;
                bug.vy *= 0.1;
                caught = true;
              }
            }
          }
        }
      }
    }

    function updateBugs() {
      var broken = [];
      for (var bi = 0; bi < bugs.length; bi++) {
        var bug = bugs[bi];
        if (!bug.landed) continue;
        var nb = adjacency[bug.nodeId];
        for (var j = 0; j < nb.length; j++) {
          var key = edgeKey(bug.nodeId, nb[j]);
          if (edgeStrength[key] !== undefined) {
            edgeStrength[key] -= bug.decayRate;
            if (edgeStrength[key] <= 0) broken.push([bug.nodeId, nb[j]]);
          }
        }
      }
      var anyBroken = false;
      for (var k = 0; k < broken.length; k++) {
        var ea = broken[k][0], eb = broken[k][1];
        if (edgeStrength[edgeKey(ea, eb)] !== undefined) {
          removeEdge(ea, eb);
          playSound(['twang', 'twang2', 'twang3'][Math.floor(Math.random() * 3)]);
          jerkNode(ea);
          jerkNode(eb);
          anyBroken = true;
        }
      }
      if (anyBroken) {
        pruneDisconnectedNodes();
        if (gamePhase === 'COLLAPSE') return;
        sortAdjacency();
        mergeCloseNodes();
        collapseShortEdges();
        if (spider.state === 'AT_NODE') {
          var nbl = adjacency[spider.nodeId].length;
          if (nbl > 0) spider.selIdx = bestForwardIdx(spider.nodeId, spider.fromId);
          else spider.selIdx = 0;
        }
      }
      // Remove wandering bugs that drifted off screen
      for (var bi2 = bugs.length - 1; bi2 >= 0; bi2--) {
        if (!bugs[bi2].landed) {
          var bx = bugs[bi2].x, by = bugs[bi2].y;
          if (bx * bx + by * by > 8000 * 8000) bugs.splice(bi2, 1);
        }
      }
    }

    function checkSpiderEatsBugs() {
      var sp = spiderWorldPos();
      for (var bi = bugs.length - 1; bi >= 0; bi--) {
        var bug = bugs[bi];
        var ddx = bug.x - sp.x, ddy = bug.y - sp.y;
        if (ddx * ddx + ddy * ddy < EAT_RADIUS * EAT_RADIUS) {
          var val = bug.type === 'canyon' ? 10 : (BUG_SCORES[bug.tier] || 1);
          bugs.splice(bi, 1);
          score += val;
          silk = Math.min(SILK_MAX, silk + val);
          playSound('chomp');
          triggerEatAnim();
        }
      }
    }

    function edgeColorForStrength(s) {
      var t = s / 100; // 1 = strong (blue), 0 = weak (red)
      var r = Math.round((1 - t) * 255 + t * 40);
      var g = Math.round((1 - t) * 20  + t * 80);
      var b = Math.round((1 - t) * 20  + t * 255);
      var a = (0.3 + t * 0.65).toFixed(2);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }

    // -------------------------------------------------------------------------
    // Spider state
    // -------------------------------------------------------------------------
    var spider = {
      state:  'AT_NODE',
      nodeId: 0,
      fromId: 0,
      toId:   0,
      t:      0,
      selIdx: 0
    };

    var spiderImg = new Image();
    spiderImg.src = 'assets/images/spidroid-walking.png';
    var SPIDER_FRAME_COUNT = 8;
    var spiderAnimFrame = 0;
    var spiderAnimTimer = 0;
    var SPIDER_FRAME_RATE = 4;
    var spiderFrameOrbs = null;

    var eatAnimTimer = 0;
    var EAT_ANIM_FRAMES = 20;
    var eatAnimStyle = 0;

    function triggerEatAnim() {
      eatAnimTimer = EAT_ANIM_FRAMES;
      eatAnimStyle = Math.random() < 0.5 ? 0 : 1;
    }

    function detectSpiderOrbs() {
      var tmpC = document.createElement('canvas');
      tmpC.width = spiderImg.naturalWidth;
      tmpC.height = spiderImg.naturalHeight;
      var tmpCtx = tmpC.getContext('2d');
      tmpCtx.drawImage(spiderImg, 0, 0);
      var data = tmpCtx.getImageData(0, 0, tmpC.width, tmpC.height).data;
      var W = tmpC.width, H = tmpC.height;
      var slotW = Math.floor(W / SPIDER_FRAME_COUNT);
      spiderFrameOrbs = [];
      for (var f = 0; f < SPIDER_FRAME_COUNT; f++) {
        var x0 = f * slotW;
        var x1 = f === SPIDER_FRAME_COUNT - 1 ? W : x0 + slotW;
        var sumX = 0, sumY = 0, n = 0;
        for (var y = 0; y < H; y++) {
          for (var x = x0; x < x1; x++) {
            var idx = (y * W + x) * 4;
            var r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
            if (a > 100 && b > 180 && b > r + 60) { sumX += x; sumY += y; n++; }
          }
        }
        spiderFrameOrbs.push(n > 0 ? { cx: sumX/n, cy: sumY/n } : { cx: x0 + slotW/2, cy: H/2 });
      }
    }

    spiderImg.onload = detectSpiderOrbs;
    if (spiderImg.complete && spiderImg.naturalWidth > 0) detectSpiderOrbs();

    var canyonImg = new Image();
    canyonImg.src = 'assets/images/CanyonCritter.png';
    var CANYON_COLS = 4, CANYON_ROWS = 3;
    var CANYON_FRAME_TOTAL = 11;
    var CANYON_FRAME_RATE = 5;

    function spiderWorldPos() {
      if (spider.state === 'AT_NODE') return nodes[spider.nodeId];
      var f = nodes[spider.fromId], to = nodes[spider.toId];
      return { x: f.x + (to.x - f.x) * spider.t, y: f.y + (to.y - f.y) * spider.t };
    }

    function angleDiff(a, b) {
      var d = a - b;
      while (d >  Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function bestForwardIdx(atId, fromId) {
      var neighbors   = adjacency[atId];
      var travelAngle = Math.atan2(nodes[atId].y - nodes[fromId].y, nodes[atId].x - nodes[fromId].x);
      var bestIdx = 0, bestScore = Infinity;
      for (var k = 0; k < neighbors.length; k++) {
        if (neighbors[k] === fromId) continue;
        var na   = Math.atan2(nodes[neighbors[k]].y - nodes[atId].y, nodes[neighbors[k]].x - nodes[atId].x);
        var diff = Math.abs(angleDiff(na, travelAngle));
        if (diff < bestScore) { bestScore = diff; bestIdx = k; }
      }
      // Dead end: all neighbors are fromId — fall back to index 0 so spider can go back
      if (bestScore === Infinity && neighbors.length > 0) bestIdx = 0;
      return bestIdx;
    }

    function slingTargets(fromId) {
      var targets = [];
      var fromNode = nodes[fromId];
      if (!fromNode || fromNode.dead) return targets;
      for (var i = 0; i < nodes.length; i++) {
        if (i === fromId || nodes[i].dead || hasEdge(fromId, i) || hasPendingSlingEdge(fromId, i)) continue;
        var fn = nodes[fromId], cn = nodes[i];
        var crosses = false;
        for (var j = 0; j < nodes.length && !crosses; j++) {
          if (!adjacency[j]) continue;
          for (var k = 0; k < adjacency[j].length && !crosses; k++) {
            var nb = adjacency[j][k];
            if (nb <= j) continue;
            if (j === fromId || nb === fromId || j === i || nb === i) continue;
            crosses = segmentsIntersect(fn.x, fn.y, cn.x, cn.y,
                                        nodes[j].x, nodes[j].y, nodes[nb].x, nodes[nb].y);
          }
        }
        if (crosses) continue;
        targets.push(i);
      }
      targets.sort(function (a, b) {
        var aa = Math.atan2(nodes[a].y - fromNode.y, nodes[a].x - fromNode.x);
        var ab = Math.atan2(nodes[b].y - fromNode.y, nodes[b].x - fromNode.x);
        return aa - ab;
      });
      return targets;
    }

    function syncSlingTarget() {
      if (!slingActive || spider.state !== 'AT_NODE') {
        slingTargetId = null;
        slingTargetBug = null;
        return [];
      }
      var nodeTgts = slingTargets(spider.nodeId);
      var combined = [];
      for (var ni = 0; ni < nodeTgts.length; ni++) combined.push({ type: 'node', id: nodeTgts[ni] });
      var fromNode = nodes[spider.nodeId];
      for (var bi = 0; bi < bugs.length; bi++) {
        var bug = bugs[bi];
        if (bug.type === 'canyon' ? !bug.landed : bug.landed) continue;
        var bugCrosses = false;
        for (var j = 0; j < nodes.length && !bugCrosses; j++) {
          if (!adjacency[j]) continue;
          for (var k = 0; k < adjacency[j].length && !bugCrosses; k++) {
            var nbb = adjacency[j][k];
            if (nbb <= j) continue;
            if (j === spider.nodeId || nbb === spider.nodeId) continue;
            bugCrosses = segmentsIntersect(fromNode.x, fromNode.y, bug.x, bug.y,
                                           nodes[j].x, nodes[j].y, nodes[nbb].x, nodes[nbb].y);
          }
        }
        if (!bugCrosses) combined.push({ type: 'bug', id: bi });
      }
      if (combined.length === 0) {
        slingTargetId = null;
        slingTargetBug = null;
        return combined;
      }
      // Preserve current target position in combined list
      for (var ci = 0; ci < combined.length; ci++) {
        var ct = combined[ci];
        if (slingTargetId !== null && ct.type === 'node' && ct.id === slingTargetId) { slingAimIdx = ci; break; }
        if (slingTargetBug !== null && ct.type === 'bug'  && ct.id === slingTargetBug) { slingAimIdx = ci; break; }
      }
      slingAimIdx = ((slingAimIdx % combined.length) + combined.length) % combined.length;
      var cur = combined[slingAimIdx];
      if (cur.type === 'node') { slingTargetId = cur.id; slingTargetBug = null; }
      else                     { slingTargetId = null;   slingTargetBug = cur.id; }
      return combined;
    }

    function startSlingStrand(fromId, toId) {
      if (fromId === toId || !nodes[fromId] || !nodes[toId] || nodes[fromId].dead || nodes[toId].dead || hasEdge(fromId, toId) || hasPendingSlingEdge(fromId, toId)) return;
      playSound('web-sling');
      slingStrands.push({ fromId: fromId, toId: toId, t: 0 });
    }

    function startBugSlingStrand(fromId, bugRef) {
      if (!bugRef || bugs.indexOf(bugRef) < 0) return;
      if (bugRef.type === 'canyon' ? !bugRef.landed : bugRef.landed) return;
      playSound('web-sling');
      slingStrands.push({ fromId: fromId, toBugRef: bugRef, t: 0,
                          pulling: false, pullT: 0, pullStartX: 0, pullStartY: 0 });
    }

    function updateSlingStrands() {
      for (var i = slingStrands.length - 1; i >= 0; i--) {
        var strand = slingStrands[i];

        if (strand.toBugRef !== undefined) {
          var bugRef = strand.toBugRef;
          var bugIdx = bugs.indexOf(bugRef);
          var isCanyonStrand = bugRef.type === 'canyon';

          if (strand.pulling) {
            strand.pullT = Math.min(1, strand.pullT + PULL_SPEED);
            bugRef.x = strand.pullStartX + (nodes[strand.fromId].x - strand.pullStartX) * strand.pullT;
            bugRef.y = strand.pullStartY + (nodes[strand.fromId].y - strand.pullStartY) * strand.pullT;
            if (strand.pullT >= 1) {
              score += 10;
              silk = Math.min(SILK_MAX, silk + 10);
              playSound('chomp');
              triggerEatAnim();
              bugs.splice(bugIdx, 1);
              slingStrands.splice(i, 1);
            }
            continue;
          }

          var shouldCancel = bugIdx < 0 || (isCanyonStrand ? !bugRef.landed : bugRef.landed);
          if (shouldCancel) { slingStrands.splice(i, 1); continue; }
          strand.t += SLING_BUILD_SPEED;
          if (strand.t >= 1) {
            if (isCanyonStrand) {
              if (!bugRef.hit) {
                bugRef.hit = true;
                playSound(['twang','twang2','twang3'][Math.floor(Math.random() * 3)]);
                slingStrands.splice(i, 1);
              } else {
                strand.pulling   = true;
                strand.pullT     = 0;
                strand.pullStartX = bugRef.x;
                strand.pullStartY = bugRef.y;
              }
            } else {
              var eatVal = BUG_SCORES[bugRef.tier] || 1;
              score += eatVal;
              silk = Math.min(SILK_MAX, silk + eatVal);
              playSound('chomp');
              triggerEatAnim();
              bugs.splice(bugIdx, 1);
              slingStrands.splice(i, 1);
            }
          }
          continue;
        }

        if (!nodes[strand.fromId] || !nodes[strand.toId] || nodes[strand.fromId].dead || nodes[strand.toId].dead || hasEdge(strand.fromId, strand.toId)) {
          slingStrands.splice(i, 1);
          continue;
        }
        strand.t += SLING_BUILD_SPEED;
        if (strand.t >= 1) {
          addEdge(strand.fromId, strand.toId);
          sortAdjacency();
          if (spider.state === 'AT_NODE' && spider.nodeId === strand.fromId) {
            var slingNb = adjacency[strand.fromId];
            var slingIdx = slingNb ? slingNb.indexOf(strand.toId) : -1;
            if (slingIdx >= 0) spider.selIdx = slingIdx;
          }
          slingStrands.splice(i, 1);      
        }
      }
    }

    // -------------------------------------------------------------------------
    // Camera
    // -------------------------------------------------------------------------
    function targetCameraAngle() {
      var fromNode, toNode;
      if (spider.state === 'AT_NODE') {
        if (slingActive && slingTargetId !== null && nodes[slingTargetId]) {
          fromNode = nodes[spider.nodeId];
          toNode = nodes[slingTargetId];
          return -Math.PI / 2 - Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x);
        }
        if (slingActive && slingTargetBug !== null && bugs[slingTargetBug] && !bugs[slingTargetBug].landed) {
          fromNode = nodes[spider.nodeId];
          var bugTgt = bugs[slingTargetBug];
          return -Math.PI / 2 - Math.atan2(bugTgt.y - fromNode.y, bugTgt.x - fromNode.x);
        }
        var nb = adjacency[spider.nodeId];
        if (!nb.length) return cameraAngle;
        fromNode = nodes[spider.nodeId];
        toNode   = nodes[nb[spider.selIdx]];
      } else {
        fromNode = nodes[spider.fromId];
        toNode   = nodes[spider.toId];
      }
      return -Math.PI / 2 - Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x);
    }

    var initNeighbor = adjacency[0][0];
    var cameraAngle  = -Math.PI / 2 - Math.atan2(
      nodes[initNeighbor].y - nodes[0].y,
      nodes[initNeighbor].x - nodes[0].x
    );

    var cameraScale = 1.0;
    var baseScale   = 1.0;
    var webRadius   = 1.0;
    var MAX_ZOOM    = 2.5;
    var ZOOM_LERP   = 0.04;

    var MERGE_DIST      = 55;  // world-px; nodes closer than this merge
    var DASH_THRESHOLD  = 20;  // strength below this renders dashed

    var ROTATION_LERP  = 0.03;
    var TRAVERSE_SPEED = 0.07;
    var REPAIR_PER_FRAME = 0.45;
    var SLING_BUILD_SPEED = 0.08;
    var PULL_SPEED        = 0.05;
    var HOLD_DELAY     = 10;
    var HOLD_REPEAT    = 5;
    var NODE_DWELL     = 0;

    var leftHoldFrames  = 0;
    var rightHoldFrames = 0;
    var nodeDwellFrames = 0;
    var traversalInputBuffer = null; // 'left' | 'right' | null
    var slingActive     = false;
    var slingAimIdx     = 0;
    var slingTargetId   = null;
    var slingTargetBug  = null; // flying bug index when B-sling aims at a bug
    var wasBDown        = false;
    var slingStrands    = [];

    var SILK_MAX  = 15;
    var SILK_COST = 5;
    var silk      = SILK_MAX;

    var rotationEnabled = false;

    function startOverview() {
      var maxDist = 0;
      for (var i = 0; i < nodes.length; i++) {
        var ddx = nodes[i].x - nodes[0].x, ddy = nodes[i].y - nodes[0].y;
        maxDist = Math.max(maxDist, Math.sqrt(ddx * ddx + ddy * ddy));
      }
      webRadius   = maxDist;
      baseScale   = Math.min(canvas.width, canvas.height) * 0.45 / maxDist;
      cameraScale = baseScale;
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function resetWebState() {
      generateWeb();
      spider.state  = 'AT_NODE';
      spider.nodeId = 0;
      spider.fromId = 0;
      spider.toId   = 0;
      spider.t      = 0;
      spider.selIdx = 0;
      slingActive = false;
      slingAimIdx = 0;
      slingTargetId = null;
      slingTargetBug = null;
      wasBDown = false;
      slingStrands = [];
      silk = SILK_MAX;
      leftHoldFrames = rightHoldFrames = nodeDwellFrames = 0;
      var initNb = adjacency[0][0];
      cameraAngle = -Math.PI / 2 - Math.atan2(nodes[initNb].y - nodes[0].y, nodes[initNb].x - nodes[0].x);
      startOverview();
    }

    function beginIntroPan() {
      var safeScale = Math.max(baseScale, 0.001);
      introCamX = Math.max(2200, canvas.width / safeScale * 0.72);
      introCamY = -Math.max(650, canvas.height / safeScale * 0.18);
      bgDawnT = 0;
      overlayAlpha = 1;
    }

    function resetGame() {
      bugs          = [];
      score         = 0;
      gameFrame     = 0;
      spawnCooldown = 90;
      bugSpawnCount = 0;
      resetWebState();
    }

    function resetWeb() {
      resetWebState();
      beginIntroPan();
      phaseFrame = 0;
      gamePhase = 'INTRO';
    }

    startOverview();
    beginIntroPan();

    function startCollapse() {
      if (gamePhase === 'COLLAPSE') return;
      collapseCanvas.width = canvas.width;
      collapseCanvas.height = canvas.height;
      collapseCanvas.getContext('2d').drawImage(canvas, 0, 0);
      gamePhase = 'COLLAPSE';
      phaseFrame = 0;
      collapseSpinAngle = 0;
      bgDawnT = 0;
      overlayAlpha = 0;
    }

    function startDayBreak() {
      gamePhase = 'DAY_BREAK';
      phaseFrame = 0;
      silkUnlimited = true;
      bugs = [];
    }

    function startNextLevel() {
      level++;
      MAX_BUGS += 2;
      levelFrame = 0;
      silkUnlimited = false;
      bgDayT = 0;
      levelAnnounceFrames = LEVEL_ANNOUNCE_DURATION;
      gamePhase = 'PLAYING';
      phaseFrame = 0;
    }

    document.addEventListener('keydown', function (e) {
      if (gamePhase !== 'PLAYING') return;
      if (e.key === 'r' || e.key === 'R') rotationEnabled = !rotationEnabled;
      if (e.key === 'n' || e.key === 'N') resetWeb();
    });

    // -------------------------------------------------------------------------
    // Draw helpers
    // -------------------------------------------------------------------------
    function drawEdge(ax, ay, bx, by, color, width, glow, dashed) {
      if (glow) {
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.strokeStyle = glow;
        ctx.lineWidth   = width * 4;
        ctx.stroke();
      }
      if (dashed) ctx.setLineDash([width * 3, width * 3]);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.strokeStyle = color;
      ctx.lineWidth   = width;
      ctx.stroke();
      if (dashed) ctx.setLineDash([]);
    }

    function drawRepairSegment(ax, ay, bx, by, t, width) {
      var sx = ax + (bx - ax) * Math.max(0, Math.min(t, 1));
      var sy = ay + (by - ay) * Math.max(0, Math.min(t, 1));

      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(sx, sy);
      ctx.strokeStyle = 'rgba(120,255,210,0.18)';
      ctx.lineWidth = width * 5;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(sx, sy);
      ctx.strokeStyle = 'rgba(170,255,230,0.95)';
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function drawNode(x, y, radius, color, glowColor, glowRadius) {
      var g = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
      g.addColorStop(0, glowColor);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCollapseAway() {
      var t = Math.min(phaseFrame / COLLAPSE_FRAMES, 1);
      var pull = easeOutCubic(t);
      var scale = 1 - pull * 0.84;
      var alpha = Math.max(0, 1 - Math.pow(t, 1.55));
      var driftX = canvas.width * 0.05 * pull;
      var driftY = -canvas.height * 0.04 * pull;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(canvas.width / 2 + driftX, canvas.height / 2 + driftY);
      ctx.rotate(collapseSpinAngle);
      ctx.scale(scale, scale);
      ctx.drawImage(collapseCanvas, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
      ctx.restore();

      var vignette = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.12,
        canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.78
      );
      vignette.addColorStop(0, 'rgba(3,3,8,0)');
      vignette.addColorStop(1, 'rgba(3,3,8,' + (0.7 * pull).toFixed(3) + ')');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var textAlpha = Math.max(0, (t - 0.3) / 0.4);
      if (textAlpha > 0) {
        var fontSize = Math.round(canvas.width * 0.09);
        ctx.save();
        ctx.globalAlpha = textAlpha;
        ctx.font = 'bold ' + fontSize + 'px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = fontSize * 0.4;
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.restore();
      }
    }

    // -------------------------------------------------------------------------
    // Main loop
    // -------------------------------------------------------------------------
    function loop() {
      requestAnimationFrame(loop);
      if (!gameStarted || GamePlate.paused) return;
      var inp = GamePlate.input || {};

      // --- Phase state machine ---
      phaseFrame++;
      if (eatAnimTimer > 0) eatAnimTimer--;

      if (gamePhase === 'COLLAPSE') {
        collapseSpinAngle += 0.012 + phaseFrame * 0.00011;
        bgDawnT = 0;
        if (phaseFrame >= COLLAPSE_FRAMES) {
          gamePhase = 'NIGHTFALL';
          phaseFrame = 0;
          overlayAlpha = 0;
        }
      } else if (gamePhase === 'NIGHTFALL') {
        overlayAlpha = Math.min(phaseFrame / NIGHTFALL_FRAMES, 1);
        if (phaseFrame >= NIGHTFALL_FRAMES) {
          bugs = [];
          score = 0;
          gameFrame = 0;
          levelFrame = 0;
          level = 1;
          MAX_BUGS = 6;
          silkUnlimited = false;
          bgDayT = 0;
          spawnCooldown = 90;
          bugSpawnCount = 0;
          resetWebState();
          collapseSpinAngle = 0;
          collapseCanvas.width = 0;
          collapseCanvas.height = 0;
          beginIntroPan();
          gamePhase = 'INTRO';
          phaseFrame = 0;
        }
      } else if (gamePhase === 'DAY_BREAK') {
        var FADE_IN_END = DAY_BREAK_FRAMES * 0.25;
        if (phaseFrame < FADE_IN_END) {
          bgDayT = phaseFrame / FADE_IN_END;
        } else {
          bgDayT = 1 - (phaseFrame - FADE_IN_END) / (DAY_BREAK_FRAMES - FADE_IN_END);
        }
        bgDayT = Math.max(0, bgDayT);
        animateNodes();
        updateSlingStrands();
        if (phaseFrame >= DAY_BREAK_FRAMES) {
          startNextLevel();
        }
      } else if (gamePhase === 'INTRO') {
        var introT = Math.min(phaseFrame / INTRO_FRAMES, 1);
        var panT = easeInOutCubic(introT);
        introCamX *= 1 - 0.035 * (0.25 + panT);
        introCamY *= 1 - 0.032 * (0.25 + panT);
        bgDawnT = introT < 0.28
          ? introT / 0.28
          : Math.max(0, 1 - (introT - 0.28) / 0.72);
        overlayAlpha = Math.max(1 - introT / 0.36, 0);
        cameraScale += (baseScale - cameraScale) * 0.025;
        if (phaseFrame >= INTRO_FRAMES) {
          introCamX = 0;
          introCamY = 0;
          overlayAlpha = 0;
          bgDawnT = 0;
          gamePhase = 'PLAYING';
          phaseFrame = 0;
        }
      } else {
        // PLAYING

        // --- Advance frame ---
        gameFrame++;
        levelFrame++;
        if (levelAnnounceFrames > 0) levelAnnounceFrames--;

        // --- Level end check ---
        if (levelFrame >= LEVEL_DURATION) {
          startDayBreak();
        } else {

        // --- Spawn bugs ---
        spawnCooldown--;
        if (spawnCooldown <= 0) {
          spawnBug();
          var stage = Math.floor(gameFrame / (60 * 20));
          spawnCooldown = Math.max(120, SPAWN_INTERVAL - stage * 30);
        }

        // --- Animate node repositioning ---
        animateNodes();
        updateSlingStrands();

        // --- Move bugs + degrade strands ---
        updateBugPhysics();
        checkBugSnag();
        updateBugs();

        // --- Check web integrity ---
        if (getIntegrity() < 0.40) startCollapse();
        } // end else (not day break)
      }

      // --- Update spider (PLAYING and DAY_BREAK) ---
      if (gamePhase === 'PLAYING' || gamePhase === 'DAY_BREAK') {
        var bDown = !!inp.b;
        var releasedSling = false;
        if (spider.state === 'AT_NODE') {
          if (!bDown && wasBDown && slingActive) {
            syncSlingTarget();
            var releaseTargetId = slingTargetId;
            var releaseBugId    = slingTargetBug;
            var releaseFromId   = spider.nodeId;
            slingActive = false;
            slingTargetId = null;
            slingTargetBug = null;
            var hasTarget = releaseTargetId !== null || releaseBugId !== null;
            if (hasTarget && (silkUnlimited || silk >= SILK_COST)) {
              if (!silkUnlimited) silk -= SILK_COST;
              if (releaseTargetId !== null) {
                startSlingStrand(releaseFromId, releaseTargetId);
              } else {
                startBugSlingStrand(releaseFromId, bugs[releaseBugId]);
              }
              releasedSling = true;
            } else if (hasTarget && !silkUnlimited) {
              playSound('no-silk');
            }
          }

          if (bDown) {
            if (!slingActive) {
              slingActive = true;
              slingAimIdx = 0;
              slingTargetId = null;
              slingTargetBug = null;
            }
            var slingList = syncSlingTarget();

            if (slingList.length > 0) {
              if (inp.left) {
                leftHoldFrames++;
                if (leftHoldFrames === 1 || (leftHoldFrames > HOLD_DELAY && (leftHoldFrames - HOLD_DELAY) % HOLD_REPEAT === 0))
                  slingAimIdx = (slingAimIdx - 1 + slingList.length) % slingList.length;
              } else { leftHoldFrames = 0; }

              if (inp.right) {
                rightHoldFrames++;
                if (rightHoldFrames === 1 || (rightHoldFrames > HOLD_DELAY && (rightHoldFrames - HOLD_DELAY) % HOLD_REPEAT === 0))
                  slingAimIdx = (slingAimIdx + 1) % slingList.length;
              } else { rightHoldFrames = 0; }

              slingAimIdx = ((slingAimIdx % slingList.length) + slingList.length) % slingList.length;
              var slingCur = slingList[slingAimIdx];
              if (slingCur.type === 'node') { slingTargetId = slingCur.id; slingTargetBug = null; }
              else                          { slingTargetId = null; slingTargetBug = slingCur.id; }
            } else {
              leftHoldFrames = 0;
              rightHoldFrames = 0;
            }
            nodeDwellFrames = 0;
          } else if (releasedSling) {
            nodeDwellFrames = 0;
          } else {
          var nb = adjacency[spider.nodeId];
          if (nb.length > 0) {
            spider.selIdx = ((spider.selIdx % nb.length) + nb.length) % nb.length;

            if (inp.left) {
              leftHoldFrames++;
              if (leftHoldFrames === 1 || (leftHoldFrames > HOLD_DELAY && (leftHoldFrames - HOLD_DELAY) % HOLD_REPEAT === 0))
                spider.selIdx = (spider.selIdx - 1 + nb.length) % nb.length;
            } else { leftHoldFrames = 0; }

            if (inp.right) {
              rightHoldFrames++;
              if (rightHoldFrames === 1 || (rightHoldFrames > HOLD_DELAY && (rightHoldFrames - HOLD_DELAY) % HOLD_REPEAT === 0))
                spider.selIdx = (spider.selIdx + 1) % nb.length;
            } else { rightHoldFrames = 0; }

            nodeDwellFrames++;
            if (inp.a && nodeDwellFrames >= NODE_DWELL) {
              spider.fromId = spider.nodeId;
              spider.toId   = nb[spider.selIdx];
              spider.t      = 0;
              spider.state  = 'TRAVERSING';
              traversalInputBuffer = null;
            }
          } else {
            // Node became isolated — rescue spider by sending it back toward fromId
            var rescueId = (adjacency[spider.fromId] && adjacency[spider.fromId].length > 0)
              ? spider.fromId : 0;
            spider.toId   = rescueId;
            spider.fromId = spider.nodeId;
            spider.t      = 0;
            spider.state  = 'TRAVERSING';
            traversalInputBuffer = null;
          }
          }
        } else {
          slingActive = false;
          slingTargetId = null;
          slingTargetBug = null;
          if (inp.left && !inp.right)      traversalInputBuffer = 'left';
          else if (inp.right && !inp.left) traversalInputBuffer = 'right';
          spider.t += TRAVERSE_SPEED;
          var repairKey = edgeKey(spider.fromId, spider.toId);
          if (edgeStrength[repairKey] !== undefined) {
            edgeStrength[repairKey] = Math.min(100, edgeStrength[repairKey] + REPAIR_PER_FRAME);
          }
          if (spider.t >= 1) {
            var prevFrom  = spider.fromId;
            spider.state  = 'AT_NODE';
            spider.nodeId = spider.toId;
            nodeDwellFrames = 0;
            leftHoldFrames  = 0;
            rightHoldFrames = 0;
            var nb2 = adjacency[spider.nodeId];
            spider.selIdx = nb2.length > 0 ? bestForwardIdx(spider.nodeId, prevFrom) : 0;
            if (traversalInputBuffer !== null && nb2.length > 0) {
              spider.selIdx = traversalInputBuffer === 'left'
                ? (spider.selIdx - 1 + nb2.length) % nb2.length
                : (spider.selIdx + 1) % nb2.length;
              traversalInputBuffer = null;
            }
            // Eat bugs sitting on the node we just landed on
            for (var eatBi = bugs.length - 1; eatBi >= 0; eatBi--) {
              if (bugs[eatBi].nodeId === spider.nodeId) {
                var eatVal = bugs[eatBi].type === 'canyon' ? 10 : (BUG_SCORES[bugs[eatBi].tier] || 1);
                bugs.splice(eatBi, 1);
                score += eatVal;
                silk = Math.min(SILK_MAX, silk + eatVal);
                playSound('chomp');
                triggerEatAnim();
              }
            }
            // Previous node may now be an unoccupied 2-segment pass-through — collapse it
            collapseShortEdges();
          }
        }

        // --- Eat bugs near spider (using updated position) ---
        checkSpiderEatsBugs();
        wasBDown = bDown;
      }

      // --- Update camera ---
      if (gamePhase === 'PLAYING' && rotationEnabled) {
        var target = targetCameraAngle();
        cameraAngle += angleDiff(target, cameraAngle) * ROTATION_LERP;
      }

      // --- Spider world position ---
      var sp = spiderWorldPos();

      // --- Dynamic zoom: zoom in on short adjacent segments ---
      if (gamePhase === 'PLAYING') {
        var shortestSegLen = webRadius;
        if (spider.state === 'AT_NODE') {
          var znb = adjacency[spider.nodeId];
          for (var zi = 0; zi < znb.length; zi++) {
            var zsdx = nodes[spider.nodeId].x - nodes[znb[zi]].x;
            var zsdy = nodes[spider.nodeId].y - nodes[znb[zi]].y;
            var zslen = Math.sqrt(zsdx * zsdx + zsdy * zsdy);
            if (zslen < shortestSegLen) shortestSegLen = zslen;
          }
        } else {
          var zsdx = nodes[spider.fromId].x - nodes[spider.toId].x;
          var zsdy = nodes[spider.fromId].y - nodes[spider.toId].y;
          shortestSegLen = Math.sqrt(zsdx * zsdx + zsdy * zsdy);
        }
        var zoomFraction = 1 - Math.min(shortestSegLen / webRadius, 1);
        var targetScale  = baseScale * (1 + (MAX_ZOOM - 1) * zoomFraction);
        cameraScale += (targetScale - cameraScale) * ZOOM_LERP;
      }

      // --- Identify highlighted edges ---
      var selA = -1, selB = -1;
      if (!slingActive && spider.state === 'AT_NODE' && adjacency[spider.nodeId].length > 0) {
        selA = spider.nodeId;
        selB = adjacency[spider.nodeId][spider.selIdx];
        if (selA > selB) { var tmp = selA; selA = selB; selB = tmp; }
      }
      var travA = -1, travB = -1;
      if (spider.state === 'TRAVERSING') {
        travA = Math.min(spider.fromId, spider.toId);
        travB = Math.max(spider.fromId, spider.toId);
      }

      // --- Draw background ---
      ctx.fillStyle = '#030308';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (bgDawnT > 0) {
        var gradR = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
        var grad  = ctx.createRadialGradient(0, 0, 0, 0, 0, gradR);
        grad.addColorStop(0,   'rgba(10,32,80,'  + bgDawnT.toFixed(3) + ')');
        grad.addColorStop(0.4, 'rgba(7,18,50,'   + (bgDawnT * 0.45).toFixed(3) + ')');
        grad.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if (bgDayT > 0) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        var diagLen = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
        var dayGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, diagLen);
        dayGrad.addColorStop(0,   'rgba(135,206,235,' + bgDayT.toFixed(3) + ')');
        dayGrad.addColorStop(0.6, 'rgba(100,180,220,' + (bgDayT * 0.7).toFixed(3) + ')');
        dayGrad.addColorStop(1,   'rgba(60,120,180,'  + (bgDayT * 0.3).toFixed(3) + ')');
        ctx.fillStyle = dayGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
      if (gamePhase === 'COLLAPSE') {
        drawCollapseAway();
        return;
      }
      if (gamePhase === 'NIGHTFALL') {
        if (overlayAlpha > 0) {
          ctx.fillStyle = 'rgba(0,0,0,' + overlayAlpha.toFixed(3) + ')';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        return;
      }
      ctx.lineCap = 'round';

      // --- Apply camera transform ---
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(cameraScale, cameraScale);
      ctx.rotate(cameraAngle + collapseSpinAngle);
      var dx = -sp.x + introCamX;
      var dy = -sp.y + introCamY;
      var invScale = 1 / Math.max(cameraScale, 0.001);

      // Build bug position lookup (landed bugs pull strands to their wiggled position)
      var bugPos = {};
      for (var bi = 0; bi < bugs.length; bi++) {
        if (bugs[bi].landed) bugPos[bugs[bi].nodeId] = bugs[bi];
      }

      // --- Draw edges ---
      for (var i = 0; i < nodes.length; i++) {
        var nbArr = adjacency[i];
        for (var j = 0; j < nbArr.length; j++) {
          var nb2 = nbArr[j];
          if (nb2 <= i) continue;

          var posA = bugPos[i]   || nodes[i];
          var posB = bugPos[nb2] || nodes[nb2];
          var ax = posA.x + dx, ay = posA.y + dy;
          var bx = posB.x + dx, by = posB.y + dy;

          var lo = Math.min(i, nb2), hi = Math.max(i, nb2);
          var isSel  = (lo === selA  && hi === selB);
          var isTrav = (lo === travA && hi === travB);

          if (isSel) {
            drawEdge(ax, ay, bx, by, 'rgba(255,220,0,0.95)', 2 * invScale, 'rgba(255,200,0,0.12)');
          } else if (isTrav) {
            var travStr = edgeStrength[edgeKey(i, nb2)];
            var travWidth = travStr !== undefined ? (0.8 + (travStr / 100) * 2.8) * invScale : 2 * invScale;
            drawEdge(ax, ay, bx, by, 'rgba(0,229,255,0.72)', travWidth, 'rgba(0,229,255,0.08)');
            var repairT = i === spider.fromId ? spider.t : 1 - spider.t;
            drawRepairSegment(ax, ay, bx, by, repairT, 2.5 * invScale);
          } else {
            var str = edgeStrength[edgeKey(i, nb2)];
            var ec  = str !== undefined ? edgeColorForStrength(str) : 'rgba(0,150,185,0.28)';
            var thick = str !== undefined ? (0.4 + (str / 100) * 2.6) * invScale : 0.5 * invScale;
            if (gamePhase === 'COLLAPSE') thick = Math.max(thick, invScale);
            var dashed = str !== undefined && str < DASH_THRESHOLD;
            drawEdge(ax, ay, bx, by, ec, thick, null, dashed);
          }
        }
      }

      // --- Draw sling aim + newly spun strands ---
      for (var si = 0; si < slingStrands.length; si++) {
        var strand = slingStrands[si];
        if (strand.toBugRef !== undefined) {
          var strandBug = strand.toBugRef;
          var strandBugIdx = bugs.indexOf(strandBug);
          var strandInvalid = strandBugIdx < 0 || (strandBug.type === 'canyon' ? !strandBug.landed : strandBug.landed);
          if (strandInvalid) continue;
          var sFromB = nodes[strand.fromId];
          if (!sFromB) continue;
          var stB = Math.max(0, Math.min(strand.t, 1));
          drawEdge(
            sFromB.x + dx, sFromB.y + dy,
            sFromB.x + (strandBug.x - sFromB.x) * stB + dx,
            sFromB.y + (strandBug.y - sFromB.y) * stB + dy,
            'rgba(255,200,80,0.95)', 2.4 * invScale, 'rgba(255,150,0,0.18)'
          );
          continue;
        }
        if (!nodes[strand.fromId] || !nodes[strand.toId] || nodes[strand.fromId].dead || nodes[strand.toId].dead) continue;
        var sFrom = nodes[strand.fromId];
        var sTo = nodes[strand.toId];
        var st = Math.max(0, Math.min(strand.t, 1));
        var sx = sFrom.x + dx;
        var sy = sFrom.y + dy;
        var ex = sFrom.x + (sTo.x - sFrom.x) * st + dx;
        var ey = sFrom.y + (sTo.y - sFrom.y) * st + dy;
        drawEdge(sx, sy, ex, ey, 'rgba(145,245,255,0.95)', 2.4 * invScale, 'rgba(0,229,255,0.18)');
      }

      if (slingActive && slingTargetId !== null && spider.state === 'AT_NODE' && nodes[slingTargetId] && !nodes[slingTargetId].dead) {
        var aimFrom = nodes[spider.nodeId];
        var aimTo = bugPos[slingTargetId] || nodes[slingTargetId];
        var canSling = silkUnlimited || silk >= SILK_COST;
        var aimColor = canSling ? 'rgba(120,220,255,0.46)' : 'rgba(255,80,80,0.46)';
        var aimGlow  = canSling ? 'rgba(0,229,255,0.10)'   : 'rgba(255,40,40,0.10)';
        ctx.setLineDash([16 * invScale, 12 * invScale]);
        drawEdge(
          aimFrom.x + dx, aimFrom.y + dy,
          aimTo.x + dx, aimTo.y + dy,
          aimColor,
          2 * invScale,
          aimGlow,
          true
        );
        ctx.setLineDash([]);
      }

      if (slingActive && slingTargetBug !== null && spider.state === 'AT_NODE') {
        var aimBug = bugs[slingTargetBug];
        var aimBugValid = aimBug && (aimBug.type === 'canyon' ? aimBug.landed : !aimBug.landed);
        if (aimBugValid) {
          var aimFromB = nodes[spider.nodeId];
          var canSlingB = silkUnlimited || silk >= SILK_COST;
          var aimColorB = canSlingB ? 'rgba(255,200,80,0.46)' : 'rgba(255,80,80,0.46)';
          var aimGlowB  = canSlingB ? 'rgba(255,150,0,0.10)'  : 'rgba(255,40,40,0.10)';
          ctx.setLineDash([16 * invScale, 12 * invScale]);
          drawEdge(
            aimFromB.x + dx, aimFromB.y + dy,
            aimBug.x + dx, aimBug.y + dy,
            aimColorB, 2 * invScale, aimGlowB, true
          );
          ctx.setLineDash([]);
        }
      }

      // --- Draw bugs (before nodes so nodes sit on top) ---
      var bugPulse = 0.5 + 0.5 * Math.sin(gameFrame * 0.12);
      var BUG_COLORS = [
        { r: '255,140,0',  glow: '255,80,0'  },
        { r: '180,50,255', glow: '140,0,220' },
        { r: '50,220,80',  glow: '0,180,40'  }
      ];
      for (var bi = 0; bi < bugs.length; bi++) {
        var bug  = bugs[bi];
        var bx2  = bug.x + dx, by2 = bug.y + dy;
        var baseR = 8 * invScale;
        if (bug.type === 'canyon' && canyonImg.complete && canyonImg.naturalWidth > 0) {
          var fW = canyonImg.naturalWidth / CANYON_COLS;
          var fH = canyonImg.naturalHeight / CANYON_ROWS;
          var fi = bug.animFrame;
          var srcX = (fi % CANYON_COLS) * fW;
          var srcY = Math.floor(fi / CANYON_COLS) * fH;
          var drawSize = (bug.hit ? 28 : 56) * invScale;
          ctx.save();
          ctx.translate(bx2, by2);
          ctx.rotate(-Math.PI / 2);
          ctx.drawImage(canyonImg, srcX, srcY, fW, fH, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
          ctx.restore();
          if (slingActive && slingTargetBug === bi) {
            ctx.beginPath();
            ctx.arc(bx2, by2, drawSize * 0.8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,200,80,0.7)';
            ctx.lineWidth = 1.5 * invScale;
            ctx.stroke();
          }
          continue;
        }
        var col  = BUG_COLORS[bug.tier] || BUG_COLORS[0];
        if (bug.landed) {
          ctx.beginPath();
          ctx.arc(bx2, by2, baseR * (2 + bugPulse), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + col.glow + ',' + (0.06 + bugPulse * 0.10).toFixed(2) + ')';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(bx2, by2, baseR, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + col.r + ',0.92)';
          ctx.fill();
        } else {
          // Amber targeting ring for the bug currently in sling aim
          if (slingActive && slingTargetBug === bi) {
            ctx.beginPath();
            ctx.arc(bx2, by2, baseR * 1.8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,200,80,0.7)';
            ctx.lineWidth = 1.5 * invScale;
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(bx2, by2, baseR * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + col.r + ',0.5)';
          ctx.fill();
        }
      }

      // --- Draw nodes ---
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].dead) continue;
        if (bugPos[i]) continue;
        var nx = nodes[i].x + dx;
        var ny = nodes[i].y + dy;

        var isHub     = i === 0;
        var isCurr    = spider.state === 'AT_NODE' && i === spider.nodeId;
        var isNextN   = spider.state === 'AT_NODE' && adjacency[spider.nodeId].length > 0
                        && i === adjacency[spider.nodeId][spider.selIdx];
        var isSlingTarget = slingActive && slingTargetId !== null && i === slingTargetId;
        var isTravDst = spider.state === 'TRAVERSING' && i === spider.toId;

        var r, color, glowColor, glowR;
        if (isCurr) {
          r = 6; color = '#ffffff'; glowColor = 'rgba(255,255,255,0.28)'; glowR = 18;
        } else if (isSlingTarget) {
          r = 5; color = '#91f5ff'; glowColor = 'rgba(0,229,255,0.24)'; glowR = 15;
        } else if (isNextN || isTravDst) {
          r = 5; color = '#ffdc00'; glowColor = 'rgba(255,220,0,0.22)'; glowR = 15;
        } else if (isHub) {
          r = 8; color = '#00e5ff'; glowColor = 'rgba(0,229,255,0.18)'; glowR = 20;
        } else {
          r = 4; color = '#007a96'; glowColor = 'rgba(0,122,150,0.12)'; glowR = 10;
        }

        drawNode(nx, ny, r * invScale, color, glowColor, glowR * invScale);
      }

      // --- Spider triangle (world-space, scales with camera) ---
      var ssx = sp.x + dx, ssy = sp.y + dy;
      var ts  = 11 * invScale;
      var facingAngle = 0;
      if (slingActive && slingTargetBug !== null && bugs[slingTargetBug] && !bugs[slingTargetBug].landed) {
        var slingBugN = bugs[slingTargetBug];
        facingAngle = Math.atan2(slingBugN.y + dy - ssy, slingBugN.x + dx - ssx) + Math.PI / 2;
      } else if (slingActive && slingTargetId !== null && nodes[slingTargetId]) {
        var slingN = nodes[slingTargetId];
        facingAngle = Math.atan2(slingN.y + dy - ssy, slingN.x + dx - ssx) + Math.PI / 2;
      } else if (spider.state === 'AT_NODE' && adjacency[spider.nodeId].length > 0) {
        var nextN = nodes[adjacency[spider.nodeId][spider.selIdx]];
        facingAngle = Math.atan2(nextN.y + dy - ssy, nextN.x + dx - ssx) + Math.PI / 2;
      } else if (spider.state === 'TRAVERSING') {
        var toN = nodes[spider.toId];
        facingAngle = Math.atan2(toN.y + dy - ssy, toN.x + dx - ssx) + Math.PI / 2;
      }
      var spiderAnimating = spider.state === 'TRAVERSING'
        || slingActive
        || (spider.state === 'AT_NODE' && (inp.left || inp.right));
      if (spiderAnimating) {
        spiderAnimTimer++;
        if (spiderAnimTimer >= SPIDER_FRAME_RATE) {
          spiderAnimTimer = 0;
          spiderAnimFrame = (spiderAnimFrame + 1) % SPIDER_FRAME_COUNT;
        }
      } else {
        spiderAnimFrame = 0;
        spiderAnimTimer = 0;
      }

      ctx.save();
      ctx.translate(ssx, ssy);
      ctx.rotate(facingAngle + Math.PI);
      if (eatAnimTimer > 0) {
        var ep = eatAnimTimer / EAT_ANIM_FRAMES; // 1→0 as animation plays
        var esx, esy;
        if (eatAnimStyle === 0) {
          var es = 1 + 0.5 * Math.sin(ep * Math.PI);
          esx = es; esy = es;
        } else {
          if (ep > 0.7) {
            var t0 = (1.0 - ep) / 0.3; // 0→1 as ep goes 1.0→0.7
            esx = 1 - 0.3 * t0; esy = 1 + 0.5 * t0; // normal→stretched tall
          } else if (ep > 0.35) {
            var t1 = (0.7 - ep) / 0.35; // 0→1 as ep goes 0.7→0.35
            esx = 0.7 + 0.7 * t1; esy = 1.5 - 0.8 * t1; // stretched tall→squished wide
          } else {
            var t2 = (0.35 - ep) / 0.35; // 0→1 as ep goes 0.35→0
            esx = 1.4 - 0.4 * t2; esy = 0.7 + 0.3 * t2; // squished wide→normal
          }
        }
        ctx.scale(esx, esy);
      }
      if (spiderImg.complete && spiderImg.naturalWidth > 0 && spiderFrameOrbs) {
        var imgW = spiderImg.naturalWidth, imgH = spiderImg.naturalHeight;
        var drawH = ts * 24.75;
        var scale = drawH / imgH;
        var slotW = (imgW / SPIDER_FRAME_COUNT) * scale;
        var orb = spiderFrameOrbs[spiderAnimFrame];
        ctx.save();
        ctx.beginPath();
        ctx.rect(-slotW / 2, -drawH / 2, slotW, drawH);
        ctx.clip();
        ctx.drawImage(spiderImg, -orb.cx * scale, -orb.cy * scale, imgW * scale, imgH * scale);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.moveTo(0,           -ts);
        ctx.lineTo(ts * 0.78,   ts * 0.65);
        ctx.lineTo(-ts * 0.78,  ts * 0.65);
        ctx.closePath();
        ctx.fillStyle   = '#e8f8ff';
        ctx.fill();
      }
      ctx.restore();

      ctx.restore();

      // --- Fade overlay (nightfall / dawn) ---
      if (overlayAlpha > 0) {
        ctx.fillStyle = 'rgba(0,0,0,' + overlayAlpha.toFixed(3) + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // --- HUD bars (always visible during active gameplay) ---
      var barW = 120, barH = 9;
      var barX = canvas.width - 14 - barW;
      ctx.font = '11px monospace';
      ctx.textAlign = 'right';

      // SILK bar (only during PLAYING and DAY_BREAK)
      if (gamePhase === 'PLAYING' || gamePhase === 'DAY_BREAK') {
        if (silkUnlimited) {
          var flash = Math.sin(phaseFrame * 0.18) > 0;
          if (flash) {
            ctx.fillStyle = 'rgba(255,255,120,0.95)';
            ctx.font = 'bold 11px monospace';
            ctx.fillText('UNLIMITED SILK', barX + barW, 23);
            ctx.font = '11px monospace';
          }
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(barX, 14, barW, barH);
          ctx.fillStyle = flash ? 'rgba(255,255,120,0.85)' : 'rgba(255,220,80,0.5)';
          ctx.fillRect(barX, 14, barW, barH);
        } else {
          ctx.fillStyle = 'rgba(0,229,255,0.55)';
          ctx.fillText('SILK', barX - 6, 23);
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(barX, 14, barW, barH);
          ctx.fillStyle = silk < SILK_COST ? 'rgba(255,80,80,0.8)' : 'rgba(0,229,255,0.75)';
          ctx.fillRect(barX, 14, barW * (silk / SILK_MAX), barH);
        }
      }

      // WEB integrity bar (always visible)
      var webIntegrity = getIntegrity();
      var webBarColor = webIntegrity > 0.6 ? 'rgba(0,229,255,0.75)' : webIntegrity > 0.4 ? 'rgba(255,170,0,0.85)' : 'rgba(255,60,60,0.9)';
      ctx.fillStyle = 'rgba(0,229,255,0.55)';
      ctx.font = '11px monospace';
      ctx.fillText('WEB', barX - 6, 40);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(barX, 31, barW, barH);
      ctx.fillStyle = webBarColor;
      ctx.fillRect(barX, 31, barW * webIntegrity, barH);

      // LVL indicator (always visible, below WEB bar)
      ctx.fillStyle = 'rgba(0,229,255,0.55)';
      ctx.fillText('LEVEL', barX - 6, 57);
      ctx.fillStyle = 'rgba(0,229,255,0.9)';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(level, barX + barW, 57);
      ctx.font = '11px monospace';

      // Bottom hint and level announcement (PLAYING and DAY_BREAK only)
      if (gamePhase === 'PLAYING' || gamePhase === 'DAY_BREAK') {
        ctx.font = '13px monospace';
        ctx.textAlign = 'left';
        if (gamePhase === 'PLAYING') {
          ctx.fillStyle = 'rgba(0,229,255,0.3)';
          ctx.fillText('left/right  steer   [A]  move   [B]  sling   [R]  rotation: ' + (rotationEnabled ? 'ON' : 'OFF') + '   [N]  new web', 14, canvas.height - 14);
        } else {
          var repairSecsLeft = Math.ceil((DAY_BREAK_FRAMES - phaseFrame) / 60);
          ctx.fillStyle = 'rgba(255,255,120,0.6)';
          ctx.fillText('REPAIR PHASE — ' + repairSecsLeft + 's', 14, canvas.height - 14);
        }

        // Level announcement
        if (levelAnnounceFrames > 0) {
          var announceFade = Math.min(1, levelAnnounceFrames / 30);
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.textAlign = 'center';
          ctx.font = 'bold 22px monospace';
          ctx.fillStyle = 'rgba(255,255,180,' + announceFade.toFixed(3) + ')';
          ctx.fillText('LEVEL ' + level, canvas.width / 2, 40);
          ctx.restore();
        }
      }

      ctx.textAlign = 'left';
    }

    loop();
  </script>
</body>
</html>
